<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>fixture: score survives restart</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
// 다른 규칙은 전부 만족하고 start()가 점수를 되돌리지 않는 게임.
// 재시작 측정을 start() 직후 읽기로 바꿨으므로, 그 변경이 이 규칙을 무디게 하지
// 않았는지 여기서 확인한다 — 게이트는 통과가 아니라 "막았을 때"로 검증한다.
const c = document.getElementById('c');
c.addEventListener('touchstart', () => {});
const ctx = c.getContext('2d');
const BAND = 390 / 806;
let state = 'title', score = 0, tick = 0, lastInput = 0;
const poke = () => { if (state === 'playing') { score++; lastInput = performance.now(); } };
window.addEventListener('keydown', poke);
c.addEventListener('pointerdown', poke);
function band() {
  const sw = c.clientWidth, h = c.clientHeight;
  const w = Math.min(sw, Math.round(h * BAND));
  return { x: Math.round((sw - w) / 2), y: 0, w, h, screenW: sw };
}
function frame() {
  tick++;
  // 손대지 않으면 5초 뒤에 끝난다 — 방치 종결 규칙은 통과시킨다
  if (state === 'playing' && performance.now() - lastInput > 5000) state = 'over';
  ctx.fillStyle = '#123'; ctx.fillRect(0, 0, 4000, 4000);
  ctx.fillStyle = '#0f8'; ctx.fillRect((tick * 2) % 300, 140, 40, 40);
  requestAnimationFrame(frame);
}
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  get field() { return band(); },
  start() { state = 'playing'; lastInput = performance.now(); },   // score를 되돌리지 않는다
  pause() {}, resume() {}
};
requestAnimationFrame(frame);
</script></body></html>
