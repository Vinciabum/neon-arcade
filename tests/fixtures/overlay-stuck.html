<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>fixture: overlay stuck</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(4,6,12,.4);color:#8ff;font:600 20px system-ui}
  /* 베일을 반투명하게 둔 이유: .88이면 캔버스 픽셀이 거의 통과하지 못해
     "빈 화면" 규칙까지 같이 걸린다. 덮는다는 사실만 남기고 나머지는 통과시킨다. */
</style></head>
<body><canvas id="c"></canvas><div id="veil"><p>Loading assets…</p></div><script>
// 단 하나의 결함: 캔버스는 잘 그리는데 베일이 절대 걷히지 않는다 — 모든 스크린샷은 게임 화면이 아니다.
// 베일은 클릭·키로 사라지지 않고, 텍스트도 START_TEXT에 걸리지 않는다. 걷힐 방법이 없다.
//
// 계약(window.__GAME__)이 load-bearing인 이유: 계약이 없으면 legacy 모드가 되고,
// legacy에서는 "canvas covered by an overlay"가 보류(skipped)로 내려간다. 그러면 이 픽스처는
// 어떤 규칙에도 걸리지 않고 그냥 통과한다 — 덮인 화면도 입력에 잘 반응하므로 게이트 2의
// 반응성 규칙마저 통과한다. 그래서 계약을 넣고 게이트 2가 보는 것은 모두 건강하게 둔다.
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let state = 'title', score = 0, tick = 0, lastInput = 0;
// 포인터 입력은 베일이 먼저 받는다. 그래서 캔버스가 아니라 window에서 듣는다 (베일에서 버블링된다).
const bump = () => { if (state === 'playing') { score++; lastInput = tick; } };
c.addEventListener('touchstart', bump);
window.addEventListener('pointerdown', bump);
window.addEventListener('keydown', bump);
function frame() {
  tick++;
  if (state === 'playing' && tick - lastInput > 300) state = 'over';   // 무입력 5초면 종료
  ctx.fillStyle = '#123'; ctx.fillRect(0, 0, 4000, 4000);
  ctx.fillStyle = '#ff0'; ctx.fillRect((tick * 3) % 320, 50, 60, 60);   // 기본 300x150 버퍼 안에 그린다
  requestAnimationFrame(frame);
}
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  start() { state = 'playing'; score = 0; lastInput = tick; },
  pause() {}, resume() {}
};
requestAnimationFrame(frame);
</script></body></html>
