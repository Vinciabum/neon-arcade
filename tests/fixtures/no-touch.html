<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>fixture: no touch</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
// 키보드 전용 게임. 모바일에서는 조작할 수 없으니 게이트 1이 막아야 한다.
//
// 계약(window.__GAME__)을 넣은 이유 — 이게 없으면 이 픽스처는 그냥 통과한다:
// 계약이 없으면 verify가 triggerStart를 부르고, 그 안의 boundingBox() 한 번만으로
// Playwright(1.60)가 페이지에 touchstart·touchend·pointerdown 등 자기 히트타깃 리스너를 심는다.
// 프로브가 addEventListener를 후킹해 목록을 만들므로 그 리스너들이 그대로 섞여
// 터치 검사가 무조건 통과해버린다 (실측 확인). 계약 모드는 triggerStart를 건너뛴다.
const ctx = document.getElementById('c').getContext('2d');
let state = 'title', score = 0, tick = 0, lastInput = 0;
window.addEventListener('keydown', () => { if (state === 'playing') { score++; lastInput = tick; } });
function frame() {
  tick++;
  if (state === 'playing' && tick - lastInput > 300) state = 'over';   // 무입력 5초면 종료 (게이트 2는 통과해야 한다)
  ctx.fillStyle = '#123'; ctx.fillRect(0, 0, 4000, 4000);
  ctx.fillStyle = '#f0f'; ctx.fillRect((score * 20) % 260, 100, 40, 40);
  requestAnimationFrame(frame);
}
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  start() { state = 'playing'; score = 0; lastInput = tick; },
  pause() {}, resume() {}
};
requestAnimationFrame(frame);
</script></body></html>
