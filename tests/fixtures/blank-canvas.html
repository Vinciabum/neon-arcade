<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>fixture: blank canvas</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const c = document.getElementById('c');
c.addEventListener('touchstart', () => {});
const ctx = c.getContext('2d');
function frame() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 4000, 4000); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
