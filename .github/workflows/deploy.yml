name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site (validation gates enforced)
        run: npm run build
        env:
          GA_ID: ${{ vars.GA_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Verify build output
        run: |
          test -f index.html
          test -f sitemap.xml
          test -f robots.txt
          test -f 404.html
          test -f llms.txt
          test -f CNAME
          grep -q "just1game.com" CNAME
          # 배포본이 /play/ 를 다시 막지 않는지 확인한다. 막으면 랜딩의 iframe 안이
          # 크롤러에게 통째로 안 보이고, 게임 본체의 noindex도 읽히지 않는다.
          ! grep -q "Disallow: /play/" robots.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
