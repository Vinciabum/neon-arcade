<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dodge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 3rem;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(45deg, #00ff00, #008800);
            border: none;
            padding: 15px 40px;
            color: #000;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: inherit;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ff00;
            transition: 0.2s;
            margin: 10px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #fff;
            z-index: 5;
        }

        .shop-item {
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 20, 10, 0.8);
            text-align: center;
            margin-bottom: 20px;
        }

        .shop-title {
            color: #00ffff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .price {
            color: #fff;
            margin-bottom: 15px;
        }

        .hidden {
            display: none !important;
        }

        /* Screen Shake Animation */
        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        .shake-effect {
            animation: shake 0.5s;
            /* Run for 0.5 seconds */
            animation-iteration-count: 1;
        }

        /* Red Flash Overlay */
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 100;
        }
    </style>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://just1game.com/games/neon-dodge/">
</head>

<body>

    <div id="damage-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div class="hud" id="hud">
        <div>TIME: <span id="timeDisplay">0</span>s</div>
        <div style="color: #ffd700;">COINS: <span id="coinDisplay">0</span></div>
    </div>

    <div id="ui-layer">
        <!-- LOBBY SCREEN -->
        <div id="lobbyScreen" class="screen">
            <h1>NEON DODGE</h1>
            <p>Dodge the Spikes • Survive</p>

            <!-- SHOP SECTION -->
            <div id="shopSection">
                <div class="shop-item">
                    <div class="shop-title">ENERGY SHIELD</div>
                    <div class="price">200 COINS</div>
                    <button id="btnBuyShield" class="btn" onclick="buyUpgrade()">BUY UPGRADE</button>
                    <div id="shopMsg" style="color: red; font-size: 0.8rem; height: 1rem;"></div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">START RUN</button>
            <button class="btn" onclick="location.href='../index.html'"
                style="background: #555; color: #fff; box-shadow: none;">HOME</button>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff0000; text-shadow: 0 0 20px #ff0000;">NO SIGNAL</h1>
            <p>Survived: <span id="finalTime">0</span>s</p>
            <button class="btn" onclick="startGame()">RETRY</button>
            <button class="btn" onclick="showLobby()">LOBBY</button>
        </div>
    </div>

    <!-- Game Juice -->
    <script src="../assets/game_juice.js"></script>

    <script>
        // --- 1. ASSETS ---
        // 플레이어·해저드는 외부 이미지 없이 캔버스로만 그린다.
        // 실루엣으로 구분한다 — 플레이어는 매끈한 원, 해저드는 뾰족한 파편.
        // 색맹인 사람도 색이 아니라 모양만으로 어느 쪽이 나인지 알 수 있어야 한다.
        const TAU = Math.PI * 2;
        const P_R = 16;          // 플레이어 반지름 (기존 스프라이트 50px 자리)
        const HAZ_R = 20;        // 해저드 반지름 (기존 스프라이트 40px 자리)
        const P_GLOW = '#39ff8b', P_CORE = '#f2fff6';
        const HAZ_GLOW = '#ff2b5e', HAZ_EDGE = '#ffd6e2', HAZ_HOLE = '#18000a';

        // 해저드는 한 프레임에 수십 개가 그려진다. 글로우를 매번 계산하면 fps가 무너지므로
        // 오프스크린에 한 번만 구워두고 그 뒤로는 drawImage만 한다.
        const HAZ_SS = 2;        // 2배로 구워야 회전시켜도 가장자리가 뭉개지지 않는다
        const HAZ_PAD = 7;       // 글로우가 스프라이트 밖으로 잘리지 않도록
        const hazSprite = (() => {
            const cv = document.createElement('canvas');
            cv.width = cv.height = Math.ceil((HAZ_R + HAZ_PAD) * 2 * HAZ_SS);
            const g = cv.getContext('2d');
            g.translate(cv.width / 2, cv.height / 2);
            g.scale(HAZ_SS, HAZ_SS);

            const spikes = 7;
            g.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const rad = (i % 2) ? HAZ_R * 0.44 : HAZ_R;
                const a = (i / (spikes * 2)) * TAU - Math.PI / 2;
                const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
                if (i) g.lineTo(x, y); else g.moveTo(x, y);
            }
            g.closePath();

            g.shadowColor = HAZ_GLOW;
            g.shadowBlur = 12;
            g.fillStyle = HAZ_GLOW;
            g.fill(); g.fill();  // 두 번 칠해 바깥 글로우를 진하게
            g.shadowBlur = 0;
            g.lineWidth = 2; g.strokeStyle = HAZ_EDGE; g.stroke();

            // 가운데를 비운다 — 작은 화면에서 원형 덩어리로 뭉개지지 않고 '가시'로 읽힌다
            g.beginPath(); g.arc(0, 0, HAZ_R * 0.19, 0, TAU);
            g.fillStyle = HAZ_HOLE; g.fill();
            return cv;
        })();
        const HAZ_DRAW = hazSprite.width / HAZ_SS;   // drawImage에 넘길 CSS 픽셀 크기
        const HAZ_HALF = HAZ_DRAW / 2;

        const svgShield = `<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><circle cx="15" cy="15" r="12" fill="none" stroke="#00ffff" stroke-width="3"/></svg>`;
        const shieldImg = new Image(); shieldImg.src = 'data:image/svg+xml;base64,' + btoa(svgShield);

        // --- 2. ECONOMY ---
        function getCoins() {
            return parseInt(localStorage.getItem('neonCoins') || '0');
        }
        function saveCoins(amount) {
            localStorage.setItem('neonCoins', amount);
            updateUI();
        }

        // Game Specific Data
        let gameData = JSON.parse(localStorage.getItem('neonDodgeData')) || { hasShield: false };
        function saveGameData() {
            localStorage.setItem('neonDodgeData', JSON.stringify(gameData));
        }

        function buyUpgrade() {
            const cost = 200;
            const currentCoins = getCoins();
            const msgEl = document.getElementById('shopMsg');

            if (gameData.hasShield) {
                msgEl.innerText = "ALREADY EQUIPPED!";
                return;
            }

            if (currentCoins >= cost) {
                saveCoins(currentCoins - cost);
                gameData.hasShield = true;
                saveGameData();
                updateShopUI();
                msgEl.style.color = '#00ff00';
                msgEl.innerText = "SHIELD EQUIPPED!";
            } else {
                msgEl.style.color = '#ff0000';
                msgEl.innerText = "NOT ENOUGH COINS!";
            }
        }

        function updateShopUI() {
            const btn = document.getElementById('btnBuyShield');
            if (gameData.hasShield) {
                btn.innerText = "EQUIPPED";
                btn.disabled = true;
                btn.style.background = "#333";
                btn.style.boxShadow = "none";
            } else {
                btn.innerText = "BUY (200)";
                btn.disabled = false;
            }
        }
        function updateUI() {
            document.getElementById('coinDisplay').innerText = getCoins();
        }

        // --- 3. GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        let state = 'LOBBY';
        let startTime = 0;
        let elapsedTime = 0;
        let protection = false;

        // Touch Offset
        const TOUCH_OFFSET_Y = 50;

        const player = { x: w / 2, y: h / 2, r: 20 };
        let enemies = [];
        let particles = [];
        let nextSpawn = 0;
        let animationId;

        // Controls
        let isDragging = false;
        function updatePlayerPos(cx, cy, isTouch = false) {
            if (state !== 'PLAYING') return;
            player.x = cx;
            player.y = cy;

            if (isTouch) player.y -= TOUCH_OFFSET_Y;

            // Clamp
            if (player.x < 10) player.x = 10;
            if (player.x > w - 10) player.x = w - 10;
            if (player.y < 10) player.y = 10;
            if (player.y > h - 10) player.y = h - 10;
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (state === 'LOBBY' || state === 'GAMEOVER') {
                    GameJuice.initAudio();
                    startGame();
                }
            }
        });

        // Touch Setup
        GameJuice.setupTouchControls();

        window.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('touchstart', e => { isDragging = true; updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true); }, { passive: false });

        ['mouseup', 'touchend'].forEach(evt => window.addEventListener(evt, () => isDragging = false));

        window.addEventListener('mousemove', e => { if (isDragging) updatePlayerPos(e.clientX, e.clientY); });

        window.addEventListener('touchmove', e => {
            // e.preventDefault(); handled by GameJuice
            if (state === 'PLAYING') updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true);
        }, { passive: false });


        function startGame() {
            if (state === 'PLAYING') return;
            state = 'PLAYING';
            startTime = Date.now();
            elapsedTime = 0;
            enemies = [];
            particles = [];
            player.x = w / 2; player.y = h / 2;

            // Shield is a PERMANENT upgrade that grants ONE use per run
            protection = gameData.hasShield;

            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.body.classList.remove('shake-effect'); // Reset shake

            cancelAnimationFrame(animationId);
            loop();
        }

        function showLobby() {
            state = 'LOBBY';
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.body.classList.remove('shake-effect');
            updateShopUI();
            updateUI();

            cancelAnimationFrame(animationId);
            loop();
        }

        function gameOver() {
            state = 'GAMEOVER';
            document.getElementById('finalTime').innerText = elapsedTime.toFixed(1);
            document.getElementById('gameOverScreen').classList.remove('hidden');

            // Screen Shake Effect
            GameJuice.shake(15, 400);
            GameJuice.flash('rgba(255, 0, 0, 0.4)', 200);

            // Explode all enemies
            enemies.forEach(e => GameJuice.createExplosion(e.x, e.y, '#ff0000', 5, particles));
            GameJuice.createExplosion(player.x, player.y, '#fff', 30, particles);
        }

        function spawnEnemy() {
            // Spawn from edges
            const side = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
            let x, y;
            const size = 30;

            if (side === 0) { x = Math.random() * w; y = -size; }
            else if (side === 1) { x = w + size; y = Math.random() * h; }
            else if (side === 2) { x = Math.random() * w; y = h + size; }
            else { x = -size; y = Math.random() * h; }

            // Velocity towards player
            const angle = Math.atan2(player.y - y, player.x - x);
            // Speed increases with time
            const speed = 3 + (elapsedTime / 10);

            // rot·spin은 순전히 겉모습용이다. 파편마다 각도와 회전 방향이 달라야
            // 같은 스프라이트를 재사용해도 복사 붙여넣기처럼 보이지 않는다.
            enemies.push({
                x, y, size, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                rot: Math.random() * TAU, spin: (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 1.6)
            });
        }

        function loop() {
            animationId = requestAnimationFrame(loop);

            // Timer
            if (state === 'PLAYING') {
                const now = Date.now();
                elapsedTime = (now - startTime) / 1000;
                document.getElementById('timeDisplay').innerText = elapsedTime.toFixed(1);
            }

            // Clear Background
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);

            // Grid Background Pulse
            const pulse = 100 + Math.sin(Date.now() * 0.002) * 50;
            ctx.strokeStyle = `rgba(0, 255, 0, ${0.1 + Math.sin(Date.now() * 0.005) * 0.05})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < w; i += 50) { ctx.moveTo(i, 0); ctx.lineTo(i, h); }
            for (let i = 0; i < h; i += 50) { ctx.moveTo(0, i); ctx.lineTo(w, i); }
            ctx.stroke();

            if (state !== 'PLAYING') {
                // Background visual for lobby
                return;
            }

            // Spawn Logic
            const now = Date.now();
            const spawnRate = Math.max(200, 1000 - elapsedTime * 20);
            if (now > nextSpawn) {
                spawnEnemy();
                nextSpawn = now + spawnRate;
            }

            // Update & Draw Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                // 회전각을 프레임마다 누적하지 않고 경과 시간으로 계산한다 —
                // 어떤 주사율에서도 같은 속도로 돌고, 상태를 하나 덜 들고 있어도 된다.
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(e.rot + elapsedTime * e.spin);
                ctx.drawImage(hazSprite, -HAZ_HALF, -HAZ_HALF, HAZ_DRAW, HAZ_DRAW);
                ctx.restore();

                // Cleanup bounds (far out)
                if (e.x < -100 || e.x > w + 100 || e.y < -100 || e.y > h + 100) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Collision
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 15 + 15) {
                    if (protection) {
                        // Shield Block
                        protection = false;
                        GameJuice.createExplosion(e.x, e.y, '#00ffff', 15, particles); // Blue explosion
                        GameJuice.shake(5, 200);
                        GameJuice.flash('cyan', 100);
                        GameJuice.playSound('explode');

                        enemies.splice(i, 1);

                        // Shield Break Effect
                        const overlay = document.getElementById('damage-overlay');
                        overlay.style.background = 'cyan';
                        overlay.style.opacity = 0.5;
                        setTimeout(() => { overlay.style.opacity = 0; overlay.style.background = 'red'; }, 200);
                    } else {
                        // Death
                        GameJuice.playSound('lose');
                        gameOver();
                    }
                }
            }

            // Draw Player
            // 화면에 딱 하나뿐이라 글로우를 실시간으로 칠해도 비용이 없다.
            // 숨쉬듯 커졌다 작아지는 건 시간 함수라 프레임 수와 무관하다.
            const pPulse = 1 + Math.sin(elapsedTime * 4) * 0.07;
            ctx.save();
            ctx.shadowColor = P_GLOW;
            ctx.shadowBlur = 18;
            ctx.fillStyle = P_GLOW;
            ctx.beginPath(); ctx.arc(player.x, player.y, P_R * pPulse, 0, TAU); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = P_CORE;
            ctx.beginPath(); ctx.arc(player.x, player.y, P_R * 0.44, 0, TAU); ctx.fill();
            ctx.restore();

            // Draw Shield
            if (protection) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(-elapsedTime * 3); // Counter rotate
                ctx.drawImage(shieldImg, -25, -25, 50, 50);
                ctx.restore();
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay || 0.05;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);

                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;
        }

        // Init
        updateShopUI();
        updateUI();

    </script>
</body>

</html>
