<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feltling</title>
<style>
  :root {
    --sky-a: #f2ead8; --sky-b: #dfe8d9;
    --ink: #4a3f35; --cream: #f6efe0;
    --bar: #efe3cc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8d9; }
  body { font: 13px/1.4 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
         color: var(--ink); -webkit-user-select: none; user-select: none;
         -webkit-tap-highlight-color: transparent; }
  #wrap { display: flex; flex-direction: column; height: 100%; }

  /* HUD도 펠트다. 사각형 막대를 얹으면 그 순간 화면이 웹페이지로 읽힌다. */
  #hud { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
         gap: 8px; padding: 0 12px; height: 38px; background: var(--bar);
         border-bottom: 2px dashed #d6c6a8; letter-spacing: .08em; font-size: 11px;
         font-weight: 700; text-transform: uppercase; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
          background: var(--cream); border-radius: 999px; box-shadow: 0 1px 0 #d9caa9; }
  .pill b { font-weight: 800; font-size: 12px; }
  .yarnDot { width: 9px; height: 9px; border-radius: 50%; background: #e8b7a0;
             box-shadow: inset -2px -2px 0 rgba(0,0,0,.10); display: inline-block; }
  button { appearance: none; border: 0; font: inherit; letter-spacing: .08em;
           text-transform: uppercase; font-weight: 700; color: inherit; cursor: pointer; }
  #shareBtn { background: var(--cream); border-radius: 999px; padding: 5px 11px;
              box-shadow: 0 1px 0 #d9caa9; }
  #shareBtn.ping { animation: ping 1.1s ease-in-out infinite; }
  @keyframes ping { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  #muteBtn { background: transparent; padding: 4px 2px; opacity: .65; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: manipulation; }

  /* 공유 카드. 탭으로만 열린다 — 저절로 뜨면 게임 화면을 덮는다. */
  #cardWrap { position: absolute; inset: 0; display: none; align-items: center;
              justify-content: center; flex-direction: column; gap: 12px; padding: 16px;
              background: rgba(74,63,53,.55); backdrop-filter: blur(3px); z-index: 5; }
  #cardWrap.open { display: flex; }
  #cardImg { max-width: 100%; max-height: 68%; border-radius: 14px;
             box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .cardBtns { display: flex; gap: 10px; }
  .cardBtns a, .cardBtns button { background: var(--cream); color: var(--ink);
    border-radius: 999px; padding: 9px 16px; text-decoration: none; font-size: 12px;
    font-weight: 800; letter-spacing: .08em; box-shadow: 0 2px 0 #b9a887; }
</style>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://just1game.com/games/feltling/">
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span class="pill"><i class="yarnDot"></i><b id="yarn">0</b></span>
    <span class="pill" id="stageLabel">bare</span>
    <span style="display:flex;gap:6px;align-items:center;">
      <button id="shareBtn" type="button" aria-label="Show share card">Card</button>
      <button id="muteBtn" type="button" aria-label="Toggle sound">Sound On</button>
    </span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="cardWrap">
      <img id="cardImg" alt="Your feltling">
      <div class="cardBtns">
        <button id="cardShare" type="button">Share</button>
        <a id="cardSave" download="my-feltling.png">Save</a>
        <button id="cardClose" type="button">Back</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Feltling — 펠트로 짜인 세계. 물범은 원래 털이 없고, 고양이가 실을 가져다 준다.

   입력은 탭 하나다. 탭하면 고양이가 그리로 걸어가 앞발로 톡 친다 — 이동과 행동이
   한 동작이다. 탭과 소리 사이의 지연은 결함이 아니라 캐릭터다(고양이가 총총 걸어간다).

   실패도 시간 제한도 없고, 손을 놓아도 끝나지 않는다. 게이트에는 session:'cozy'로
   그것을 선언한다 — tools/gates.js가 그 선언을 보고 종결 규칙을 뒤집어 판정한다.

   그림은 전부 코드로 그린다. 펠트는 래스터 시트로 넣으면 회전·반전에서 조명이
   어긋나는데, 이 게임은 스톱모션 리듬(12fps 홀드)으로 움직이므로 코드 쪽이 맞는다.
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* 플레이 밴드. 창이 가로로 넓어도 게임이 도는 판은 늘 세로 비율이다.
   게이트 2가 가로 뷰포트에서 이 비율을 재므로 공식을 바꾸면 판정이 깨진다. */
const BAND = 390 / 806;
let W = 0, H = 0, SW = 0, OX = 0;

const P = {
  skyTop:  '#f4ecda', skyBot: '#e4ecdc',
  hillFar: '#c3d7bd', hillNear: '#aec9a6',
  meadow:  '#b9d0ab', meadowAlt: '#aec6a0',
  sand:    '#e6d6b4', sandDark: '#d8c49c',
  thread:  '#fbf5e6',
  ink:     '#4a3f35',
  skin:    '#b8b2a9', skinDark: '#a49d93',
  wool:    '#f5ead2',
  cat:     '#e0b083', catCream: '#f7ecd8',
  cloud:   '#fbf6ea'
};

/* ---------- 섬유 텍스처 ----------
   펠트는 매끈하지 않다. 화면 전체에 얇은 섬유 층을 한 번 덮으면 모든 물건이 같은
   재질로 읽힌다. 도형마다 알갱이를 찍으면 프레임당 수백 번을 그려야 해서, 타일을
   한 번 만들어 패턴으로 쓴다. */
let fiber = null;
function makeFiber() {
  const t = document.createElement('canvas');
  t.width = t.height = 200;
  const g = t.getContext('2d');
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * 200, y = Math.random() * 200;
    const a = Math.random() * Math.PI, l = 1.2 + Math.random() * 3.6;
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.20)' : 'rgba(72,56,40,0.13)';
    g.lineWidth = 0.6 + Math.random() * 0.8;
    g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  fiber = ctx.createPattern(t, 'repeat');
}

// 두 색 사이. 단계가 오를수록 몸 바탕색이 회색에서 크림으로 옮겨간다 —
// 뭉치만 얹으면 덩어리 사이로 맨살이 비쳐 얼룩덜룩해진다.
function mix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',')})`;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------- 소리 ----------
   진행도를 막대기가 아니라 소리로 보여준다. 털이 두꺼워질수록 배 치는 소리는
   커지는 것이 아니라 먹먹해진다 — 완성의 증거가 우렁참이 아니라 포근함이다. */
const Sfx = (() => {
  let ac = null, on = true;
  const ready = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  };
  // 펠트를 두드리는 소리는 음정이 아니라 잡음이다. 짧은 노이즈를 필터로 깎아 만든다.
  const thud = (freq, dur, damp, vol, when = 0) => {
    const a = ready(); if (!a || !on) return;
    const n = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, damp);
    const src = a.createBufferSource(); src.buffer = buf;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start(a.currentTime + when);
  };
  // 실을 주울 때의 맑은 한 음. 연달아 주우면 음이 올라간다 — 말없이 "잘하고 있다"가 된다.
  const tone = (freq, dur, vol, when = 0, type = 'triangle') => {
    const a = ready(); if (!a || !on) return;
    const t0 = a.currentTime + when;
    const o = a.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    o.connect(lp); lp.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  };
  // 5음계. 어떤 순서로 눌러도 어긋나지 않는다.
  const SCALE = [523.25, 587.33, 698.46, 783.99, 880.0, 1046.5];
  return {
    prop: (kind) => ({
      felt:  () => thud(430, 0.16, 5, 0.45),
      wood:  () => { thud(820, 0.12, 7, 0.40); tone(196, 0.12, 0.05, 0.01, 'sine'); },
      stone: () => thud(1900, 0.06, 13, 0.30),
      water: () => { thud(1200, 0.20, 3, 0.26); tone(1100, 0.10, 0.05, 0.02, 'sine'); },
      grass: () => thud(2500, 0.09, 9, 0.20)
    }[kind] || (() => thud(600, 0.14, 6, 0.36)))(),
    // 빈 소리 + 맑은 한 음. 여기에 실이 있었다.
    hollow: (combo) => {
      thud(250, 0.28, 2, 0.45);
      tone(SCALE[Math.min(combo, SCALE.length - 1)], 0.5, 0.11, 0.03);
    },
    /* 물범 배. 단계가 오를수록 저역만 남고 길어진다 — 맨살은 챱! 하고 밝게,
       다 채워지면 폭 하고 먹먹하게. */
    belly: (stage) => {
      const i = Math.min(stage, 5);
      thud([2600, 1900, 1400, 1000, 720, 520][i], [0.10, 0.11, 0.13, 0.15, 0.17, 0.21][i],
           [10, 8, 7, 6, 5, 4][i], 0.5);
    },
    // 단계 상승. 물범이 고양이 엉덩이를 팡팡팡 쳐준다 — 이 게임에서 가장 드문 소리다.
    pat3: () => {
      [0, 0.15, 0.30].forEach((t, i) => thud(640 - i * 45, 0.18, 4, 0.55, t));
      [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.9, 0.10, 0.30 + i * 0.06, 'sine'));
      tone(261.63, 1.4, 0.07, 0.30, 'sine');
    },
    toggle: () => { on = !on; if (on) ready(); return on; },
    wake: () => { ready(); }
  };
})();

/* ---------- 세계 ---------- */
const STAGE_COST = [3, 5, 8, 12, 18, 25];   // 단계마다 필요한 실. 뒤로 갈수록 털이 많이 든다
const STAGE_NAME = ['bare', 'tufts', 'patchy', 'even', 'thick', 'plush', 'feltling'];
const KINDS = ['mushroom', 'stone', 'bush', 'stump', 'pond', 'flower', 'grass', 'spool'];
const MAT = { mushroom: 'felt', stone: 'stone', bush: 'grass', stump: 'wood',
              pond: 'water', flower: 'felt', grass: 'grass', spool: 'felt' };

let props = [], cat = null, seal = null, puffs = [], clouds = [];
let carried = 0, stage = 0, filled = 0, given = 0, combo = 0, comboAt = 0;
let day = 1, state = 'playing', tick = 0, T = 0, muted = false;
let unravelIn = 7, hintOn = true;

const SAVE = 'feltling.v2';
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE) || '{}');
    stage = Math.min(6, s.stage | 0); filled = s.filled | 0; given = s.given | 0;
    const first = s.first || Date.now();
    day = Math.max(1, Math.floor((Date.now() - first) / 86400000) + 1);
    localStorage.setItem(SAVE, JSON.stringify({ stage, filled, given, first }));
    if (given > 0) hintOn = false;
  } catch { /* 저장이 깨졌으면 처음부터 한다. 코지 게임에서 그건 사고가 아니라 새 시작이다 */ }
  // 클립·썸네일을 찍을 때만 쓰는 강제 단계. 사람이 치는 주소가 아니다.
  const q = new URLSearchParams(location.search);
  if (q.has('stage')) { stage = Math.max(0, Math.min(6, +q.get('stage') | 0)); hintOn = false; }
}
function save() {
  try {
    const prev = JSON.parse(localStorage.getItem(SAVE) || '{}');
    localStorage.setItem(SAVE, JSON.stringify({ stage, filled, given, first: prev.first || Date.now() }));
  } catch {}
}

/* 방문할 때마다 세계가 조금 더 풀려 있고, 있는 동안에도 천천히 더 풀린다.
   타이머도 대기도 보여주지 않는다 — 원래 풀리는 세계라 설정과 맞고,
   올 때마다 할 것이 있으면 그것으로 충분하다. 벽이 없어야 코지다. */
function seedScene() {
  props = [];
  for (let i = 0; i < 12; i++) {
    props.push({ i, kind: KINDS[i % KINDS.length], loose: false, squash: 0, wob: 0, seed: i * 1.7 });
  }
  const order = props.map(p => p.i).sort(() => Math.random() - 0.5);
  order.slice(0, 7).forEach(i => { props[i].loose = true; });
}
function unravelOne() {
  const closed = props.filter(p => !p.loose);
  if (!closed.length || props.filter(p => p.loose).length >= 8) return;
  const p = closed[Math.floor(Math.random() * closed.length)];
  p.loose = true; p.pop = 0.6;
}

const HORIZON = 0.155;   // 하늘은 위 15%만. 나머지는 전부 땅이다

function layout() {
  if (!W || !H) return;
  /* 소품은 땅 위에 앉아 있어야 한다. 격자 대신 흩어 놓는다 — 규칙적인 배열은
     마을이 아니라 진열대로 읽힌다. 결정론적 흩뿌림이라 매 방문 같은 마을이다. */
  const top = H * (HORIZON + 0.07), bottom = H * 0.655;
  props.forEach((p) => {
    const t = (p.i + 0.5) / props.length;
    const sx = ((p.i * 73) % 100) / 100;
    const sy = ((p.i * 47) % 100) / 100;
    p.y = top + (bottom - top) * (t * 0.82 + sy * 0.18);
    const depth = (p.y - top) / (bottom - top);
    const inset = 0.15 - depth * 0.04;
    p.x = W * (inset + (1 - inset * 2) * ((sx + t * 0.6) % 1));
    p.r = W * (0.056 + depth * 0.032);
  });
  props.sort((a, b) => a.y - b.y);
  seal = Object.assign(seal || {}, { x: W * 0.5, y: H * 0.845, r: W * 0.195 });
  if (!cat) cat = { x: W * 0.24, y: H * 0.60, tx: W * 0.24, ty: H * 0.60, target: null,
                    paw: 0, face: 1, patted: 0, nap: 0, idle: 0 };
  clouds = [
    { x: W * 0.20, y: H * 0.055, r: W * 0.085, v: 0.0030 },
    { x: W * 0.72, y: H * 0.088, r: W * 0.062, v: 0.0021 }
  ];
}

/* ---------- 펠트 그리기 ----------
   도형 하나하나에 세 가지를 준다: 살짝 흔들린 외곽선(기계로 자른 것이 아니다),
   위는 밝고 아래는 어두운 음영(두께가 있다), 그리고 바느질 자국. */
function wobbleBlob(x, y, rx, ry, seed, lobes = 3) {
  ctx.beginPath();
  for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 16) {
    const k = 1 + Math.sin(a * lobes + seed) * 0.035 + Math.sin(a * 7 + seed * 2) * 0.016;
    const px = x + Math.cos(a) * rx * k, py = y + Math.sin(a) * ry * k;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}
// 두께 음영. 도형을 그린 직후 그 path 안에만 칠한다.
function shade(x, y, rx, ry, strength = 1) {
  ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, y - ry, 0, y + ry);
  g.addColorStop(0, `rgba(255,255,255,${0.22 * strength})`);
  g.addColorStop(0.45, 'rgba(255,255,255,0)');
  g.addColorStop(0.72, 'rgba(90,70,50,0)');
  g.addColorStop(1, `rgba(90,70,50,${0.20 * strength})`);
  ctx.fillStyle = g; ctx.fillRect(x - rx * 1.6, y - ry * 1.6, rx * 3.2, ry * 3.2);
  ctx.restore();
}
function contactShadow(x, y, rx, ry, alpha = 0.11) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#4b3f31';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); ctx.restore();
}
// 바느질. 점선 한 줄이면 천이 된다.
function stitch(fn, color = 'rgba(251,245,230,.75)', w = 1.6, dash = [3.5, 4]) {
  ctx.save(); ctx.setLineDash(dash); ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.strokeStyle = color; fn(); ctx.stroke(); ctx.restore();
}
// 솜털 가장자리. 실루엣 밖으로 짧은 털이 삐져나온다.
function fuzz(x, y, rx, ry, n, len, color, seed) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, len * 0.34); ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + seed;
    const ca = Math.cos(a), sa = Math.sin(a);
    const l = len * (0.55 + ((i * 37) % 10) / 10 * 0.8);
    ctx.moveTo(x + ca * rx, y + sa * ry);
    ctx.lineTo(x + ca * (rx + l), y + sa * (ry + l));
  }
  ctx.stroke(); ctx.restore();
}

/* ---------- 소품 ----------
   추상적인 덩어리 대신 실제 물건을 그린다. 마을처럼 보이지 않으면 두드릴 이유가 없다. */
function drawProp(p) {
  const sq = 1 - p.squash * 0.42, r = p.r;
  const bob = Math.sin(T * 1.4 + p.seed) * r * 0.02;
  contactShadow(p.x, p.y + r * 0.88, r * 0.80, r * 0.20);
  ctx.save();
  ctx.translate(p.x, p.y + bob);
  ctx.scale(1 / sq, sq);

  const k = p.kind;
  if (k === 'mushroom') {
    ctx.fillStyle = '#e8d9bd';
    wobbleBlob(0, r * 0.34, r * 0.32, r * 0.46, p.seed); ctx.fill();
    shade(0, r * 0.34, r * 0.32, r * 0.46, 0.8);
    ctx.fillStyle = '#d98b7e';
    wobbleBlob(0, -r * 0.18, r * 0.86, r * 0.60, p.seed, 4); ctx.fill();
    shade(0, -r * 0.18, r * 0.86, r * 0.60);
    ctx.fillStyle = 'rgba(251,245,230,.85)';
    for (let i = 0; i < 4; i++) {
      const a = -2.6 + i * 0.75;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * r * 0.46, -r * 0.30 + Math.sin(a) * r * 0.20,
                  r * 0.11, r * 0.085, 0, 0, 7); ctx.fill();
    }
  } else if (k === 'stone') {
    ctx.fillStyle = '#c5c4be';
    wobbleBlob(0, 0, r * 0.88, r * 0.66, p.seed, 4); ctx.fill();
    shade(0, 0, r * 0.88, r * 0.66);
    stitch(() => { ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.06); ctx.quadraticCurveTo(0, -r * 0.2, r * 0.55, r * 0.02); },
           'rgba(120,116,108,.5)', 1.4, [3, 4]);
  } else if (k === 'bush') {
    ctx.fillStyle = '#8fb480';
    wobbleBlob(-r * 0.36, r * 0.10, r * 0.52, r * 0.46, p.seed); ctx.fill();
    wobbleBlob(r * 0.36, r * 0.14, r * 0.48, r * 0.42, p.seed + 2); ctx.fill();
    ctx.fillStyle = '#9cc08b';
    wobbleBlob(0, -r * 0.18, r * 0.66, r * 0.58, p.seed + 1); ctx.fill();
    shade(0, -r * 0.10, r * 0.72, r * 0.62);
    ctx.fillStyle = '#c2596b';
    for (let i = 0; i < 3; i++) {
      const a = 1.1 + i * 1.9;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.42, -r * 0.16 + Math.sin(a) * r * 0.32, r * 0.10, 0, 7); ctx.fill();
    }
  } else if (k === 'stump') {
    ctx.fillStyle = '#bb8f63';
    wobbleBlob(0, r * 0.10, r * 0.68, r * 0.60, p.seed); ctx.fill();
    shade(0, r * 0.10, r * 0.68, r * 0.60);
    ctx.fillStyle = '#d6ab7c';
    ctx.beginPath(); ctx.ellipse(0, -r * 0.38, r * 0.66, r * 0.24, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(140,100,64,.55)'; ctx.lineWidth = Math.max(1, r * 0.05);
    ctx.beginPath(); ctx.ellipse(0, -r * 0.38, r * 0.34, r * 0.12, 0, 0, 7); ctx.stroke();
  } else if (k === 'pond') {
    ctx.fillStyle = '#a9c9d8';
    wobbleBlob(0, r * 0.12, r * 0.92, r * 0.44, p.seed, 4); ctx.fill();
    shade(0, r * 0.12, r * 0.92, r * 0.44, 0.7);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = Math.max(1.2, r * 0.07);
    const rip = (p.wob > 0 ? p.wob : 0);
    ctx.beginPath(); ctx.ellipse(-r * 0.15, r * 0.06, r * (0.22 + rip * 0.5), r * (0.10 + rip * 0.22), 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#86ae74';
    wobbleBlob(r * 0.38, r * 0.02, r * 0.30, r * 0.16, p.seed + 3); ctx.fill();
  } else if (k === 'flower') {
    ctx.strokeStyle = '#8fb480'; ctx.lineWidth = Math.max(2, r * 0.10); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, r * 0.66); ctx.quadraticCurveTo(r * 0.08, r * 0.1, 0, -r * 0.18); ctx.stroke();
    ctx.fillStyle = '#eec9d2';
    for (let i = 0; i < 5; i++) {
      const a = i * 1.2566 + p.seed * 0.2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * r * 0.34, -r * 0.24 + Math.sin(a) * r * 0.34, r * 0.26, r * 0.20, a, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#f0c46a';
    ctx.beginPath(); ctx.arc(0, -r * 0.24, r * 0.18, 0, 7); ctx.fill();
    shade(0, -r * 0.24, r * 0.5, r * 0.5, 0.5);
  } else if (k === 'grass') {
    ctx.strokeStyle = '#93bb81'; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const off = (i - 2.5) * r * 0.22;
      const sway = Math.sin(T * 1.1 + i + p.seed) * r * 0.10;
      ctx.lineWidth = Math.max(2, r * 0.11);
      ctx.beginPath(); ctx.moveTo(off, r * 0.58);
      ctx.quadraticCurveTo(off + sway * 0.5, r * 0.05, off + sway, -r * 0.55 + Math.abs(off) * 0.6);
      ctx.stroke();
    }
  } else { // spool — 실패. 이 세계의 화폐가 어떻게 생겼는지 한 번은 보여준다
    ctx.fillStyle = '#e8b7a0';
    wobbleBlob(0, 0, r * 0.62, r * 0.62, p.seed); ctx.fill();
    shade(0, 0, r * 0.62, r * 0.62);
    ctx.strokeStyle = 'rgba(180,120,100,.45)'; ctx.lineWidth = Math.max(1.4, r * 0.07);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.56, r * 0.22, -0.5 + i * 1.05, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();

  /* 풀린 것은 실밥이 삐져나와 보인다. 소리를 끈 사람도 찾을 수 있어야 한다 —
     무음으로 보는 숏폼에서도 읽혀야 하는 것과 같은 이유다. */
  if (p.loose) {
    const pop = p.pop > 0 ? p.pop : 0;
    const g = 0.55 + Math.sin(T * 3 + p.seed) * 0.2 + pop;
    ctx.save();
    ctx.strokeStyle = `rgba(251,245,230,${Math.min(1, g)})`;
    ctx.lineWidth = Math.max(2, r * 0.11); ctx.lineCap = 'round';
    const wag = Math.sin(T * 2.2 + p.seed) * r * 0.12;
    ctx.beginPath();
    ctx.moveTo(p.x + r * 0.42, p.y - r * 0.42);
    ctx.quadraticCurveTo(p.x + r * 1.15 + wag, p.y - r * 0.95, p.x + r * 0.70 + wag, p.y - r * 1.32);
    ctx.stroke();
    ctx.fillStyle = '#fbf5e6';
    ctx.beginPath(); ctx.arc(p.x + r * 0.70 + wag, p.y - r * 1.36, r * 0.13, 0, 7); ctx.fill();
    ctx.restore();
  }
}

/* ---------- 물범 ----------
   털은 뭉치를 세는 대신 '덮인 비율'로 그린다. 작은 원을 흩뿌렸더니 뽁뽁이로 읽혔고,
   실루엣에 곧은 털을 세웠더니 고슴도치가 됐다 — 둘 다 실제로 그렇게 나왔다.
   펠트는 한 올씩이 아니라 뭉텅이로 붙는다. 가장자리가 울퉁불퉁한 덩어리를
   정수리에서부터 아래로 겹쳐 덮는 것이 이 재질에 맞는 유일한 그리기다. */
function sealBody(r) {
  ctx.beginPath();
  ctx.moveTo(-r * 0.78, r * 0.30);
  ctx.bezierCurveTo(-r * 0.92, -r * 0.52, -r * 0.44, -r * 1.02, 0, -r * 1.02);
  ctx.bezierCurveTo(r * 0.44, -r * 1.02, r * 0.92, -r * 0.52, r * 0.78, r * 0.30);
  ctx.bezierCurveTo(r * 0.72, r * 0.86, r * 0.40, r * 0.99, 0, r * 0.99);
  ctx.bezierCurveTo(-r * 0.40, r * 0.99, -r * 0.72, r * 0.86, -r * 0.78, r * 0.30);
  ctx.closePath();
}

/* 털이 붙는 자리. 황금각으로 고르게 흩고 y로 정렬해 둔다 — 그래야 정수리부터 나고
   배가 마지막이 된다. 매번 같은 순서라 3단계의 듬성듬성한 모양이 늘 같다. */
const COAT = (() => {
  const pts = [];
  for (let i = 0; i < 34; i++) {
    const a = i * 2.399;
    const rad = Math.sqrt((i + 0.5) / 34) * 0.86;
    pts.push({ x: Math.cos(a) * rad, y: -0.05 + Math.sin(a) * rad * 0.97, s: i * 1.37 });
  }
  pts.sort((p, q) => p.y - q.y);
  return pts;
})();

function drawSeal() {
  const grow = 1 + stage * 0.040;
  const r = seal.r * grow;
  const breathe = Math.sin(T * 1.1) * r * 0.012;
  const wob = seal.wob || 0;
  const sq = 1 - wob * 0.16;
  const cov = stage / 6;
  const n = Math.round(COAT.length * cov);

  contactShadow(seal.x, seal.y + r * 0.96, r * 0.92, r * 0.20, 0.13);
  ctx.save();
  ctx.translate(seal.x, seal.y + breathe);
  ctx.scale(1 / sq, sq);

  // 꼬리 지느러미. 몸 뒤로 살짝 비스듬히 나와야 공이 아니라 물범으로 읽힌다
  ctx.save();
  ctx.translate(-r * 0.30, r * 0.88); ctx.rotate(-0.45);
  ctx.fillStyle = stage >= 5 ? P.wool : P.skinDark;
  wobbleBlob(0, 0, r * 0.40, r * 0.17, 3.1); ctx.fill();
  ctx.restore();

  /* 가장자리로 삐져나온 털. 몸보다 먼저 그려서 뒤에 깔린다. 실루엣이 부슬부슬해지는
     것이 진행의 가장 큰 신호다 — 200px 썸네일에서 살아남는 것도 이것뿐이다. */
  if (n > 0) {
    ctx.fillStyle = P.wool;
    let k = 0;
    for (const c of COAT) {
      if (k >= n) break;
      k++;
      const d = Math.hypot(c.x, c.y);
      if (d < 0.56) continue;
      const ux = c.x / d, uy = c.y / d;
      const out = 0.94 + stage * 0.013;
      wobbleBlob(ux * r * 0.84 * out, -r * 0.05 + uy * r * 0.99 * out,
                 r * 0.155, r * 0.140, c.s, 5);
      ctx.fill();
    }
  }

  // 몸통 — 아래가 넓은 배 모양. 원으로 두면 공으로 읽힌다
  ctx.fillStyle = mix(P.skin, '#ece0c4', cov * 0.9);
  sealBody(r); ctx.fill();
  shade(0, 0, r * 0.9, r * 1.0);

  // 털. 몸 안쪽에만 붙는다. 클립은 몸 윤곽 그대로라 배 아래가 잘리지 않는다
  if (n > 0) {
    ctx.save();
    sealBody(r); ctx.clip();
    let k = 0;
    for (const c of COAT) {
      if (k >= n) break;
      k++;
      const cx = c.x * r, cy = c.y * r;
      // 얼굴에는 얹지 않는다. 표정이 이 게임의 보상인데 뭉치가 눈을 덮으면 사라진다
      if (Math.hypot(cx, (cy + r * 0.46) * 1.05) < r * 0.48) continue;
      ctx.fillStyle = (k % 3 === 0) ? '#efe3c8' : P.wool;
      wobbleBlob(cx, cy, r * 0.29, r * 0.26, c.s, 5); ctx.fill();
    }
    // 바늘 자국. 덩어리들이 따로 놀지 않고 한 겹으로 붙어 보이게 한다
    if (stage >= 2) {
      ctx.strokeStyle = 'rgba(206,186,148,.45)';
      ctx.lineWidth = Math.max(1, r * 0.018); ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < n * 3; i++) {
        const a = i * 2.399, rad = Math.sqrt((i + 0.5) / (n * 3)) * r * 0.82;
        const px = Math.cos(a) * rad, py = -r * 0.05 + Math.sin(a) * rad * 0.97;
        if (Math.hypot(px, (py + r * 0.46) * 1.05) < r * 0.50) continue;
        const ang = a * 1.7;
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(ang) * r * 0.05, py + Math.sin(ang) * r * 0.05);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 얼굴 자리. 털을 피해서 남긴 구멍은 경계가 들쭉날쭉해 오소리처럼 보였다.
     맨살 타원을 한 장 다시 덮어 얼굴만 깨끗하게 되돌린다 — 물범 얼굴은 원래 털이 얇다. */
  if (n > 0) {
    ctx.fillStyle = mix(P.skin, '#d9d2c6', cov * 0.5);
    wobbleBlob(0, -r * 0.44, r * 0.43, r * 0.39, 5.5, 4); ctx.fill();
    shade(0, -r * 0.44, r * 0.43, r * 0.39, 0.5);
  }

  // 앞지느러미. 짧다 — 이 팔로 자기 배를 친다. 털 위로 나와야 보인다
  ctx.fillStyle = stage >= 4 ? '#e5d8bc' : P.skinDark;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(s * r * 0.74, r * 0.30);
    ctx.rotate(s * (0.5 + wob * 0.9));
    wobbleBlob(0, 0, r * 0.30, r * 0.15, 1.2 + s); ctx.fill();
    ctx.restore();
  }

  // 얼굴. 표정은 아끼는 것이 핵심이다 — 매번 웃으면 웃음이 값을 잃는다
  const eyeY = -r * 0.46, eyeX = r * 0.30;
  const closed = (seal.blink || 0) > 0 || (seal.nap || 0) > 0;
  ctx.fillStyle = P.ink; ctx.strokeStyle = P.ink;
  for (const s of [-1, 1]) {
    if (closed) {
      ctx.lineWidth = Math.max(2, r * 0.055); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(s * eyeX, eyeY + r * 0.03, r * 0.115, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(s * eyeX, eyeY, r * 0.072, r * 0.082, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s * eyeX + r * 0.026, eyeY - r * 0.028, r * 0.024, 0, 7); ctx.fill();
      ctx.fillStyle = P.ink;
    }
  }
  // 코와 입. 두 점 하나 선이면 충분하다
  ctx.beginPath(); ctx.ellipse(0, eyeY + r * 0.20, r * 0.075, r * 0.058, 0, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(1.6, r * 0.036); ctx.lineCap = 'round'; ctx.strokeStyle = P.ink;
  ctx.beginPath();
  ctx.moveTo(-r * 0.11, eyeY + r * 0.32); ctx.quadraticCurveTo(0, eyeY + r * 0.40, r * 0.11, eyeY + r * 0.32);
  ctx.stroke();
  // 수염 자리. 점 세 개면 얼굴이 조금 더 동물이 된다
  ctx.fillStyle = 'rgba(74,63,53,.40)';
  for (const s of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(s * (r * 0.15 + i * r * 0.055), eyeY + r * 0.26 + (i % 2) * r * 0.035, r * 0.016, 0, 7);
      ctx.fill();
    }
  }
  // 볼. 단계가 오른 직후에만 물든다
  if (closed) {
    ctx.fillStyle = 'rgba(214,140,140,.35)';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * 0.52, eyeY + r * 0.22, r * 0.13, r * 0.09, 0, 0, 7); ctx.fill(); }
  }
  ctx.restore();

  // 배의 바느질 자국. 펠트로 지은 몸이라는 유일한 증거다. 털이 덮으면 가려진다
  if (stage < 3) {
    stitch(() => {
      ctx.beginPath();
      ctx.moveTo(seal.x, seal.y - r * 0.10 + breathe);
      ctx.lineTo(seal.x, seal.y + r * 0.80 + breathe);
    }, 'rgba(251,245,230,.55)', Math.max(1.4, r * 0.03), [4, 5]);
  }
}

/* ---------- 고양이 ---------- */
function drawCat() {
  const r = W * 0.062;
  const step = cat.moving ? Math.sin(T * 13) : 0;      // 스톱모션 리듬은 update에서 이미 양자화됐다
  const bob = cat.moving ? Math.abs(step) * r * 0.16 : Math.sin(T * 1.6) * r * 0.05;
  const lean = cat.moving ? cat.face * 0.10 : 0;
  const sq = 1 - cat.paw * 0.25;
  const napping = cat.nap > 0;

  contactShadow(cat.x, cat.y + r * 0.95, r * 0.82, r * 0.20, 0.12);
  ctx.save();
  ctx.translate(cat.x, cat.y - bob);
  ctx.rotate(lean);
  ctx.scale(cat.face / sq, sq);

  // 꼬리. 이 게임에서 감정을 말하는 유일한 부위다
  ctx.strokeStyle = P.cat; ctx.lineWidth = r * 0.28; ctx.lineCap = 'round';
  const tailWag = Math.sin(T * (cat.patted > 0 ? 9 : 2.2)) * r * (cat.patted > 0 ? 0.75 : 0.35);
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, r * 0.30);
  ctx.quadraticCurveTo(-r * 1.25, r * 0.10 + tailWag * 0.4, -r * 1.05 + tailWag * 0.3, -r * 0.62 + tailWag);
  ctx.stroke();

  if (napping) {
    // 몸을 말고 잔다. 다 채운 뒤에만 볼 수 있는 자세다
    ctx.fillStyle = P.cat;
    wobbleBlob(0, r * 0.20, r * 0.92, r * 0.56, 1.4); ctx.fill();
    shade(0, r * 0.20, r * 0.92, r * 0.56);
    ctx.fillStyle = P.cat;
    wobbleBlob(r * 0.52, r * 0.02, r * 0.44, r * 0.40, 2.2); ctx.fill();
    ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1.4, r * 0.06); ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(r * 0.52 + s * r * 0.16, r * 0.0, r * 0.09, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    }
    ctx.restore();
    return;
  }

  // 몸통
  ctx.fillStyle = P.cat;
  wobbleBlob(-r * 0.10, r * 0.22, r * 0.68, r * 0.54, 1.4); ctx.fill();
  shade(-r * 0.10, r * 0.22, r * 0.68, r * 0.54);
  // 가슴 크림
  ctx.fillStyle = P.catCream;
  wobbleBlob(r * 0.16, r * 0.36, r * 0.32, r * 0.30, 3.3); ctx.fill();
  // 앞발
  ctx.fillStyle = P.catCream;
  const pawOut = cat.paw > 0 ? r * 0.5 * cat.paw / 0.28 : 0;
  ctx.beginPath(); ctx.ellipse(r * 0.42 + pawOut, r * 0.64, r * 0.20, r * 0.15, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.02 - step * r * 0.14, r * 0.70, r * 0.19, r * 0.14, 0, 0, 7); ctx.fill();
  // 머리. 귀는 머리 다음에 올린다 — 먼저 그리면 머리 덩어리가 그대로 덮어버린다
  ctx.fillStyle = P.cat;
  const hx = r * 0.44, hy = -r * 0.44;
  wobbleBlob(hx, hy, r * 0.48, r * 0.44, 2.6); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.fillStyle = P.cat;
    ctx.beginPath();
    ctx.moveTo(hx + s * r * 0.12, hy - r * 0.36);
    ctx.lineTo(hx + s * r * 0.34, hy - r * 0.78);
    ctx.lineTo(hx + s * r * 0.46, hy - r * 0.26);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0c4b4';
    ctx.beginPath();
    ctx.moveTo(hx + s * r * 0.20, hy - r * 0.38);
    ctx.lineTo(hx + s * r * 0.32, hy - r * 0.64);
    ctx.lineTo(hx + s * r * 0.37, hy - r * 0.34);
    ctx.closePath(); ctx.fill();
  }
  shade(hx, hy, r * 0.48, r * 0.44, 0.8);
  // 눈·코
  ctx.fillStyle = P.ink;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(hx + s * r * 0.20, hy - r * 0.01, r * 0.058, r * 0.074, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#d98b87';
  ctx.beginPath(); ctx.ellipse(hx, hy + r * 0.16, r * 0.055, r * 0.042, 0, 0, 7); ctx.fill();
  ctx.restore();

  // 들고 있는 실. 숫자는 HUD에도 있지만, 손에 들린 것이 보여야 왜 물범에게 가는지 안다
  if (carried > 0) {
    const bx = cat.x - cat.face * r * 0.55, by = cat.y - bob - r * 0.85;
    for (let i = 0; i < Math.min(carried, 3); i++) {
      const yy = by - i * r * 0.30;
      ctx.fillStyle = '#f0d9c6';
      ctx.beginPath(); ctx.arc(bx, yy, r * 0.24, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(190,140,120,.5)'; ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath(); ctx.ellipse(bx, yy, r * 0.20, r * 0.08, 0.6, 0, 7); ctx.stroke();
    }
    if (carried > 3) {
      ctx.fillStyle = P.ink;
      ctx.font = `800 ${Math.round(r * 0.45)}px ui-rounded, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('+' + (carried - 3), bx, by - 3 * r * 0.30 - r * 0.05);
    }
  }
  // 팡팡팡 맞는 중. 고양이가 전부 표현한다 — 물범은 여전히 무표정하게 친다
  if (cat.patted > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, cat.patted);
    ctx.fillStyle = '#fbf5e6';
    for (let i = 0; i < 4; i++) {
      const a = -1.9 + i * 0.55, d = r * (1.0 + (1.3 - cat.patted) * 1.4);
      ctx.beginPath(); ctx.arc(cat.x + Math.cos(a) * d, cat.y - r * 0.5 + Math.sin(a) * d, r * 0.13, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- 티끌 ----------
   두드릴 때마다 보풀이 조금 튄다. 아무것도 안 나와도 계속 두드리게 되는 화면이면
   성공이고, 실을 얻으려고 두드리게 되면 실패다. */
function puff(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    if (puffs.length > 90) break;
    const a = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.4;
    const v = 40 + Math.random() * 90;
    puffs.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: 2 + Math.random() * 3, c: color });
  }
}
function drawPuffs(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const q = puffs[i];
    q.life -= dt * 1.7;
    if (q.life <= 0) { puffs.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 190 * dt;
    ctx.globalAlpha = Math.max(0, q.life) * 0.85;
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.5 + q.life * 0.6), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 배경 ---------- */
function drawWorld(dt) {
  const g = ctx.createLinearGradient(0, 0, 0, H * HORIZON * 1.6);
  g.addColorStop(0, P.skyTop); g.addColorStop(1, P.skyBot);
  ctx.fillStyle = g; ctx.fillRect(-OX, 0, SW, H * 0.30);

  for (const c of clouds) {
    c.x += c.v * W * dt * 60;
    if (c.x - c.r * 2 > W) c.x = -c.r * 2;
    ctx.fillStyle = P.cloud;
    wobbleBlob(c.x, c.y, c.r, c.r * 0.52, c.x * 0.01); ctx.fill();
    wobbleBlob(c.x + c.r * 0.6, c.y + c.r * 0.10, c.r * 0.62, c.r * 0.40, 2); ctx.fill();
  }

  // 언덕 두 겹. 멀리 있는 것이 연하고 낮다
  ctx.fillStyle = P.hillFar;
  ctx.beginPath();
  ctx.moveTo(-OX, H * (HORIZON + 0.02));
  ctx.quadraticCurveTo(W * 0.25, H * (HORIZON - 0.055), W * 0.56, H * (HORIZON + 0.012));
  ctx.quadraticCurveTo(W * 0.82, H * (HORIZON - 0.035), SW - OX, H * (HORIZON + 0.02));
  ctx.lineTo(SW - OX, H); ctx.lineTo(-OX, H); ctx.closePath(); ctx.fill();

  ctx.fillStyle = P.meadow;
  ctx.beginPath();
  ctx.moveTo(-OX, H * (HORIZON + 0.05));
  ctx.quadraticCurveTo(W * 0.40, H * (HORIZON + 0.008), SW - OX, H * (HORIZON + 0.052));
  ctx.lineTo(SW - OX, H); ctx.lineTo(-OX, H); ctx.closePath(); ctx.fill();

  stitch(() => {
    ctx.beginPath();
    ctx.moveTo(-OX, H * (HORIZON + 0.056));
    ctx.quadraticCurveTo(W * 0.40, H * (HORIZON + 0.014), SW - OX, H * (HORIZON + 0.058));
  }, 'rgba(251,245,230,.55)', 1.8, [5, 6]);

  /* 초원 위에 덧댄 펠트 조각. 한 색으로 두면 잔디가 아니라 종이로 보인다.
     좌표를 고정값으로 두는 이유는 매 프레임 같은 자리에 있어야 조각처럼 읽히기 때문이다. */
  const PATCH = [[0.18, 0.30, 0.30, 0.075], [0.74, 0.40, 0.26, 0.065],
                 [0.42, 0.55, 0.34, 0.080], [0.10, 0.62, 0.22, 0.055]];
  ctx.fillStyle = P.meadowAlt;
  for (const [px, py, prx, pry] of PATCH) {
    wobbleBlob(W * px, H * py, W * prx, H * pry, px * 10, 4); ctx.fill();
  }

  // 앞쪽 모래 자리. 물범이 앉은 곳이 다른 천이어야 무대가 선다
  ctx.fillStyle = P.sand;
  ctx.beginPath();
  ctx.moveTo(-OX, H * 0.80);
  ctx.quadraticCurveTo(W * 0.5, H * 0.665, SW - OX, H * 0.80);
  ctx.lineTo(SW - OX, H); ctx.lineTo(-OX, H); ctx.closePath(); ctx.fill();
  stitch(() => {
    ctx.beginPath();
    ctx.moveTo(-OX, H * 0.806);
    ctx.quadraticCurveTo(W * 0.5, H * 0.671, SW - OX, H * 0.806);
  }, 'rgba(255,255,255,.6)', 1.8, [5, 6]);

  // 밴드 밖은 무대 밖이다. 가로 화면에서 게임이 어디까지인지 보여준다
  if (OX > 0) {
    ctx.save(); ctx.fillStyle = 'rgba(74,63,53,.055)';
    ctx.fillRect(-OX, 0, OX, H); ctx.fillRect(W, 0, OX + 2, H);
    ctx.restore();
  }
}

function draw(dt) {
  ctx.clearRect(-OX, 0, SW, H);
  drawWorld(dt);
  for (const p of props) drawProp(p);
  drawSeal();
  drawCat();
  drawPuffs(dt);

  // 처음 온 사람에게 말 없이 알려준다. 한 번 주우면 사라진다
  if (hintOn) {
    const t = props.find(p => p.loose);
    if (t) {
      const a = 0.35 + Math.sin(T * 3.4) * 0.25;
      ctx.save(); ctx.globalAlpha = a;
      ctx.strokeStyle = '#fbf5e6'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r * (1.4 + Math.sin(T * 3.4) * 0.12), 0, 7); ctx.stroke();
      ctx.restore();
    }
  }

  // 섬유 한 겹. 이것 하나로 화면 전체가 같은 천이 된다
  if (fiber) {
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = fiber;
    ctx.fillRect(-OX, 0, SW, H);
    ctx.restore();
  }
  // 가장자리 그늘. 디오라마 상자 안처럼 보이게 한다
  const v = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.30, W * 0.5, H * 0.5, H * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(74,63,53,.16)');
  ctx.fillStyle = v; ctx.fillRect(-OX, 0, SW, H);
}

/* ---------- 입력 — 탭 하나가 전부다 ---------- */
function pointAt(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: src.clientX - rect.left - OX, y: src.clientY - rect.top };
}
function onTap(e) {
  if (state !== 'playing') return;
  Sfx.wake();
  const { x, y } = pointAt(e);
  cat.idle = 0; cat.nap = 0;
  const onSeal = Math.hypot(x - seal.x, (y - seal.y) * 0.9) < seal.r * 1.30;
  if (onSeal) {
    cat.tx = seal.x - seal.r * 1.05; cat.ty = seal.y - seal.r * 0.05;
    cat.target = { type: 'seal' };
    cat.face = 1;
    return;
  }
  let best = null, bd = W * 0.17;
  for (const p of props) {
    const d = Math.hypot(x - p.x, y - p.y);
    if (d < bd) { bd = d; best = p; }
  }
  const gx = best ? best.x - W * 0.09 : x;
  const gy = best ? best.y + best.r * 0.30 : y;
  cat.tx = Math.max(W * 0.07, Math.min(W * 0.93, gx));
  cat.ty = Math.max(H * (HORIZON + 0.05), Math.min(H * 0.78, gy));   // 고양이는 땅 위에만 선다
  cat.target = best ? { type: 'prop', p: best } : null;
}
canvas.addEventListener('pointerdown', onTap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onTap(e); }, { passive: false });

/* ---------- 고양이가 도착해서 톡 친다 ---------- */
function arrive() {
  const t = cat.target; cat.target = null; cat.paw = 0.28;
  if (!t) return;
  if (t.type === 'seal') {
    if (carried > 0) {
      carried--; filled++; given++;
      Sfx.belly(stage);
      seal.wob = 0.40;
      puff(seal.x, seal.y - seal.r * 0.2, 5, '#f5ead2');
      if (stage < 6 && filled >= STAGE_COST[stage]) {
        filled -= STAGE_COST[stage]; stage++;
        seal.blink = 1.6;                    // 표정은 여기서만 바뀐다
        cat.patted = 1.4;                    // 물범이 고양이 엉덩이를 팡팡팡
        Sfx.pat3();
        puff(seal.x, seal.y - seal.r * 0.5, 26, '#fbf5e6');
        shareBtn.classList.add('ping');
        newCard = true;
      }
      save();
    } else {
      Sfx.belly(stage);                      // 실이 없으면 진행도만 듣는다
      seal.wob = 0.24;
    }
    return;
  }
  const p = t.p;
  p.squash = 0.32; p.wob = 0.5; p.pop = 0;
  cat.face = p.x >= cat.x ? 1 : -1;
  if (p.loose) {
    p.loose = false; carried++;
    if (T - comboAt < 4.5) combo++; else combo = 0;
    comboAt = T;
    Sfx.hollow(combo);
    puff(p.x + p.r * 0.5, p.y - p.r * 0.9, 7, '#fbf5e6');
    hintOn = false;
  } else {
    combo = 0;
    Sfx.prop(MAT[p.kind]);
    puff(p.x, p.y - p.r * 0.5, 3, p.kind === 'pond' ? '#cfe6f0' : '#e8dcc4');
  }
}

/* ---------- 공유 카드 ----------
   물범을 키우는 게임에서 사람들이 실제로 올리는 것은 점수가 아니라 자기 물범이다.
   화면을 그대로 잘라 쓴다 — 따로 그리면 게임과 다른 그림이 나가고, 그 순간 광고가 된다. */
const shareBtn = document.getElementById('shareBtn');
const cardWrap = document.getElementById('cardWrap');
const cardImg = document.getElementById('cardImg');
const cardSave = document.getElementById('cardSave');
let newCard = false, cardBlob = null;

function buildCard() {
  const CW = 1080, CH = 1200;
  const cv = document.createElement('canvas');
  cv.width = CW; cv.height = CH;
  const g = cv.getContext('2d');
  g.fillStyle = '#efe3cc'; g.fillRect(0, 0, CW, CH);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const srcW = W * dpr, srcH = Math.min(H, W * 1.02) * dpr;
  const srcX = OX * dpr, srcY = (H * dpr) - srcH;
  const pad = 36, iw = CW - pad * 2, ih = iw * (srcH / srcW);
  g.save();
  g.beginPath();
  const rr = 28, x = pad, y = pad, w = iw, h = Math.min(ih, CH - pad * 2 - 150);
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr); g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr); g.arcTo(x, y, x + w, y, rr);
  g.closePath(); g.clip();
  g.drawImage(canvas, srcX, srcY, srcW, srcH, x, y, w, ih);
  g.restore();

  const baseY = pad + Math.min(ih, CH - pad * 2 - 150);
  g.fillStyle = '#4a3f35';
  g.font = '800 62px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
  g.textAlign = 'left';
  g.fillText(`DAY ${day} · ${STAGE_NAME[stage].toUpperCase()}`, pad + 6, baseY + 84);
  g.font = '700 34px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
  g.fillStyle = 'rgba(74,63,53,.62)';
  g.fillText(`${given} yarn given`, pad + 6, baseY + 130);
  g.textAlign = 'right';
  g.fillText('just1game.com/games/feltling/', CW - pad - 6, baseY + 130);
  // 바느질 한 줄. 카드도 같은 천이어야 한다
  g.setLineDash([9, 11]); g.lineWidth = 4; g.strokeStyle = 'rgba(74,63,53,.28)';
  g.beginPath(); g.moveTo(pad, baseY + 28); g.lineTo(CW - pad, baseY + 28); g.stroke();
  return cv;
}

function openCard() {
  const cv = buildCard();
  cardImg.src = cv.toDataURL('image/png');
  cv.toBlob((b) => {
    cardBlob = b;
    if (cardSave.href.startsWith('blob:')) URL.revokeObjectURL(cardSave.href);
    cardSave.href = URL.createObjectURL(b);
  }, 'image/png');
  cardWrap.classList.add('open');
  shareBtn.classList.remove('ping');
  newCard = false;
}
shareBtn.addEventListener('click', openCard);
document.getElementById('cardClose').addEventListener('click', () => cardWrap.classList.remove('open'));
cardWrap.addEventListener('click', (e) => { if (e.target === cardWrap) cardWrap.classList.remove('open'); });
document.getElementById('cardShare').addEventListener('click', async () => {
  if (!cardBlob) return;
  const file = new File([cardBlob], 'my-feltling.png', { type: 'image/png' });
  const data = { files: [file], text: `Day ${day}. My feltling is ${STAGE_NAME[stage]}.`,
                 url: 'https://just1game.com/games/feltling/' };
  try {
    if (navigator.canShare && navigator.canShare(data)) { await navigator.share(data); return; }
  } catch { /* 사용자가 닫았거나 iframe이라 못 연다. 저장 버튼이 그대로 있다 */ }
  cardSave.click();
});

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  muted = !Sfx.toggle();
  muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
});

/* ---------- 루프 ---------- */
let last = performance.now();
let acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tick++;
  T += dt;

  /* 스톱모션. 부드러운 보간 대신 톡톡 끊기게 움직이면 어색한 게 아니라 진짜 인형처럼
     보인다 — 펠트가 회전할 때 조명이 어긋나는 약점을 리듬으로 바꾼 것이다.
     12fps로 위치를 갱신하고 그리기는 매 프레임 한다(게이트는 rAF 프레임을 센다). */
  acc += dt;
  const STEP = 1 / 12;
  while (acc >= STEP) {
    acc -= STEP;
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, d = Math.hypot(dx, dy);
    const speed = W * 2.4;
    cat.moving = d > 2;
    if (cat.moving) {
      cat.face = dx >= 0 ? 1 : -1;
      const s = Math.min(d, speed * STEP);
      cat.x += dx / d * s; cat.y += dy / d * s;
      if (Math.hypot(cat.tx - cat.x, cat.ty - cat.y) <= 2 && cat.target) arrive();
    } else if (cat.target) arrive();
  }

  for (const p of props) {
    p.squash = Math.max(0, p.squash - dt * 2.6);
    p.wob = Math.max(0, p.wob - dt * 1.8);
    if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 1.2);
  }
  seal.wob = Math.max(0, (seal.wob || 0) - dt * 2.2);
  seal.blink = Math.max(0, (seal.blink || 0) - dt);
  cat.paw = Math.max(0, cat.paw - dt * 3);
  cat.patted = Math.max(0, cat.patted - dt);

  // 다 채운 뒤에 손을 놓으면 고양이가 물범 옆에서 잠든다. 끝이 아니라 쉼이다
  if (!cat.moving && !cat.target) cat.idle += dt; else cat.idle = 0;
  if (stage >= 6 && cat.idle > 4) { cat.nap = 1; seal.nap = 1; }
  else if (cat.idle < 0.2) { cat.nap = 0; seal.nap = 0; }

  // 세계는 계속 조금씩 풀린다. 실이 떨어져서 할 일이 없어지는 순간이 오면 안 된다
  unravelIn -= dt;
  if (unravelIn <= 0) { unravelOne(); unravelIn = 7 + Math.random() * 6; }
  if (T - comboAt > 5) combo = 0;

  draw(dt);
  yarnEl.textContent = String(carried);
  stageEl.textContent = STAGE_NAME[stage];
  requestAnimationFrame(frame);
}
const yarnEl = document.getElementById('yarn');
const stageEl = document.getElementById('stageLabel');

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ----------
   session:'cozy'가 핵심이다. 이 선언이 없으면 게이트는 아케이드 규칙으로 판정하고,
   "방치했는데 안 끝난다"를 결함으로 잡는다 — 이 게임에서는 그게 정상이다.
   score 자리에는 점수가 아니라 진행도(지금까지 준 실)를 싣는다. */
window.__GAME__ = {
  api: 1,
  session: 'cozy',
  get state() { return state; },
  get score() { return given; },
  get tick() { return tick; },
  get field() { return { x: OX, w: W, h: H, screenW: SW }; },
  start() { state = 'playing'; },
  pause() { state = 'paused'; },
  resume() { state = 'playing'; }
};

load();
seedScene();
makeFiber();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
