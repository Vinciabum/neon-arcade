<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== PAGE TEXT — 새 게임에서 이 블록을 교체한다 ===== -->
<title>Flux Sort — Neon Arcade</title>
<!-- ===== PAGE TEXT 끝 ===== -->
<style>
  :root { --neon: #00e5ff; --bg: #05060a; --ink: #e8f6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud b { color: var(--neon); font-weight: 700; }
  /* HUD 높이를 바꾸면 플레이 밴드(390/806)가 깨진다. font를 물려받고 padding·border를 0으로
     둬서 줄 상자가 옆의 span과 같게 만든다 — 아이콘 대신 글자를 쓰는 이유도 그거다. */
  #hud button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; letter-spacing: inherit; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #070912; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(5, 6, 10, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: .04em; color: var(--neon); }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.5; opacity: .85; font-size: 14px; }
  .btn { appearance: none; border: 1px solid var(--neon); background: transparent; color: var(--neon);
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
    min-width: 160px; min-height: 48px; }
  .btn:active { background: rgba(0, 229, 255, .16); }
</style>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://just1game.com/games/flux-sort/">
</head>
<body>
<div id="wrap">
  <!-- ===== HUD & OVERLAYS — 새 게임에서 이 블록을 교체한다 =====
       id는 스크립트가 참조한다. HUD에 목숨·레벨을 더하면 아래 el 조회도 같이 늘려야 한다.
       canvas#c 와 두 오버레이의 id(titleScreen·overScreen)는 그대로 두는 편이 안전하다.
       이 게임은 남은 시간과 버퍼 적재량을 캔버스 안(코어 링)에 그린다 — 손이 있는 곳과
       숫자가 있는 곳이 같아야 드래그 도중에 눈이 HUD로 올라가지 않는다. -->
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
    <button id="muteBtn" type="button" aria-label="Toggle sound">SOUND <b>ON</b></button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="titleScreen">
      <h1>FLUX SORT</h1>
      <p>Data shards pile up in the core. Drag each one out into the matching channel — up, right, down or left. Sorting buys time. Mouse or finger, no keyboard.</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
    <div class="overlay" id="overScreen" hidden>
      <h1>BUFFER LOST</h1>
      <p>Score <b id="finalScore">0</b></p>
      <button class="btn" id="againBtn" type="button">Sort again</button>
    </div>
  </div>
  <!-- ===== HUD & OVERLAYS 끝 ===== -->
</div>

<script>
/* ============================================================
   NEON ARCADE — GAME BASE
   새 게임은 이 파일을 복사해 play/<slug>.html 로 두고
   "GAME LOGIC" 구역만 교체한다. 그 위/아래(계약·입력·FX·루프·포털 훅)는 그대로 둔다.
   ============================================================ */

const SLUG = 'flux-sort';                  // 새 게임에서 슬러그로 바꾼다
const BEST_KEY = 'just1game:' + SLUG + ':best';

/* ---------- 최고점 저장 ----------
   localStorage는 샌드박스 iframe이나 서드파티 저장소가 차단된 환경에서
   읽기만 해도 throw한다 — 이 파일이 SDK 훅을 들고 가는 포털 임베드가 정확히 그 환경이다.
   막히면 메모리에만 유지한다(그 세션 동안은 최고점이 동작하고, 다음 방문에 사라진다). */
function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}

/* ---------- 포털 SDK 훅 ----------
   사이트 배포에서는 비활성 no-op. 포털 납품 빌드에서만 PORTAL.enabled를 켠다.
   게임 로직은 아래 4개 함수만 부른다 — SDK가 무엇으로 바뀌어도 로직은 안 바뀐다. */
const PORTAL = { enabled: false, gameId: '' };
const Portal = {
  ready() { if (!PORTAL.enabled) return Promise.resolve(); return Promise.resolve(window.gdsdk); },
  gameplayStart() { if (PORTAL.enabled && window.gdsdk) window.gdsdk.preloadAd?.('rewarded'); },
  gameplayStop() { /* 납품 빌드에서 SDK의 gameplayStop을 연결한다 */ },
  adBreak(done) { done(); }   // 비활성 상태에서는 즉시 콜백. 게임이 광고를 기다리며 멈추지 않는다
};

/* ---------- 오디오: 사용자 제스처 이후에만 초기화 (모바일 정책) ---------- */
let actx = null;
function audioReady() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 제스처 안에서 만들어도 suspended로 시작할 수 있다 (특히 iOS·임베드).
  // 깨우지 않으면 모든 복제 게임이 조용히 무음이 된다. 거부는 무시한다 — 소리는 부가 기능이다.
  Promise.resolve(actx.resume?.()).catch(() => {});
}
function beep(freq, ms) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.value = 0.04;
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + ms / 1000);
}

/* ---------- BGM: 배경음도 코드로 쓴다 (프레임 레벨) ---------- */
// 오디오 파일을 들이지 않는 이유는 스프라이트 때와 같다 — 라이선스와 용량이다.
//
// 프레임 안에서 음을 만들지 않는다. 게이트 1이 fps 하한 50을 재므로 rAF에 붙이는 설계는
// 처음부터 못 쓴다. 박자를 오디오 스레드에 미리 예약하고 JS는 4Hz로만 깨어난다.
//
// state를 직접 읽는다 — start/gameOver/pause/resume 네 곳에 손을 대는 설계였으면
// 게임마다 한 곳을 빠뜨렸을 것이고, 그건 "게임오버 화면에서 음악만 계속 도는" 것으로 나타난다.
const BGM = (function () {
  // root=기음(Hz) · beat=한 박(초) · pattern=반음 오프셋(null은 쉼표)
  // 분류를 재촉하는 게임이라 빠르고 계단식으로 오르내린다.
  const SONG = {
    root: 261.6, beat: 0.24, wave: 'square',
    pattern: [0, 2, 3, 5, 7, 5, 3, 2, 7, 8, 10, 8, 7, 5, 3, null]
  };
  const MUTE_KEY = 'just1game:' + SLUG + ':muted';

  let bus = null, at = 0, step = 0, playing = false;
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { /* 차단된 저장소 */ }

  function tone(freq, when, dur, wave, vol) {
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, when);
    // 사각파를 그냥 켜고 끄면 딱딱 소리가 난다. 짧은 램프로 감싼다.
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(bus);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  }

  // 0.5초 앞까지만 채운다. 더 멀리 예약하면 정지가 그만큼 늦게 먹는다.
  // 광고로 컨텍스트가 suspend되면 currentTime이 멈추므로 여기서 저절로 멈춘다.
  function fill() {
    while (at < actx.currentTime + 0.5) {
      const i = step % SONG.pattern.length;
      const semi = SONG.pattern[i];
      if (semi !== null) {
        tone(SONG.root * Math.pow(2, semi / 12), at, SONG.beat * 0.85, SONG.wave, 0.018);
      }
      if (i % 4 === 0) tone(SONG.root / 2, at, SONG.beat * 3.2, 'triangle', 0.026);
      at += SONG.beat;
      step++;
    }
  }

  function begin() {
    if (!bus) { bus = actx.createGain(); bus.connect(actx.destination); }
    playing = true;
    at = actx.currentTime + 0.1;
    fill();
  }
  // 이미 예약된 음이 남아 있으므로 버스를 끊는다. 다음 begin()이 새로 만든다.
  function end() {
    playing = false;
    if (bus) { try { bus.disconnect(); } catch (e) {} bus = null; }
  }

  // 제스처를 기다리지 않는다 — actx가 없으면 아무것도 안 하고 넘어간다.
  setInterval(function () {
    if (!actx) return;
    const want = state === S.PLAYING && !muted;
    if (want && !playing) begin();
    else if (!want && playing) end();
    else if (playing) fill();
  }, 250);

  const btn = document.getElementById('muteBtn');
  const paint = () => { if (btn) btn.querySelector('b').textContent = muted ? 'OFF' : 'ON'; };
  if (btn) {
    btn.addEventListener('click', () => {
      audioReady();          // 소리를 켜는 클릭이 곧 제스처다 — 여기서 컨텍스트가 열린다
      muted = !muted;
      try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
      if (muted) end();
      paint();
    });
  }
  paint();

  return { isMuted: () => muted, isPlaying: () => playing };
})();

/* ---------- 캔버스: 반응형 + DPR ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// 플레이 밴드 — 창이 가로로 넓어도 게임이 도는 판은 늘 세로 비율이다.
// 이게 없으면 치수를 H에서 파생하므로 넓은 창일수록 조작 목표가 화면 폭 대비 작아진다
// (900x600에서 3.2배 어려웠다). 806은 기준 폰 390x844에서 HUD 38px를 뺀 캔버스 높이다.
const BAND = 390 / 806;
let W = 0, H = 0;        // 플레이필드 — 게임 로직이 쓰는 좌표계. W는 밴드 폭이다
let SW = 0, OX = 0;      // 실제 화면 폭 / 밴드 좌측 여백. 배경만 이 둘을 본다
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  // 원점을 밴드 왼쪽으로 옮긴다. 게임 코드는 W가 화면 폭인 줄 알고 그대로 돌아간다.
  // 기준 화면에서는 round(806*BAND)=390=SW라 OX=0 — 픽셀 하나 안 변한다.
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   FX — 파티클·화면 흔들림·플래시. 프레임의 일부이므로 새 게임이 그대로 물려받는다.
   에셋도 라이브러리도 쓰지 않는다: 이 파이프라인의 게임은 캔버스로만 그린다
   (에셋 라이선스가 기존 게임의 상업적 사용을 막았고, 그 실수를 반복하지 않는다).

   GAME LOGIC이 부르는 것은 이 셋뿐이다:
     FX.burst(x, y, color[, count])  — (x,y)에서 파편이 터진다. 캔버스 픽셀 좌표
     FX.shake(px)                    — 화면을 px만큼 흔든다 (여러 번 부르면 큰 쪽이 이긴다)
     FX.flash(color[, sec, peak])    — 화면 전체를 잠깐 덮는다. peak은 가장 진할 때의 알파
     FX.trail(x, y, color, w, h[, sec]) — 잔상 하나. 매 프레임 불러 이동 흔적을 만든다
   루프가 부르는 것: FX.update(dt) / FX.begin(ctx) / FX.draw(ctx) / FX.end(ctx)

   begin/end로 감싸는 이유: 흔들림은 화면 전체를 옮기는 것이라
   옮긴 만큼 가장자리에 빈 띠가 생긴다. begin이 먼저 FX.bg로 캔버스를 덮고 옮긴다.
   그래서 FX.bg는 게임 배경색과 같아야 한다 — 새 게임에서 배경을 바꾸면 이 값도 바꾼다.
   ============================================================ */
const FX = (() => {
  // 파티클은 고정 풀에서만 꺼낸다. 폭발마다 객체를 새로 만들면 60초 플레이에서
  // 힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다. 다 차면 오래된 것부터 덮어쓴다.
  const MAX = 220;
  const pool = new Array(MAX);
  for (let i = 0; i < MAX; i++) pool[i] = { life: 0, ttl: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, w: 2, h: 2, color: '#fff' };
  let head = 0;

  let amp = 0, sx = 0, sy = 0;
  let flashT = 0, flashDur = 1, flashPeak = 0.55, flashColor = '#fff';

  // 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
  // 매번 달라져 실패를 다시 만들어낼 수 없다.
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  const take = () => { const p = pool[head]; head = (head + 1) % MAX; return p; };

  return {
    bg: '#070912',

    burst(x, y, color, count = 14) {
      // 속도·크기·중력을 화면 높이에서 파생한다. 픽셀 상수로 두면 4K에서 먼지가 된다
      // (M()이 스프라이트에 대해 하는 것과 같은 이유).
      const spd = H * 0.42, grav = H * 0.9, size = Math.max(1.5, H * 0.0055);
      for (let i = 0; i < count; i++) {
        const a = rnd() * Math.PI * 2;
        const v = spd * (0.35 + rnd() * 0.85);
        const p = take();
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - spd * 0.25;
        p.g = grav; p.w = p.h = size * (0.7 + rnd() * 0.9);
        p.ttl = p.life = 0.45 + rnd() * 0.5;
        p.color = color;
      }
    },

    trail(x, y, color, w, h, sec = 0.26) {
      const p = take();
      p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0;
      p.w = w; p.h = h; p.ttl = p.life = sec; p.color = color;
    },

    shake(px) { amp = Math.max(amp, px); },

    // peak은 가장 진할 때의 알파. 사망처럼 화면을 끊는 순간은 세게, 등장·획득처럼
    // 자주 일어나는 순간은 약하게 — 약한 값이 없으면 흔한 사건이 화면을 계속 세탁한다.
    flash(color, sec = 0.2, peak = 0.55) { flashColor = color; flashDur = sec; flashT = sec; flashPeak = peak; },

    update(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      // 흔들림은 지수 감쇠. 매 프레임 새 오프셋을 뽑아야 '떨림'으로 보인다.
      amp *= Math.exp(-dt * 9);
      if (amp < 0.35) amp = 0;
      sx = amp ? (rnd() * 2 - 1) * amp : 0;
      sy = amp ? (rnd() * 2 - 1) * amp : 0;
      if (flashT > 0) flashT -= dt;
    },

    begin(ctx) {
      // 흔들림이 만드는 빈 띠를 덮는 판은 밴드가 아니라 화면 전체를 덮어야 한다
      if (sx || sy) { ctx.fillStyle = this.bg; ctx.fillRect(-OX, 0, SW, H); }
      ctx.save();
      ctx.translate(sx, sy);
    },

    draw(ctx) {
      // 가산 합성. 어두운 배경에서 파편이 겹칠수록 밝아져 네온처럼 보인다.
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        ctx.globalAlpha = p.life / p.ttl;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    end(ctx) {
      ctx.restore();
      // 플래시는 흔들림 밖에서 그린다 — 화면 전체를 덮는 판이라 같이 흔들리면 띠가 생긴다.
      if (flashT > 0) {
        ctx.globalAlpha = Math.min(1, (flashT / flashDur) * flashPeak);
        ctx.fillStyle = flashColor;
        ctx.fillRect(-OX, 0, SW, H);   // 밴드만 번쩍이면 화면이 두 조각으로 읽힌다
        ctx.globalAlpha = 1;
      }
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
let state = S.TITLE;
let score = 0;
let tick = 0;
let best = loadBest();
let autoPaused = false;      // 탭이 숨겨져서 우리가 멈춘 것인지 구분한다

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  finalScore: document.getElementById('finalScore'),
  title: document.getElementById('titleScreen'),
  over: document.getElementById('overScreen')
};
el.best.textContent = best;

/* ---------- 입력: 키보드 + 터치 이중 ----------
   left/right는 '방향을 누르고 있다', aimX는 '이 지점을 짚었다'(0~1, 캔버스 폭 비율)이다.
   두 채널을 함께 두는 이유: 손가락은 화면 절반을 누르는 것보다 원하는 자리를 짚는 쪽이
   훨씬 정확한데, 키보드에는 그런 좌표가 없다. 게임 로직이 둘 다 읽고 하나로 합친다. */
const input = { left: false, right: false, aimX: null };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  // Space/Enter: 일시정지 중이면 재개한다. state !== PLAYING 하나로 묶으면
  // 멈춰 둔 판이 새 판으로 날아가고, 죽은 직후 프레임에 스스로 재시작해
  // 수집기가 'over'를 한 번도 못 보는 일이 생긴다.
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === S.PAUSED) resume();
    else if (state === S.TITLE || state === S.OVER) start();
  }
  if (e.code === 'KeyP') { state === S.PLAYING ? pause() : state === S.PAUSED ? resume() : 0; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// 짚은 지점을 캔버스 폭 비율로 바꾼다. 화면 절반 비교(왼쪽/오른쪽)로 두면
// 손가락이 '방향 버튼 두 개'가 되어 원하는 자리에 설 수 없다 — 드래그가 곧 조준이 되게 한다.
// 밴드 기준으로 잰다. ctx의 transform은 그리기만 옮기지 입력은 안 옮기므로
// OX를 여기서 직접 빼야 한다 — 안 빼면 가로 화면에서 손가락과 판이 어긋난다.
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  input.aimX = Math.min(1, Math.max(0, (clientX - rect.left - OX) / W));
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); audioReady();
  // 일시정지 상태에서의 탭은 재시작이 아니라 재개다 (Space와 같은 규칙).
  // 지금은 닿기 어려운 경로지만, 이 파일은 모든 새 게임에 복사된다 —
  // 화면 내 일시정지 버튼을 붙이는 게임이 그대로 버그를 물려받는다.
  if (state === S.PAUSED) { resume(); return; }
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault(); clearInput();
}, { passive: false });
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;      // 터치는 위에서 처리
  audioReady();
  if (state === S.PAUSED) { resume(); return; }   // 위 touchstart와 같은 규칙
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  // 마우스는 누르고 끌 때만 조준한다. 그냥 지나가는 커서까지 따라가면
  // 키보드로 놀던 사람의 플레이어가 제멋대로 끌려간다.
  if (e.pointerType !== 'touch' && e.buttons === 1 && state === S.PLAYING) aimAt(e.clientX);
});
// 캔버스 밖에서 손을 떼도 반드시 풀린다. 캔버스에만 걸면 오버레이 위에서 뗀 포인터가
// aimX를 붙잡은 채로 남아 다음 판이 한쪽으로 끌려간 채 시작한다.
window.addEventListener('pointerup', () => { clearInput(); });
window.addEventListener('pointercancel', () => { clearInput(); });

document.getElementById('startBtn').addEventListener('click', () => { audioReady(); start(); });
document.getElementById('againBtn').addEventListener('click', () => { audioReady(); start(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === S.PLAYING) { autoPaused = true; pause(); }
  } else if (autoPaused) {
    autoPaused = false;
    resume();
  }
});

/* ---- Axis: 좌우 한 축의 조작감 (프레임 레벨) ----
   가로 이동을 쓰는 게임이면 값만 바꿔 그대로 쓴다. 여기 있는 이유가 중요하다 —
   조작감 수식이 GAME LOGIC 안에 있으면 새 게임이 그 구역을 지우는 순간
   가속·마찰·조준 추종이 전부 같이 사라진다. 그러면 템플릿을 손본 의미가 없다.

   Axis.step(p, { dir, aimX }, dt) 는 p.x(0~1)와 p.vx를 갱신한다.
   dir: -1|0|1 (키보드), aimX: 0~1 또는 null (터치·포인터가 짚은 위치).
   가로 이동이 없는 게임(격자·탭 방식)은 이 블록을 안 부르면 그만이다. */
const Axis = {
  ACCEL: 7.0,        // 가속도 (화면 폭 배수/초²)
  MAX_SPD: 1.15,     // 최고 속도 (화면 폭/초)
  FRICTION: 9.0,     // 입력이 없을 때 속도가 죽는 비율/초
  TURN_BOOST: 2.4,   // 반대로 꺾을 때 가속 배수. 없으면 방향 전환이 마찰만큼 늦게 먹힌다
  AIM_ACCEL: 26.0,   // 짚은 지점을 향한 가속. 속도를 직접 넣지 않는 이유는 아래 참고
  AIM_SNAP: 0.004,   // 이 거리 안이면 붙인다 — 손가락 밑에서 미세하게 떠는 것을 막는다
  MIN_X: 0.06,
  MAX_X: 0.94,

  step(p, { dir = 0, aimX = null }, dt) {
    if (aimX !== null) {
      const d = aimX - p.x;
      if (Math.abs(d) < this.AIM_SNAP) {
        p.x = aimX;
        p.vx = 0;
      } else {
        // 속도를 바로 대입하면 손가락이 조금만 멀어져도 최고속에 붙어버려서
        // 터치에는 관성이 사라진다. 키보드와 같은 가속 경로를 태워야 두 조작이
        // 같은 게임처럼 느껴진다. 목표를 지나치지 않도록 마찰도 같이 건다.
        p.vx += Math.sign(d) * this.AIM_ACCEL * Math.min(1, Math.abs(d) * 6) * dt;
        p.vx -= p.vx * Math.min(1, this.FRICTION * 0.5 * dt);
        p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
      }
    } else if (dir !== 0) {
      // 이미 반대로 가고 있으면 더 세게 민다. 안 그러면 방향 전환에 마찰이 죽을 때까지
      // 기다려야 해서 가속을 넣은 순간 조작이 오히려 굼떠진다.
      const turning = dir * p.vx < 0;
      p.vx += dir * this.ACCEL * (turning ? this.TURN_BOOST : 1) * dt;
      p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
    } else {
      // dt에 비례한 감쇠. 1을 넘지 않게 막아야 프레임이 튈 때 속도가 반대로 뒤집히지 않는다.
      p.vx -= p.vx * Math.min(1, this.FRICTION * dt);
    }

    p.x += p.vx * dt;
    if (p.x < this.MIN_X) { p.x = this.MIN_X; p.vx = 0; }   // 벽에 붙으면 속도도 죽인다 —
    if (p.x > this.MAX_X) { p.x = this.MAX_X; p.vx = 0; }   // 안 그러면 벽에서 떼는 순간 튄다
  }
};

/* ---- Curve: 시간에 따라 오르는 값 (프레임 레벨) ----
   한 축만 올리면 그 축이 상한에 닿는 순간 화면이 더 이상 변하지 않아
   유능한 플레이어가 같은 패턴을 반복하게 된다. 축마다 다른 시점에 상한에 닿게 두면
   난이도가 계속 바뀐다. elapsed(경과 초)를 넣으면 현재 값이 나온다. */
const Curve = (start, limit, ramp) => (elapsed) =>
  limit > start ? Math.min(limit, start + ramp * elapsed)
                : Math.max(limit, start - ramp * elapsed);

/* ============================================================
   ===== GAME LOGIC — 새 게임에서 이 구역만 교체한다 =====
   지켜야 할 계약:
     reset()     : 새 판의 초기 상태를 만든다 (score는 호출자가 0으로 만든다)
     step(m, dt) : dt(초)만큼 진행. 죽으면 gameOver()를 부른다.
                   입력을 주지 않으면 반드시 몇 초 안에 죽어야 한다 (게이트 2 방치 종결)
     draw(m, dt) : 캔버스를 그린다. 모든 상태에서 매 프레임 불린다.
                   단색이고 정지한 화면이면 게이트 1이 막는다
     m 은 루프가 프레임당 한 번 만든 M() 결과다 — step과 draw가 같은 값을 본다
   쓸 수 있는 것: FX.burst / FX.shake / FX.flash / FX.trail (위 FX 블록 참고).
   파티클과 잔상은 루프가 알아서 갱신·렌더하므로 여기서는 부르기만 한다.

   FLUX SORT — 화면 전체가 네 개의 채널이다. 중앙 코어(버퍼)에 데이터 조각이 쌓이고,
   플레이어는 조각을 집어 자기 색 채널 쪽으로 끌어내 버린다. 분류하면 시간을 벌고,
   시간이 0이 되거나 코어 정원이 넘치면 끝난다.

   왜 사분면인가: 드롭 대상이 화면 구석의 작은 상자면 손가락이 그 상자를 가려서
   모바일에서 조준이 불가능해진다. 배경 전체를 목표로 만들면 방향만 맞으면 되고,
   '어디에 놓을지'가 아니라 '어느 쪽으로 던질지'의 문제가 된다.
   ============================================================ */

/* ---- 난이도 곡선 ----
   네 축이 서로 다른 시점에 상한에 닿는다: 압력 22초, 유입 34초, 보상 48초, 정원 66초.
   한 축만 올리면 그 축이 멈추는 순간 판이 같은 리듬으로 굳는다. */
const pressAt    = Curve(0.55, 1.35, 0.0364);   // 조각을 바깥으로 미는 힘 (U 배수/초²) — 22초
const spawnGapAt = Curve(1.15, 0.42, 0.0215);   // 유입 간격 (초) — 34초
const timeGainAt = Curve(1.00, 0.40, 0.0125);   // 분류 하나가 주는 시간 (초) — 48초
const capAt      = Curve(9, 14, 0.076);         // 코어 정원 (개) — 66초

/* ---- 방치 종결은 시계가 아니라 넘침이 맡는다 ----
   게이트 2는 입력이 없으면 약 8초 안에 끝날 것을 요구한다. 처음에는 그걸 플레이어의
   제한시간으로 만족시켰는데(TIME_START 7초), 그러면 **실제 플레이도 7~10초에 끝난다.**
   심사에서 세션 항목이 9/20이었고 스크린샷 10장이 전부 0점이었다.

   게이트가 요구하는 것은 "끝이 있다"이지 "빨리 끝난다"가 아니다. 그래서 종결을
   손대지 않으면 저절로 나빠지는 상태 — 코어 넘침 — 으로 옮겼다.
   판은 조각 4개로 시작하고 1.15초마다 하나씩 들어오므로, 아무것도 안 하면
   6번째 유입에서 정원 9를 넘어 약 6.9초에 끝난다. 예산 안이다.
   그 대신 시계는 사람이 규칙을 익힐 만큼 준다. */
const TIME_START = 26.0;
const TIME_CAP = 32.0;     // 잘해도 무한히 쌓이지는 않는다 — 시간이 남아돌면 긴장이 사라진다
const MISS_COST = 0.30;    // 틀린 채널에 넣었을 때 잃는 시간

// 채널 넷. 색만 다르면 색약인 사람에게는 같은 게임이라 도형도 함께 다르다.
// 순서는 화면 방향과 같다: 0 위, 1 오른쪽, 2 아래, 3 왼쪽.
// 꼭짓점 수가 전부 다르다. 사각형과 마름모로 나눴더니 조각이 회전하는 순간 둘이 같은 도형이
// 되어 모양 단서가 통째로 사라졌다 — 회전해도 안 겹치려면 변의 개수 자체가 달라야 한다.
const CH = [
  { c: '#00e5ff', rgb: '0,229,255',   n: 3, off: -Math.PI / 2 },   // 위    — 삼각형
  { c: '#ff2e88', rgb: '255,46,136',  n: 5, off: -Math.PI / 2 },   // 오른쪽 — 오각형
  { c: '#ffb020', rgb: '255,176,32',  n: 4, off: Math.PI / 4 },    // 아래   — 정사각형
  { c: '#39ff8b', rgb: '57,255,139',  n: 6, off: 0 }               // 왼쪽   — 육각형
];
// 매 프레임 쓰는 색은 미리 문자열로 만들어 둔다. 프레임마다 rgba를 이어 붙이면
// 60초 플레이에서 짧은 문자열이 수만 개 생겨 게이트 2의 힙 증가율에 잡음이 섞인다.
for (const ch of CH) ch.wedge = 'rgba(' + ch.rgb + ',0.075)';
// 사분면 경계는 네 모서리로 향하는 대각선이다. i번 조각은 CORNERS[i]~CORNERS[i+1] 변을 향한다.
const CORNERS = [[0, 0], [1, 0], [1, 1], [0, 1]];

const MAX = 26;            // 조각 풀. 정원(최대 15)보다 넉넉하게 — 풀이 비어 스폰이 조용히 실패하면
                           // 오버플로가 안 오고 게임이 안 끝난다
const shards = new Array(MAX);
for (let i = 0; i < MAX; i++) shards[i] = { alive: false, x: 0, y: 0, vx: 0, vy: 0, ch: 0, spin: 1, rot: 0, rv: 0 };

let alive = 0;
let held = -1;             // 지금 끌고 있는 조각의 인덱스
let elapsed = 0;
let timeLeft = TIME_START;
let spawnIn = 0;
let spawnCount = 0;
let chain = 0;             // 연속 정답. 끊기면 0
let primed = false;        // 이번 판에서 한 번이라도 분류에 성공했는가
let round = 0;             // 몇 번째 판인가. 시드를 판마다 어긋내 같은 배치가 반복되지 않게 한다
let sweep = 0;             // 코어를 도는 스캔 바늘의 각도
let ripple = 0;            // 바깥으로 퍼지는 링의 위상
const portFlash = [0, 0, 0, 0];
const portBad = [false, false, false, false];

// 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
// 매번 달라져 실패를 다시 만들어낼 수 없다 (FX가 같은 이유로 자체 시드를 쓴다).
let seed = 9176;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

/* ---- 포인터: 이 게임은 좌표 하나가 아니라 (x, y) 두 축과 '쥐었다/놓았다'가 필요하다 ----
   프레임의 input(left/right/aimX)은 가로 한 축짜리라 드래그를 표현할 수 없다.
   프레임을 고치는 대신 이 구역에서 자기 리스너를 더 단다 — 프레임의 핸들러는 그대로 살아 있고
   (타이틀·게임오버에서 탭하면 시작하는 동작이 거기서 온다), 놓는 순간은 프레임이 이미
   부르고 있는 clearInput() 하나로 받는다. */
const ptr = { x: 0, y: 0, down: false };
let armed = false;         // 판을 시작시킨 그 누름으로 곧바로 조각을 집지 않게 막는다

function ptrAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = clientX - rect.left - OX;   // 밴드 기준
  ptr.y = clientY - rect.top;
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;   // 터치는 아래에서 처리 (프레임과 같은 분기)
  ptrAt(e.clientX, e.clientY);
  ptr.down = true;
  grab();
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || !ptr.down) return;
  ptrAt(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', (e) => {
  ptrAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  ptr.down = true;
  grab();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (!ptr.down) return;
  ptrAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: false });

// 이 게임이 쓰는 입력 필드를 비운다. 구역 밖(start)에서 input을 직접 건드리면
// jump·fire 같은 필드를 쓰는 다음 게임이 "누른 채로 죽으면 다음 판이 움직인 채 시작"
// 버그를 조용히 물려받는다. 필드를 아는 쪽은 이 구역뿐이다.
// 프레임은 pointerup·pointercancel·touchend에서 이것을 부른다 — 즉 '손을 뗐다'가 여기로 들어온다.
function clearInput() {
  input.left = input.right = false;
  input.aimX = null;
  release();
  ptr.down = false;
  armed = true;
}

// 스프라이트·판정·포트 위치를 한 곳에서 화면의 짧은 변에서 파생한다.
// 픽셀 상수로 두면 큰 화면에서 그림이 먼지처럼 작아진다. 높이가 아니라 min(W,H)를 쓰는 이유는
// 이 게임의 판이 정사각에 가까운 원형 코어라서다 — 세로로 긴 폰에서 높이를 기준으로 잡으면
// 코어가 화면 폭을 뚫고 나간다.
// 결과를 캐시한다: 이벤트 핸들러(grab·release)도 M()을 부르므로 매번 새 객체를 만들면
// 클릭 한 번마다 쓰레기가 생긴다.
let _m = null, _mW = -1, _mH = -1;
function M() {
  if (_m && _mW === W && _mH === H) return _m;
  const U = Math.min(W, H);
  const pad = U * 0.11;
  _m = {
    U,
    cx: W / 2, cy: H / 2,
    buf: U * 0.26,          // 코어(버퍼) 반경
    gate: U * 0.26 * 1.18,  // 이 밖에서 손을 떼야 '채널로 보냈다'로 친다. 코어 경계에 바로 붙여 두면
                            // 손을 떼는 미세한 흔들림만으로 오분류가 난다
    sr: U * 0.042,          // 조각 반경
    reach: U * 0.34,        // 집게가 닿는 거리. 손가락이 조각을 가리므로 정확히 짚게 하면 안 된다
    port: U * 0.075,
    pad,
    line: Math.max(0.8, U / 560),
    ports: [[W / 2, pad], [W - pad, H / 2], [W / 2, H - pad], [pad, H / 2]],
    // ctx.font은 대입할 때마다 문자열을 파싱한다. 프레임마다 새로 이어 붙이면
    // 파싱 비용과 쓰레기가 같이 늘어난다 — 크기가 바뀔 때만 만든다
    fontBig: '700 ' + Math.round(U * 0.17) + 'px ui-sans-serif, system-ui, sans-serif',
    fontSmall: '700 ' + Math.round(U * 0.05) + 'px ui-sans-serif, system-ui, sans-serif'
  };
  _mW = W; _mH = H;
  return _m;
}

// 이 좌표가 어느 채널의 영역인가. 폭·높이로 정규화한 뒤 비교하므로
// 가로로 긴 화면이든 세로로 긴 폰이든 네 영역의 넓이가 언제나 같다.
function sectorAt(m, x, y) {
  const nx = (x - m.cx) / (W / 2), ny = (y - m.cy) / (H / 2);
  return Math.abs(nx) > Math.abs(ny) ? (nx > 0 ? 1 : 3) : (ny > 0 ? 2 : 0);
}

function spawn() {
  let s = null;
  for (let i = 0; i < MAX; i++) if (!shards[i].alive) { s = shards[i]; break; }
  if (!s) return;
  const m = M();
  const a = rnd() * Math.PI * 2;
  s.alive = true;
  s.ch = (rnd() * 4) | 0;
  s.x = m.cx + Math.cos(a) * m.buf * 0.45;
  s.y = m.cy + Math.sin(a) * m.buf * 0.45;
  // 안쪽에서 태어나 바깥으로 튀어나가 링에 합류한다 — '유입'이 눈에 보여야
  // 코어가 언제 차오르는지 읽을 수 있다
  const v = m.U * 0.30;
  s.vx = Math.cos(a) * v;
  s.vy = Math.sin(a) * v;
  s.spin = rnd() < 0.5 ? -1 : 1;
  s.rot = rnd() * Math.PI * 2;
  s.rv = s.spin * (0.5 + rnd() * 0.8);
  alive++;
  spawnCount++;
  FX.burst(s.x, s.y, CH[s.ch].c, 7);
}

function grab() {
  if (!armed || held >= 0 || state !== S.PLAYING) return;
  const m = M();
  let bi = -1, bd = m.reach * m.reach;
  for (let i = 0; i < MAX; i++) {
    const s = shards[i];
    if (!s.alive) continue;
    const dx = s.x - ptr.x, dy = s.y - ptr.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; bi = i; }
  }
  if (bi < 0) return;
  held = bi;
  FX.burst(shards[bi].x, shards[bi].y, CH[shards[bi].ch].c, 8);
  beep(480 + shards[bi].ch * 110, 26);
}

function release() {
  if (held < 0) return;
  const s = shards[held];
  held = -1;
  // 죽은 뒤에 손을 떼는 것은 분류가 아니다. reset()도 clearInput()을 거치므로
  // 이 방어가 없으면 새 판이 시작하기 직전에 지난 판의 조각이 점수를 낸다.
  if (state !== S.PLAYING) return;

  const m = M();
  s.x = ptr.x; s.y = ptr.y;
  const dx = ptr.x - m.cx, dy = ptr.y - m.cy;
  const d = Math.hypot(dx, dy);
  if (d < m.gate) { s.vx = 0; s.vy = 0; return; }   // 코어 안에 도로 놓았다

  const sec = sectorAt(m, ptr.x, ptr.y);
  const inv = 1 / (d || 1);
  if (sec === s.ch) {
    s.alive = false;
    alive--;
    chain++;
    score += 1 + Math.min(4, (chain / 3) | 0);
    timeLeft = Math.min(TIME_CAP, timeLeft + timeGainAt(elapsed));
    primed = true;
    portFlash[sec] = 1; portBad[sec] = false;
    FX.burst(ptr.x, ptr.y, CH[sec].c, 18);
    FX.burst(m.ports[sec][0], m.ports[sec][1], CH[sec].c, 14);
    FX.flash(CH[sec].c, 0.12, 0.13);
    beep(720 + Math.min(8, chain) * 40, 45);
  } else {
    chain = 0;
    timeLeft -= MISS_COST;
    // 거부된 조각은 코어 안쪽으로 튕겨 들어간다. 제자리에 두면 채널 영역에 조각이 남아
    // 다음 판정에서 어디에 속하는지가 애매해진다
    s.x = m.cx + dx * inv * m.buf * 0.6;
    s.y = m.cy + dy * inv * m.buf * 0.6;
    s.vx = -dx * inv * m.U * 0.45;
    s.vy = -dy * inv * m.U * 0.45;
    portFlash[sec] = 1; portBad[sec] = true;
    FX.burst(ptr.x, ptr.y, '#ff4d4d', 12);
    FX.shake(m.U * 0.016);
    FX.flash('#ff4d4d', 0.16, 0.20);
    beep(150, 90);
  }
}

function endRun(overflowed) {
  const m = M();
  FX.burst(m.cx, m.cy, overflowed ? '#ff9500' : '#ff2e88', 34);
  FX.shake(m.U * 0.038);
  FX.flash(overflowed ? '#ff9500' : '#ff2e88', 0.28, 0.55);
  gameOver();
}

function reset() {
  clearInput();
  armed = false;            // 시작을 누른 손가락이 그대로 조각을 집어 오분류를 내는 것을 막는다
  for (let i = 0; i < MAX; i++) shards[i].alive = false;
  alive = 0;
  held = -1;
  elapsed = 0;
  timeLeft = TIME_START;
  spawnIn = spawnGapAt(0);
  spawnCount = 0;
  chain = 0;
  primed = false;
  round++;
  // 판마다 시드를 어긋낸다. 모든 판이 같으면 플레이어는 두 판째에 색 순서를 외우고,
  // 심사용 스크린샷 10장도 같은 장면 몇 개로 접힌다. 난수가 아니라 판 번호로 어긋내므로
  // 같은 판은 언제나 같은 배치다.
  seed = (9176 + round * 40503) >>> 0;
  for (let i = 0; i < 4; i++) portFlash[i] = 0;
  // 판을 빈 코어로 시작하지 않는다. 첫 유입까지 1.15초라 그 사이에 찍힌 스크린샷은
  // 배경뿐인 '디버그 캔버스'가 된다. 플레이어에게도 첫 프레임부터 집을 것을 준다.
  for (let i = 0; i < 4; i++) spawn();
  const m = M();
  FX.burst(m.cx, m.cy, '#00e5ff', 20);
  FX.flash('#00e5ff', 0.16, 0.20);
}

function step(m, dt) {
  elapsed += dt;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endRun(false); return; }

  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawn();
    spawnIn = spawnGapAt(elapsed);
  }
  if (alive > capAt(elapsed)) { endRun(true); return; }

  // 조각은 코어 중심에서 바깥으로 밀리고 벽에 눌린다. 그래서 저절로 링 모양으로 모이는데,
  // 이게 이 게임의 조작감 전부다 — 가운데 뭉쳐 있으면 무엇을 집는지 알 수 없고,
  // 링에 늘어서 있으면 원하는 색이 어디 있는지 한눈에 보인다.
  const press = m.U * pressAt(elapsed);
  const damp = Math.exp(-3.0 * dt);
  const lim = m.buf - m.sr;
  for (let i = 0; i < MAX; i++) {
    const s = shards[i];
    if (!s.alive) continue;
    s.rot += s.rv * dt;
    if (i === held) { s.x = ptr.x; s.y = ptr.y; s.vx = 0; s.vy = 0; continue; }

    let dx = s.x - m.cx, dy = s.y - m.cy;
    let d = Math.hypot(dx, dy) || 0.0001;
    const ux = dx / d, uy = dy / d;
    // 바깥으로 미는 힘 + 접선 방향 소용돌이. 소용돌이가 없으면 링이 굳어서
    // 한 번 자리잡은 배치가 판이 끝날 때까지 그대로 있는다
    s.vx += (ux * press - uy * s.spin * press * 0.55) * dt;
    s.vy += (uy * press + ux * s.spin * press * 0.55) * dt;
    s.vx *= damp; s.vy *= damp;
    s.x += s.vx * dt; s.y += s.vy * dt;

    // 벽. 힘이 아니라 위치로 되돌린다 — 스프링으로 막으면 dt가 튀는 프레임에서
    // 조각이 코어 밖으로 폭발한다
    dx = s.x - m.cx; dy = s.y - m.cy;
    d = Math.hypot(dx, dy) || 0.0001;
    if (d > lim) {
      const nx = dx / d, ny = dy / d;
      s.x = m.cx + nx * lim;
      s.y = m.cy + ny * lim;
      const rv = s.vx * nx + s.vy * ny;
      if (rv > 0) { s.vx -= nx * rv * 1.5; s.vy -= ny * rv * 1.5; }
    }
  }

  // 겹침 해소. 힘이 아니라 위치 제약이므로 dt에 매달지 않는다 —
  // '겹치지 않는다'는 상태의 조건이지 움직임이 아니다.
  const minD = m.sr * 1.85;
  for (let i = 0; i < MAX; i++) {
    const a = shards[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < MAX; j++) {
      const b = shards[j];
      if (!b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const push = (minD - d) / 2;
      const nx = dx / d, ny = dy / d;
      if (j !== held) { b.x += nx * push; b.y += ny * push; }
      if (i !== held) { a.x -= nx * push; a.y -= ny * push; }
    }
  }
}

// 다각형 하나. 채널마다 꼭짓점 수와 기준 각도가 달라 색을 못 봐도 모양으로 구분된다.
function shapePath(x, y, r, rot, ch) {
  const n = CH[ch].n, off = CH[ch].off;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + off + i * (Math.PI * 2 / n);
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

// 배경은 클립 밖에서 그린다 — 밴드가 아니라 화면 전체를 덮는다.
// 가로 창에서 여백이 검게 비면 순수 레터박스가 되고, 그 그림이 포털 썸네일에 박힌다.
function backdrop() {
  ctx.fillStyle = '#070912';
  ctx.fillRect(-OX, 0, SW, H);
}

function draw(m, dt) {
  // 위상은 여기서 진행시킨다 — draw는 모든 상태에서 매 프레임 불리므로
  // 타이틀·일시정지·게임오버 화면에서도 스캔 바늘과 파문이 움직인다
  // (게이트 1의 motion은 어디서 찍어도 0이 아니어야 한다).
  sweep = (sweep + dt * 0.75) % (Math.PI * 2);
  ripple = (ripple + dt * 0.3) % 1;
  for (let i = 0; i < 4; i++) if (portFlash[i] > 0) portFlash[i] = Math.max(0, portFlash[i] - dt * 2.2);

  // 사분면 — 배경 자체가 정답표다. 어느 색을 어느 쪽으로 보내야 하는지 화면에 이미 적혀 있다
  for (let i = 0; i < 4; i++) {
    const a = CORNERS[i], b = CORNERS[(i + 1) % 4];
    ctx.beginPath();
    ctx.moveTo(m.cx, m.cy);
    ctx.lineTo(a[0] * W, a[1] * H);
    ctx.lineTo(b[0] * W, b[1] * H);
    ctx.closePath();
    ctx.fillStyle = portFlash[i] > 0.002
      ? 'rgba(' + (portBad[i] ? '255,77,77' : CH[i].rgb) + ',' + (0.05 + portFlash[i] * 0.22) + ')'
      : CH[i].wedge;
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(232,246,255,.08)';
  ctx.lineWidth = m.line;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, H);
  ctx.moveTo(W, 0); ctx.lineTo(0, H);
  ctx.stroke();

  // 코어에서 퍼져 나가는 파문. 정지 프레임에서도 '코어가 살아 있다'가 읽히고,
  // 심사용 스크린샷 두 장이 서로 달라진다.
  // 굵기와 알파를 넉넉히 준 이유가 있다: 게이트 1의 motion은 400~500ms 간격 두 장의
  // 화면 전체 평균 픽셀차라 면적이 넓은 요소만 값을 만든다. 조각 몇 개와 타이머 숫자만으로는
  // 임계값(2) 바로 위에서 아슬아슬하게 걸린다 — 실측 2.9. 링은 매 프레임 화면을 가로질러
  // 이동하므로 여기서 여유를 번다.
  ctx.strokeStyle = 'rgba(0,229,255,.55)';
  ctx.lineWidth = m.line * 2.2;
  for (let k = 0; k < 3; k++) {
    const t = (ripple + k / 3) % 1;
    ctx.globalAlpha = (1 - t) * (1 - t) * 0.62;   // 코어 가까이서 가장 진하고 가장자리에서 사라진다
    ctx.beginPath();
    ctx.arc(m.cx, m.cy, m.buf + t * m.U * 1.15, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 채널 포트 — 각 사분면 바깥에 놓인 수집구. 모양 글리프가 그 채널이 무엇을 받는지 말한다
  for (let i = 0; i < 4; i++) {
    const p = m.ports[i];
    const f = portFlash[i];
    const col = f > 0.002 && portBad[i] ? '#ff4d4d' : CH[i].c;
    ctx.save();
    ctx.globalAlpha = 0.42 + f * 0.58;
    ctx.strokeStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = m.port * (0.5 + f);
    ctx.lineWidth = m.line * 2.4;
    ctx.beginPath();
    ctx.arc(p[0], p[1], m.port * (1 + f * 0.25), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = col;
    // 포트 글리프는 절대 돌리지 않는다. 돌렸더니 위쪽 삼각형이 옆을 가리키고 사각형이
    // 마름모로 보여서, 채널이 무엇을 받는지 알려주는 유일한 기준이 프레임마다 달라졌다
    shapePath(p[0], p[1], m.port * 0.5, 0, i);
    ctx.fill();
    ctx.restore();
  }

  // ---- 코어 ----
  // 정원 눈금. 칸이 몇 개 남았는지가 링에 그대로 보인다 — 숫자보다 빨리 읽힌다
  const cap = Math.max(1, Math.round(capAt(elapsed)));
  const load = Math.min(1, alive / cap);
  for (let k = 0; k < cap; k++) {
    const a = -Math.PI / 2 + k * (Math.PI * 2 / cap);
    const r0 = m.buf * 1.03, r1 = m.buf * (k < alive ? 1.13 : 1.08);
    ctx.strokeStyle = k < alive
      ? (load > 0.82 ? '#ff4d4d' : '#8be9ff')
      : 'rgba(232,246,255,.16)';
    ctx.lineWidth = m.line * 2.6;
    ctx.beginPath();
    ctx.moveTo(m.cx + Math.cos(a) * r0, m.cy + Math.sin(a) * r0);
    ctx.lineTo(m.cx + Math.cos(a) * r1, m.cy + Math.sin(a) * r1);
    ctx.stroke();
  }

  // 코어 벽. 적재율이 높을수록 붉고 두껍다
  ctx.strokeStyle = load > 0.82 ? 'rgba(255,77,77,.55)' : 'rgba(0,229,255,.34)';
  ctx.lineWidth = m.line * (1.6 + load * 2.4);
  ctx.beginPath();
  ctx.arc(m.cx, m.cy, m.buf, 0, Math.PI * 2);
  ctx.stroke();

  // 남은 시간 — 코어를 도는 호. 숫자를 읽지 않아도 줄어드는 게 보인다
  const tf = Math.max(0, Math.min(1, timeLeft / TIME_CAP));
  ctx.strokeStyle = timeLeft < 2 ? '#ff4d4d' : timeLeft < 4 ? '#ffb020' : '#00e5ff';
  ctx.lineWidth = m.line * 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(m.cx, m.cy, m.buf * 0.9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * tf);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // 스캔 바늘. 코어가 도는 것처럼 보이게 하는 값싼 장치이자, 정지 화면 방지책이다
  ctx.strokeStyle = 'rgba(0,229,255,.22)';
  ctx.lineWidth = m.line * 1.6;
  ctx.beginPath();
  ctx.moveTo(m.cx, m.cy);
  ctx.lineTo(m.cx + Math.cos(sweep) * m.buf * 0.88, m.cy + Math.sin(sweep) * m.buf * 0.88);
  ctx.stroke();

  // 남은 시간 숫자. 조각 밑에 깔아 손이 가는 곳과 읽는 곳을 같게 둔다
  ctx.fillStyle = timeLeft < 2 ? 'rgba(255,77,77,.55)' : 'rgba(232,246,255,.30)';
  ctx.font = m.fontBig;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(timeLeft.toFixed(1), m.cx, m.cy);
  if (chain >= 3) {
    ctx.fillStyle = 'rgba(0,229,255,.55)';
    ctx.font = m.fontSmall;
    ctx.fillText('x' + (1 + Math.min(4, (chain / 3) | 0)), m.cx, m.cy + m.U * 0.115);
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';

  // 집게가 닿는 범위. 누르고 있는 동안만 보인다 — 항상 보이면 화면이 시끄럽고,
  // 안 보이면 왜 안 집히는지 설명할 방법이 없다
  if (ptr.down && state === S.PLAYING) {
    ctx.strokeStyle = held >= 0 ? 'rgba(232,246,255,.30)' : 'rgba(0,229,255,.22)';
    ctx.lineWidth = m.line * 1.4;
    ctx.beginPath();
    ctx.arc(ptr.x, ptr.y, m.reach, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---- 조각 ----
  for (let i = 0; i < MAX; i++) {
    const s = shards[i];
    if (!s.alive) continue;
    const isHeld = i === held;
    const r = m.sr * (isHeld ? 1.22 : 1);
    // 글로우는 shadowBlur로 낸다. 처음에는 같은 도형을 1.75배로 겹쳐 가산 합성했는데,
    // 가장자리가 살아 있는 다각형이라 글로우가 아니라 조각 뒤에 붙은 탁한 판때기로 보였다.
    // 조각은 많아야 15개뿐이라 그림자 패스를 그만큼 더 쳐도 60fps가 흔들리지 않는다.
    ctx.fillStyle = CH[s.ch].c;
    ctx.shadowColor = CH[s.ch].c;
    ctx.shadowBlur = m.sr * (isHeld ? 1.5 : 0.85);
    shapePath(s.x, s.y, r, s.rot, s.ch);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 밝은 심. 단색 도형에 형태가 생기고, 끌고 있는 조각은 더 밝다
    ctx.fillStyle = isHeld ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)';
    shapePath(s.x, s.y, r * 0.36, -s.rot, s.ch);
    ctx.fill();
  }

  // 끌고 있는 조각의 잔상. 조작에 대한 즉각적인 시각 피드백이자,
  // 어느 조각이 손에 붙어 있는지 헷갈리지 않게 하는 표시다. 풀에서 꺼내므로 할당이 없다
  if (held >= 0) {
    const s = shards[held];
    FX.trail(s.x, s.y, CH[s.ch].c, m.sr * 1.6, m.sr * 1.6, 0.2);
  }
}
/* ===== GAME LOGIC 끝 ===== */

/* ---------- 상태 전이 ---------- */
function start() {
  score = 0;
  el.score.textContent = '0';
  el.title.hidden = true;
  el.over.hidden = true;
  reset();
  state = S.PLAYING;
  Portal.gameplayStart();
}
function pause() { if (state === S.PLAYING) state = S.PAUSED; }
function resume() { if (state === S.PAUSED) state = S.PLAYING; }
function gameOver() {
  state = S.OVER;
  beep(160, 180);
  Portal.gameplayStop();
  if (score > best) { best = score; saveBest(best); el.best.textContent = best; }
  el.finalScore.textContent = score;
  el.over.hidden = false;
}

/* ---------- 루프 ---------- */
let last = 0;
function frame(now) {
  // dt 상한 0.05는 장식이 아니라 터널링 방어다. 조각의 최대 속도(유입 순간 U*0.30)와
  // 곱하면 프레임당 이동이 0.015U인데, 코어 벽 판정은 위치 클램프라 통과할 수 없다.
  // 상한을 크게 올리면 밀어내는 힘(press)이 한 프레임에 코어 반경을 넘겨 조각이
  // 벽 밖에서 되돌아오는 것처럼 보인다 — 상한과 press 상한은 함께 움직인다.
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  tick++;
  const m = M();               // 프레임당 한 번만 만든다 (step·draw가 같은 값을 본다)
  if (state === S.PLAYING) {
    step(m, dt);
    el.score.textContent = score;
  }
  // FX는 모든 상태에서 돈다 — 죽은 뒤에도 파편과 흔들림이 끝까지 재생돼야
  // 사망이 '멈춤'이 아니라 '사건'으로 보인다.
  FX.update(dt);
  FX.begin(ctx);
  backdrop();                  // 화면 전체 — 클립 밖
  ctx.save();                  // 여기부터 밴드 안에서만 그린다
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  draw(m, dt);
  FX.draw(ctx);
  ctx.restore();
  FX.end(ctx);                 // 플래시는 클립 밖 — 화면 전체를 덮는다
  requestAnimationFrame(frame);
}

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ---------- */
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  // 플레이 밴드. 게이트가 가로 뷰포트에서 이 비율을 재서 난이도가 창 모양에
  // 끌려가지 않는지 판정한다. 공식만 고치면 같은 결함이 다시 들어온다 — 축을 남긴다.
  get field() { return { x: OX, w: W, h: H, screenW: SW }; },
  start, pause, resume
};

resize();
// SDK가 거부하거나 던져도 루프는 시작한다. 여기서 멈추면 화면이 영원히 검은 채로 남는데,
// 포털 빌드에서 그게 가장 나쁜 실패다 — 광고 SDK 하나 때문에 게임이 아예 안 뜬다.
const startLoop = () => requestAnimationFrame(frame);
try {
  Portal.ready().then(startLoop, startLoop);
} catch {
  startLoop();
}
</script>
