<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #0b0c15;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
        }

        .btn {
            pointer-events: auto;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #0ff;
            margin-top: 20px;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
        }
    </style>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://just1game.com/games/neon-rise/">
</head>

<body>
    <canvas id="c"></canvas>
    <div class="score" id="scoreDisplay">0</div>
    <div id="ui">
        <div id="menu">
            <h1 style="font-size: 3em; margin: 0; color: #0ff;">NEON RISE</h1>
            <p>Tap Left/Right to Move</p>
            <button class="btn" onclick="startGame()">JUMP</button>
        </div>
        <div id="gameOver" class="hidden">
            <h1 style="color: #0ff;">FALLEN</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="startGame()">RETRY</button>
        </div>
    </div>
    <div id="assets-preload" style="display:none;"></div>
    <script src="../assets/game_juice.js"></script>
    <script>
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        let w, h;
        const resize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        let state = 'MENU';
        let score = 0;
        let highScore = localStorage.getItem('neonRiseHighScore') || 0;
        let cameraY = 0;

        // Assets
        const jumperImg = new Image(); jumperImg.src = '../assets/jumper.svg';

        // 발판은 이미지 대신 캔버스로 그린다. 떨어지는 중에 0.2초 안에 "저기 밟는다"로 읽혀야
        // 하는 물건이라, 어두운 몸통 위에 밝은 가로선 하나를 태우는 형태로 잡았다 —
        // 좁은 폰 화면에서 가장 빨리 읽히는 신호가 발광하는 수평선이다.
        const PLAT_H = 20;              // 스폰 코드의 h와 같은 값. 그라디언트 캐시의 기준이다
        const PLAT_RIM = '#00e5ff';
        const PLAT_CORE = '#eaffff';
        // 그라디언트를 발판마다 매 프레임 만들면 초당 수백 개의 객체가 된다. 캔버스 그라디언트는
        // 만들 때가 아니라 칠할 때의 변환을 따르므로, 0~PLAT_H 좌표로 딱 하나 만들어 두고
        // translate로 발판 위치에 옮겨 쓰면 발판이 몇 개든 객체는 이 하나뿐이다.
        const platGrad = ctx.createLinearGradient(0, 0, 0, PLAT_H);
        platGrad.addColorStop(0, 'rgba(0,229,255,0.50)');
        platGrad.addColorStop(0.35, 'rgba(0,110,190,0.26)');
        platGrad.addColorStop(1, 'rgba(8,16,46,0.04)');

        // Entities
        const player = { x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0 };
        let platforms = [];
        let particles = [];

        function startGame() {
            state = 'PLAYING';
            score = 0;
            platforms = [];

            // Initial Platforms
            for (let i = 0; i < 6; i++) {
                platforms.push({ x: Math.random() * (w - 100), y: h - 100 - i * 150, w: 100, h: 20, type: 'normal' });
            }
            // Ground platform for safety at start
            platforms.push({ x: 0, y: h - 10, w: w, h: 20, type: 'normal' });

            player.x = w / 2 - 20;
            player.y = h - 200;
            player.vx = 0;
            player.vy = 0;
            cameraY = 0;

            document.getElementById('menu').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            document.getElementById('scoreDisplay').innerText = 0;
            requestAnimationFrame(loop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1, color
                });
            }
        }

        // Input
        let inputX = 0;
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') inputX = -1;
            if (e.key === 'ArrowRight') inputX = 1;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') inputX = 0;
        });

        // Touch
        window.addEventListener('touchstart', e => {
            let tx = e.touches[0].clientX;
            if (tx < w / 2) inputX = -1; else inputX = 1;
        }, { passive: false });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            let tx = e.touches[0].clientX;
            if (tx < w / 2) inputX = -1; else inputX = 1;
        }, { passive: false });
        window.addEventListener('touchend', e => { inputX = 0; });

        function update() {
            if (state !== 'PLAYING') return;

            // Player Physics
            player.vx += inputX * 0.5;
            player.vx *= 0.9;
            player.vy += 0.5; // Gravity
            player.x += player.vx;
            player.y += player.vy;

            // Wrap
            if (player.x < -player.w) player.x = w;
            if (player.x > w) player.x = -player.w;

            // Camera Panning
            if (player.y < h / 2) {
                const diff = (h / 2) - player.y;
                player.y = h / 2;
                cameraY += diff;
                score += Math.floor(diff);
                document.getElementById('scoreDisplay').innerText = score;

                // Move platforms
                platforms.forEach(p => p.y += diff);
            }

            // Platform Collision (only when falling)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (
                        player.x + player.w > p.x &&
                        player.x < p.x + p.w &&
                        player.y + player.h > p.y &&
                        player.y + player.h < p.y + p.h + 15 // Tolerance
                    ) {
                        player.vy = -12; // JUMP
                        GameJuice.playSound('jump');
                        createExplosion(player.x + player.w / 2, player.y + player.h, '#0ff');
                    }
                });
            }

            // Cleanup & Spawn Platforms
        platforms.forEach((p, i) => {
            if (p.y > h) {
                platforms.splice(i, 1);
                // Spawn new one on top
                // Find highest platform
                let minY = h;
                platforms.forEach(plat => { if (plat.y < minY) minY = plat.y; });

                platforms.push({
                    x: Math.random() * (w - 150),
                    y: minY - 100 - Math.random() * 50,
                    w: 80 + Math.random() * 60,
                    h: 20,
                    type: 'normal'
                });
            }
        });

        // Death
        if (player.y > h) {
            GameJuice.playSound('lose');
            gameOver();
        }

        // Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        });
        }

        function gameOver() {
            state = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonRiseHighScore', highScore);
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOver').classList.remove('hidden');
        }

        // t는 performance.now(). 맥동과 흐르는 빛을 프레임 수가 아니라 시각으로 돌린다 —
        // 프레임 기준이면 120Hz 화면에서 두 배로 빨라진다.
        function drawPlatform(p, t) {
            const rim = Math.max(2, p.h * 0.22);
            const core = Math.max(1, p.h * 0.10);
            // 위상을 p.x로 어긋내서 탑 전체가 한 박자로 깜빡이지 않게 한다. 발판마다 밝기가
            // 다르면 겹쳐 보이는 두 발판도 서로 다른 물체로 분리돼 보인다.
            const pulse = 0.72 + 0.28 * Math.sin(t * 0.0035 + p.x * 0.02);

            ctx.save();
            ctx.translate(p.x, p.y);

            // 몸통. 위가 밝고 아래로 사라지는 판 — 빛이 발판 아래로 흘러내리는 것처럼 보인다
            ctx.fillStyle = platGrad;
            ctx.fillRect(0, 0, p.w, p.h);

            // 양 끝 기둥. 발판이 어디서 끊기는지 = 어디로 떨어지는지를 알려주는 유일한 표시다
            ctx.fillStyle = PLAT_RIM;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(0, 0, core * 2, p.h);
            ctx.fillRect(p.w - core * 2, 0, core * 2, p.h);

            // 윗면 = 착지면. shadowBlur로 번지게 해서 배경보다 먼저 눈에 들어오게 한다.
            // 색 문자열은 상수로 박아 두고 밝기는 globalAlpha(숫자)로만 흔든다 —
            // rgba() 문자열을 발판마다 조립하면 그리기 루프에서 문자열을 할당하게 된다.
            ctx.shadowColor = PLAT_RIM;
            ctx.shadowBlur = p.h * (0.9 + pulse);
            ctx.globalAlpha = 0.6 + 0.4 * pulse;
            ctx.fillRect(0, 0, p.w, rim);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // 흰 심. 글로우만 있으면 가장자리가 뭉개져서 발판의 실제 폭이 안 보인다
            ctx.fillStyle = PLAT_CORE;
            ctx.fillRect(0, 0, p.w, core);

            // 윗면을 훑고 지나가는 빛. 발판을 죽은 판때기가 아니라 전류가 흐르는 회로로 만든다.
            // 클립 대신 좌우를 잘라서 그린다 — 발판 하나마다 clip()을 치는 값이 아깝다
            const span = Math.min(p.w * 0.45, 52);
            const sx = ((t * 0.09 + p.x * 3) % (p.w + span * 2)) - span;
            const x0 = Math.max(0, sx), x1 = Math.min(p.w, sx + span);
            if (x1 > x0) {
                ctx.globalAlpha = 0.55;
                ctx.fillRect(x0, 0, x1 - x0, rim);
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#0b0c15';
            ctx.fillRect(0, 0, w, h);

            if (state === 'PLAYING') {
                // Platforms
                const t = performance.now();
                platforms.forEach(p => drawPlatform(p, t));

                // Player
                ctx.save();
                ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
                ctx.rotate(player.vx * 0.1);
                ctx.drawImage(jumperImg, -player.w / 2, -player.h / 2, player.w, player.h);
                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1.0;
        }

        function loop() {
            update();
            draw();
            if (state === 'PLAYING') requestAnimationFrame(loop);
        }

        resize();
        draw();
    </script>
</body>

</html>
