<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== PAGE TEXT — 새 게임에서 이 블록을 교체한다 ===== -->
<title>Ember Drift — Neon Arcade</title>
<!-- ===== PAGE TEXT 끝 ===== -->
<style>
  :root { --neon: #00e5ff; --bg: #05060a; --ink: #e8f6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud b { color: var(--neon); font-weight: 700; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #070912; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(5, 6, 10, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: .04em; color: var(--neon); }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.5; opacity: .85; font-size: 14px; }
  .btn { appearance: none; border: 1px solid var(--neon); background: transparent; color: var(--neon);
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
    min-width: 160px; min-height: 48px; }
  .btn:active { background: rgba(0, 229, 255, .16); }
</style>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://just1game.com/games/ember-drift/">
</head>
<body>
<div id="wrap">
  <!-- ===== HUD & OVERLAYS — 새 게임에서 이 블록을 교체한다 =====
       id는 스크립트가 참조한다. HUD에 목숨·레벨을 더하면 아래 el 조회도 같이 늘려야 한다.
       canvas#c 와 두 오버레이의 id(titleScreen·overScreen)는 그대로 두는 편이 안전하다.
       남은 빛은 HUD가 아니라 캔버스 안(잉걸 자체의 크기와 계기 호)에 그린다 —
       빛 반경이 곧 주울 수 있는 범위라, 숫자보다 그림이 먼저 읽혀야 한다. -->
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="titleScreen">
      <h1>EMBER DRIFT</h1>
      <p>Your ember is going out. Drift into the sparks and their light is yours. Drag to steer, or arrow keys / WASD to thrust. The run ends when the light does.</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
    <div class="overlay" id="overScreen" hidden>
      <h1>WENT DARK</h1>
      <p>Score <b id="finalScore">0</b></p>
      <button class="btn" id="againBtn" type="button">Drift again</button>
    </div>
  </div>
  <!-- ===== HUD & OVERLAYS 끝 ===== -->
</div>

<script>
/* ============================================================
   NEON ARCADE — GAME BASE
   새 게임은 이 파일을 복사해 play/<slug>.html 로 두고
   "GAME LOGIC" 구역만 교체한다. 그 위/아래(계약·입력·FX·루프·포털 훅)는 그대로 둔다.
   ============================================================ */

const SLUG = 'ember-drift';                // 새 게임에서 슬러그로 바꾼다
const BEST_KEY = 'just1game:' + SLUG + ':best';

/* ---------- 최고점 저장 ----------
   localStorage는 샌드박스 iframe이나 서드파티 저장소가 차단된 환경에서
   읽기만 해도 throw한다 — 이 파일이 SDK 훅을 들고 가는 포털 임베드가 정확히 그 환경이다.
   막히면 메모리에만 유지한다(그 세션 동안은 최고점이 동작하고, 다음 방문에 사라진다). */
function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}

/* ---------- 포털 SDK 훅 ----------
   사이트 배포에서는 비활성 no-op. 포털 납품 빌드에서만 PORTAL.enabled를 켠다.
   게임 로직은 아래 4개 함수만 부른다 — SDK가 무엇으로 바뀌어도 로직은 안 바뀐다. */
const PORTAL = { enabled: false, gameId: '' };
const Portal = {
  ready() { if (!PORTAL.enabled) return Promise.resolve(); return Promise.resolve(window.gdsdk); },
  gameplayStart() { if (PORTAL.enabled && window.gdsdk) window.gdsdk.preloadAd?.('rewarded'); },
  gameplayStop() { /* 납품 빌드에서 SDK의 gameplayStop을 연결한다 */ },
  adBreak(done) { done(); }   // 비활성 상태에서는 즉시 콜백. 게임이 광고를 기다리며 멈추지 않는다
};

/* ---------- 오디오: 사용자 제스처 이후에만 초기화 (모바일 정책) ---------- */
let actx = null;
function audioReady() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 제스처 안에서 만들어도 suspended로 시작할 수 있다 (특히 iOS·임베드).
  // 깨우지 않으면 모든 복제 게임이 조용히 무음이 된다. 거부는 무시한다 — 소리는 부가 기능이다.
  Promise.resolve(actx.resume?.()).catch(() => {});
}
function beep(freq, ms) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.value = 0.04;
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + ms / 1000);
}

/* ---------- 캔버스: 반응형 + DPR ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// 플레이 밴드 — 창이 가로로 넓어도 게임이 도는 판은 늘 세로 비율이다.
// 이게 없으면 치수를 H에서 파생하므로 넓은 창일수록 조작 목표가 화면 폭 대비 작아진다
// (900x600에서 3.2배 어려웠다). 806은 기준 폰 390x844에서 HUD 38px를 뺀 캔버스 높이다.
const BAND = 390 / 806;
let W = 0, H = 0;        // 플레이필드 — 게임 로직이 쓰는 좌표계. W는 밴드 폭이다
let SW = 0, OX = 0;      // 실제 화면 폭 / 밴드 좌측 여백. 배경만 이 둘을 본다
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  // 원점을 밴드 왼쪽으로 옮긴다. 게임 코드는 W가 화면 폭인 줄 알고 그대로 돌아간다.
  // 기준 화면에서는 round(806*BAND)=390=SW라 OX=0 — 픽셀 하나 안 변한다.
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   FX — 파티클·화면 흔들림·플래시. 프레임의 일부이므로 새 게임이 그대로 물려받는다.
   에셋도 라이브러리도 쓰지 않는다: 이 파이프라인의 게임은 캔버스로만 그린다
   (에셋 라이선스가 기존 게임의 상업적 사용을 막았고, 그 실수를 반복하지 않는다).

   GAME LOGIC이 부르는 것은 이 셋뿐이다:
     FX.burst(x, y, color[, count])  — (x,y)에서 파편이 터진다. 캔버스 픽셀 좌표
     FX.shake(px)                    — 화면을 px만큼 흔든다 (여러 번 부르면 큰 쪽이 이긴다)
     FX.flash(color[, sec, peak])    — 화면 전체를 잠깐 덮는다. peak은 가장 진할 때의 알파
     FX.trail(x, y, color, w, h[, sec]) — 잔상 하나. 매 프레임 불러 이동 흔적을 만든다
   루프가 부르는 것: FX.update(dt) / FX.begin(ctx) / FX.draw(ctx) / FX.end(ctx)

   begin/end로 감싸는 이유: 흔들림은 화면 전체를 옮기는 것이라
   옮긴 만큼 가장자리에 빈 띠가 생긴다. begin이 먼저 FX.bg로 캔버스를 덮고 옮긴다.
   그래서 FX.bg는 게임 배경색과 같아야 한다 — 새 게임에서 배경을 바꾸면 이 값도 바꾼다.
   ============================================================ */
const FX = (() => {
  // 파티클은 고정 풀에서만 꺼낸다. 폭발마다 객체를 새로 만들면 60초 플레이에서
  // 힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다. 다 차면 오래된 것부터 덮어쓴다.
  const MAX = 220;
  const pool = new Array(MAX);
  for (let i = 0; i < MAX; i++) pool[i] = { life: 0, ttl: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, w: 2, h: 2, color: '#fff' };
  let head = 0;

  let amp = 0, sx = 0, sy = 0;
  let flashT = 0, flashDur = 1, flashPeak = 0.55, flashColor = '#fff';

  // 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
  // 매번 달라져 실패를 다시 만들어낼 수 없다.
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  const take = () => { const p = pool[head]; head = (head + 1) % MAX; return p; };

  return {
    bg: '#070912',

    burst(x, y, color, count = 14) {
      // 속도·크기·중력을 화면 높이에서 파생한다. 픽셀 상수로 두면 4K에서 먼지가 된다
      // (M()이 스프라이트에 대해 하는 것과 같은 이유).
      const spd = H * 0.42, grav = H * 0.9, size = Math.max(1.5, H * 0.0055);
      for (let i = 0; i < count; i++) {
        const a = rnd() * Math.PI * 2;
        const v = spd * (0.35 + rnd() * 0.85);
        const p = take();
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - spd * 0.25;
        p.g = grav; p.w = p.h = size * (0.7 + rnd() * 0.9);
        p.ttl = p.life = 0.45 + rnd() * 0.5;
        p.color = color;
      }
    },

    trail(x, y, color, w, h, sec = 0.26) {
      const p = take();
      p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0;
      p.w = w; p.h = h; p.ttl = p.life = sec; p.color = color;
    },

    shake(px) { amp = Math.max(amp, px); },

    // peak은 가장 진할 때의 알파. 사망처럼 화면을 끊는 순간은 세게, 등장·획득처럼
    // 자주 일어나는 순간은 약하게 — 약한 값이 없으면 흔한 사건이 화면을 계속 세탁한다.
    flash(color, sec = 0.2, peak = 0.55) { flashColor = color; flashDur = sec; flashT = sec; flashPeak = peak; },

    update(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      // 흔들림은 지수 감쇠. 매 프레임 새 오프셋을 뽑아야 '떨림'으로 보인다.
      amp *= Math.exp(-dt * 9);
      if (amp < 0.35) amp = 0;
      sx = amp ? (rnd() * 2 - 1) * amp : 0;
      sy = amp ? (rnd() * 2 - 1) * amp : 0;
      if (flashT > 0) flashT -= dt;
    },

    begin(ctx) {
      // 흔들림이 만드는 빈 띠를 덮는 판은 밴드가 아니라 화면 전체를 덮어야 한다
      if (sx || sy) { ctx.fillStyle = this.bg; ctx.fillRect(-OX, 0, SW, H); }
      ctx.save();
      ctx.translate(sx, sy);
    },

    draw(ctx) {
      // 가산 합성. 어두운 배경에서 파편이 겹칠수록 밝아져 네온처럼 보인다.
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        ctx.globalAlpha = p.life / p.ttl;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    end(ctx) {
      ctx.restore();
      // 플래시는 흔들림 밖에서 그린다 — 화면 전체를 덮는 판이라 같이 흔들리면 띠가 생긴다.
      if (flashT > 0) {
        ctx.globalAlpha = Math.min(1, (flashT / flashDur) * flashPeak);
        ctx.fillStyle = flashColor;
        ctx.fillRect(-OX, 0, SW, H);   // 밴드만 번쩍이면 화면이 두 조각으로 읽힌다
        ctx.globalAlpha = 1;
      }
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
let state = S.TITLE;
let score = 0;
let tick = 0;
let best = loadBest();
let autoPaused = false;      // 탭이 숨겨져서 우리가 멈춘 것인지 구분한다

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  finalScore: document.getElementById('finalScore'),
  title: document.getElementById('titleScreen'),
  over: document.getElementById('overScreen')
};
el.best.textContent = best;

/* ---------- 입력: 키보드 + 터치 이중 ----------
   left/right는 '방향을 누르고 있다', aimX는 '이 지점을 짚었다'(0~1, 캔버스 폭 비율)이다.
   두 채널을 함께 두는 이유: 손가락은 화면 절반을 누르는 것보다 원하는 자리를 짚는 쪽이
   훨씬 정확한데, 키보드에는 그런 좌표가 없다. 게임 로직이 둘 다 읽고 하나로 합친다. */
const input = { left: false, right: false, aimX: null };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  // Space/Enter: 일시정지 중이면 재개한다. state !== PLAYING 하나로 묶으면
  // 멈춰 둔 판이 새 판으로 날아가고, 죽은 직후 프레임에 스스로 재시작해
  // 수집기가 'over'를 한 번도 못 보는 일이 생긴다.
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === S.PAUSED) resume();
    else if (state === S.TITLE || state === S.OVER) start();
  }
  if (e.code === 'KeyP') { state === S.PLAYING ? pause() : state === S.PAUSED ? resume() : 0; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// 짚은 지점을 캔버스 폭 비율로 바꾼다. 화면 절반 비교(왼쪽/오른쪽)로 두면
// 손가락이 '방향 버튼 두 개'가 되어 원하는 자리에 설 수 없다 — 드래그가 곧 조준이 되게 한다.
// 밴드 기준으로 잰다. ctx의 transform은 그리기만 옮기지 입력은 안 옮기므로
// OX를 여기서 직접 빼야 한다 — 안 빼면 가로 화면에서 손가락과 판이 어긋난다.
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  input.aimX = Math.min(1, Math.max(0, (clientX - rect.left - OX) / W));
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); audioReady();
  // 일시정지 상태에서의 탭은 재시작이 아니라 재개다 (Space와 같은 규칙).
  // 지금은 닿기 어려운 경로지만, 이 파일은 모든 새 게임에 복사된다 —
  // 화면 내 일시정지 버튼을 붙이는 게임이 그대로 버그를 물려받는다.
  if (state === S.PAUSED) { resume(); return; }
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault(); clearInput();
}, { passive: false });
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;      // 터치는 위에서 처리
  audioReady();
  if (state === S.PAUSED) { resume(); return; }   // 위 touchstart와 같은 규칙
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  // 마우스는 누르고 끌 때만 조준한다. 그냥 지나가는 커서까지 따라가면
  // 키보드로 놀던 사람의 플레이어가 제멋대로 끌려간다.
  if (e.pointerType !== 'touch' && e.buttons === 1 && state === S.PLAYING) aimAt(e.clientX);
});
// 캔버스 밖에서 손을 떼도 반드시 풀린다. 캔버스에만 걸면 오버레이 위에서 뗀 포인터가
// aimX를 붙잡은 채로 남아 다음 판이 한쪽으로 끌려간 채 시작한다.
window.addEventListener('pointerup', () => { clearInput(); });
window.addEventListener('pointercancel', () => { clearInput(); });

document.getElementById('startBtn').addEventListener('click', () => { audioReady(); start(); });
document.getElementById('againBtn').addEventListener('click', () => { audioReady(); start(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === S.PLAYING) { autoPaused = true; pause(); }
  } else if (autoPaused) {
    autoPaused = false;
    resume();
  }
});

/* ---- Axis: 좌우 한 축의 조작감 (프레임 레벨) ----
   가로 이동을 쓰는 게임이면 값만 바꿔 그대로 쓴다. 여기 있는 이유가 중요하다 —
   조작감 수식이 GAME LOGIC 안에 있으면 새 게임이 그 구역을 지우는 순간
   가속·마찰·조준 추종이 전부 같이 사라진다. 그러면 템플릿을 손본 의미가 없다.

   Axis.step(p, { dir, aimX }, dt) 는 p.x(0~1)와 p.vx를 갱신한다.
   dir: -1|0|1 (키보드), aimX: 0~1 또는 null (터치·포인터가 짚은 위치).
   가로 이동이 없는 게임(격자·탭 방식)은 이 블록을 안 부르면 그만이다. */
const Axis = {
  ACCEL: 7.0,        // 가속도 (화면 폭 배수/초²)
  MAX_SPD: 1.15,     // 최고 속도 (화면 폭/초)
  FRICTION: 9.0,     // 입력이 없을 때 속도가 죽는 비율/초
  TURN_BOOST: 2.4,   // 반대로 꺾을 때 가속 배수. 없으면 방향 전환이 마찰만큼 늦게 먹힌다
  AIM_ACCEL: 26.0,   // 짚은 지점을 향한 가속. 속도를 직접 넣지 않는 이유는 아래 참고
  AIM_SNAP: 0.004,   // 이 거리 안이면 붙인다 — 손가락 밑에서 미세하게 떠는 것을 막는다
  MIN_X: 0.06,
  MAX_X: 0.94,

  step(p, { dir = 0, aimX = null }, dt) {
    if (aimX !== null) {
      const d = aimX - p.x;
      if (Math.abs(d) < this.AIM_SNAP) {
        p.x = aimX;
        p.vx = 0;
      } else {
        // 속도를 바로 대입하면 손가락이 조금만 멀어져도 최고속에 붙어버려서
        // 터치에는 관성이 사라진다. 키보드와 같은 가속 경로를 태워야 두 조작이
        // 같은 게임처럼 느껴진다. 목표를 지나치지 않도록 마찰도 같이 건다.
        p.vx += Math.sign(d) * this.AIM_ACCEL * Math.min(1, Math.abs(d) * 6) * dt;
        p.vx -= p.vx * Math.min(1, this.FRICTION * 0.5 * dt);
        p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
      }
    } else if (dir !== 0) {
      // 이미 반대로 가고 있으면 더 세게 민다. 안 그러면 방향 전환에 마찰이 죽을 때까지
      // 기다려야 해서 가속을 넣은 순간 조작이 오히려 굼떠진다.
      const turning = dir * p.vx < 0;
      p.vx += dir * this.ACCEL * (turning ? this.TURN_BOOST : 1) * dt;
      p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
    } else {
      // dt에 비례한 감쇠. 1을 넘지 않게 막아야 프레임이 튈 때 속도가 반대로 뒤집히지 않는다.
      p.vx -= p.vx * Math.min(1, this.FRICTION * dt);
    }

    p.x += p.vx * dt;
    if (p.x < this.MIN_X) { p.x = this.MIN_X; p.vx = 0; }   // 벽에 붙으면 속도도 죽인다 —
    if (p.x > this.MAX_X) { p.x = this.MAX_X; p.vx = 0; }   // 안 그러면 벽에서 떼는 순간 튄다
  }
};

/* ---- Curve: 시간에 따라 오르는 값 (프레임 레벨) ----
   한 축만 올리면 그 축이 상한에 닿는 순간 화면이 더 이상 변하지 않아
   유능한 플레이어가 같은 패턴을 반복하게 된다. 축마다 다른 시점에 상한에 닿게 두면
   난이도가 계속 바뀐다. elapsed(경과 초)를 넣으면 현재 값이 나온다. */
const Curve = (start, limit, ramp) => (elapsed) =>
  limit > start ? Math.min(limit, start + ramp * elapsed)
                : Math.max(limit, start - ramp * elapsed);

/* ============================================================
   ===== GAME LOGIC — 새 게임에서 이 구역만 교체한다 =====
   지켜야 할 계약:
     reset()     : 새 판의 초기 상태를 만든다 (score는 호출자가 0으로 만든다)
     step(m, dt) : dt(초)만큼 진행. 죽으면 gameOver()를 부른다.
                   입력을 주지 않으면 반드시 몇 초 안에 죽어야 한다 (게이트 2 방치 종결)
     draw(m, dt) : 캔버스를 그린다. 모든 상태에서 매 프레임 불린다.
                   단색이고 정지한 화면이면 게이트 1이 막는다
     m 은 루프가 프레임당 한 번 만든 M() 결과다 — step과 draw가 같은 값을 본다
   쓸 수 있는 것: FX.burst / FX.shake / FX.flash / FX.trail (위 FX 블록 참고).
   파티클과 잔상은 루프가 알아서 갱신·렌더하므로 여기서는 부르기만 한다.

   EMBER DRIFT — 꺼져 가는 잉걸 하나를 몰고 열린 마당을 떠돈다. 빛은 매 초 줄고,
   불티에 닿으면 그만큼 돌아온다. 빛이 다 꺼지면 판이 끝난다.

   같은 마당·같은 자유 이동을 쓰는 기존 게임(space-shooter·neon-dodge)과 갈라지는 지점은
   하나다: 저쪽은 **피하는** 게임이고 이쪽은 **닿는** 게임이다. 그래서 마당에 위험물이
   하나도 없다. 대신 세 가지가 '닿기'를 어렵게 만든다 —
     · 관성. 잉걸은 멈추지 않는다. 목표를 지나쳐 돌아오는 시간이 곧 잃는 빛이다
     · 빛 반경. 주울 수 있는 거리가 곧 남은 빛이라, 못 주울수록 더 못 줍는다
     · 겁먹는 불티. 빛 바깥 껍질에서는 달아나고, 빛 안에 들어오는 순간 빨려든다.
       어정쩡하게 맴돌면 놓치고, 속도를 싣고 파고들어야 잡힌다
   ============================================================ */

/* ---- 난이도 곡선 ----
   네 축이 서로 다른 시점에 상한에 닿는다: 밀도 33초, 감쇠 41초, 겁 52초, 회복 65초.
   다섯째(바람)에는 사실상 상한이 없다 — 네 축이 전부 멈춘 뒤에도 판은 계속 변해야 한다.
   첫 게임은 네 축이 66초에 모두 상한에 닿아 그 뒤로 같은 리듬이 반복됐고, 심사에서 그 점이 깎였다. */
const decayAt = Curve(0.145, 0.235, 0.0022);    // 초당 꺼지는 빛 — 41초에 상한
const gainAt  = Curve(0.30, 0.20, 0.00155);     // 불티 하나가 되돌리는 빛 — 65초에 상한
const fleeAt  = Curve(0.55, 1.30, 0.0145);      // 불티가 달아나는 힘 (U 배수/초²) — 52초에 상한
const popAt   = Curve(11, 6, 0.152);            // 마당에 떠 있는 불티 수 — 33초에 상한
// 마당을 흐르는 바람. 상한 99는 도달할 수 없는 값이다(17시간) — 의도적으로 열어 둔 축이다.
// 60초에 0.19, 5분에 0.57. 다른 넷이 굳은 뒤에도 불티의 궤적이 계속 빨라진다.
const flowAt  = Curve(0.09, 99, 0.0016);

/* ---- 방치 종결은 시계가 아니라 빛이 맡는다 ----
   게이트 2는 입력이 없으면 몇 초 안에 끝날 것을 요구한다. 첫 게임 flux-sort는 그걸
   플레이어의 제한시간으로 만족시켰다가 제한시간이 7초가 됐고 **실제 플레이도 7~10초에 끝났다**
   — 심사 세션 항목 9/20, 스크린샷 10장이 전부 0점이었다.

   여기서는 종결이 곧 게임의 소재다. 손을 대지 않으면 빛은 6.5초에 꺼지지만,
   불티 하나가 초반 기준 약 2초를 되돌리고 마당에는 11개가 떠 있다.
   계속 닿는 플레이어는 몇 분을 간다. 게이트가 요구하는 것은 "끝이 있다"이지 "빨리 끝난다"가 아니다. */
const LIGHT_START = 1.0;
const LIGHT_CAP = 1.35;    // 쌓아 둘 수 있는 상한. 없으면 잘 풀린 판이 사실상 무적이 된다
const LIGHT_VIS = 1.15;    // 반경 계산에 쓰는 상한 — 빛이 화면을 통째로 먹지 않게 한다

/* ---- 잉걸의 조작감 ----
   전부 U(화면 짧은 변) 배수/초다. 픽셀 상수로 두면 큰 화면에서 굼떠지고 폰에서 날아간다.
   프레임의 Axis는 가로 한 축짜리라 여기서는 못 쓴다 — 대신 그 규칙을 그대로 옮겼다:
   가속으로만 움직이고(속도 대입 금지), 마찰이 있고, 목표에 가까우면 힘을 줄인다. */
const EM = {
  THRUST: 2.35,   // 목적지·키 방향으로 미는 힘 (U/초²)
  KICK: 0.44,     // 키를 누르는 '순간'의 한 방 (U/초). 아래 keydown 주석 참고
  MAX: 0.88,      // 최고 속도 (U/초)
  DRAG: 1.6,      // 지수 감쇠율(1/초). 낮게 둬서 손을 떼면 미끄러진다 — 이 게임의 관성 전부
  ARRIVE: 0.14    // 이 거리(U 배수) 안에서는 추력을 줄여 목적지에 얹는다
};
const PULL = 3.6;        // 빛 안의 불티를 끌어당기는 힘 (U/초²)
const SHELL = 2.6;       // 겁내는 껍질의 바깥 반경 (빛 반경 배수)
const RELAX = 1.8;       // 불티 속도가 바람으로 수렴하는 비율/초
const SPAWN_GAP = 0.30;  // 개체 수 보충 간격(초). 한 번에 채우지 않아야 마당이 빈 순간이 생긴다
const CHAIN_WINDOW = 2.2;
const TAU = Math.PI * 2;

/* ---- 불티 두 종류 ----
   색만 다르면 색약인 사람에게는 같은 물건이라 **모양과 크기가 함께 다르다**.
   불티는 원, 잉걸조각은 네 갈래 별이고 반경이 1.45배다. 회색조로 찍어도 구분된다. */
const KIND = [
  { c: '#ffc85a', big: false, val: 1, mul: 1,   rs: 1.00 },   // 불티 — 원
  { c: '#96f0ff', big: true,  val: 5, mul: 2.6, rs: 1.45 }    // 잉걸조각 — 네 갈래 별
];
const BIG_CHANCE = 0.16;

const MAXS = 22;         // 불티 풀. 정원(최대 11)보다 넉넉하게 — 풀이 비어 스폰이 조용히 실패하면
                         // 마당이 말라 붙어 사람이 손쓸 방법이 없어진다
const sparks = new Array(MAXS);
for (let i = 0; i < MAXS; i++) sparks[i] = { alive: false, x: 0, y: 0, vx: 0, vy: 0, k: 0, age: 0, life: 1, rot: 0, rv: 0 };

const em = { x: 0, y: 0, vx: 0, vy: 0 };
let light = LIGHT_START;
let alive = 0;
let elapsed = 0;
let spawnIn = SPAWN_GAP;
let chain = 0;
let chainT = 0;
let warned = false;      // 꺼지기 직전 경고음을 한 번만 낸다
let round = 0;           // 몇 번째 판인가. 판마다 시드를 어긋내 같은 배치가 반복되지 않게 한다
let flowPhase = 0;       // 바람의 위상. 프레임 수가 아니라 시간에 비례해야
                         // 120Hz 기기에서 두 배로 빨라지지 않는다

// 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
// 매번 달라져 실패를 다시 만들어낼 수 없다 (FX가 같은 이유로 자체 시드를 쓴다).
let seed = 7351;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

/* ---- 조타: 이 게임은 좌표 하나가 아니라 (x, y) 두 축이 필요하다 ----
   프레임의 input(left/right/aimX)은 가로 한 축짜리라 2차원 조종을 표현할 수 없다.
   프레임을 고치는 대신 이 구역에서 자기 리스너를 더 단다 — 프레임의 핸들러는 그대로 살아 있고
   (타이틀·게임오버에서 탭하면 시작하는 동작이 거기서 온다), 손을 뗀 순간은 프레임이 이미
   부르고 있는 clearInput() 하나로 받는다. */
const helm = { x: 0, y: 0, on: false };
// 이번에 누른 손가락이 얼마나 움직였는지. 손을 뗄 때 '탭'과 '끌기'를 가르는 데만 쓴다.
const ptr = { down: false, travel: 0, lastX: 0, lastY: 0 };
const key = { up: false, down: false };
const DRAG_PX = 14;   // 이만큼 넘게 움직였으면 끌기로 본다

function helmAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left - OX;   // 밴드 기준
  const y = clientY - rect.top;
  if (ptr.down) ptr.travel += Math.hypot(x - ptr.lastX, y - ptr.lastY);
  ptr.lastX = x; ptr.lastY = y;
  helm.x = x;
  helm.y = y;
  helm.on = true;
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;   // 터치는 아래에서 처리 (프레임과 같은 분기)
  if (state !== S.PLAYING) return;
  ptr.travel = 0;
  helmAt(e.clientX, e.clientY);   // ptr.down이 아직 false라 이 표본은 누적되지 않고 기준점만 잡는다
  ptr.down = true;
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || !ptr.down || state !== S.PLAYING) return;
  helmAt(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', (e) => {
  if (state !== S.PLAYING) return;
  ptr.travel = 0;
  helmAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  ptr.down = true;
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (!ptr.down || state !== S.PLAYING) return;
  helmAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: false });

// 방향키는 누르는 '순간'에도 한 번 민다. 누르고 있는 힘만 두면 짧게 두드리는 조작이
// 아무 일도 하지 않는데, 사람도 자동 검증기도 방향키를 두드린다 —
// 두드림이 조작이 되어야 키보드로도 마당을 가로지를 수 있다.
const KEY_DIR = {
  ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1,
  ArrowUp: -2, KeyW: -2, ArrowDown: 2, KeyS: 2
};
window.addEventListener('keydown', (e) => {
  const d = KEY_DIR[e.code];
  if (d === undefined) return;
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
  if (d === -2) key.up = true; else if (d === 2) key.down = true;
  if (state !== S.PLAYING || e.repeat) return;
  // 키가 오면 찍어 둔 목적지를 버린다. 안 그러면 두 조작이 서로를 당겨 잉걸이 제자리에 선다
  helm.on = false;
  const u = M().U;
  if (d === -1) em.vx -= EM.KICK * u;
  else if (d === 1) em.vx += EM.KICK * u;
  else if (d === -2) em.vy -= EM.KICK * u;
  else em.vy += EM.KICK * u;
  const sp = Math.hypot(em.vx, em.vy), lim = EM.MAX * u;
  if (sp > lim) { em.vx = em.vx / sp * lim; em.vy = em.vy / sp * lim; }
});
window.addEventListener('keyup', (e) => {
  const d = KEY_DIR[e.code];
  if (d === -2) key.up = false; else if (d === 2) key.down = false;
});

// 이 게임이 쓰는 입력 필드를 비운다. 구역 밖(start)에서 input을 직접 건드리면
// jump·fire 같은 필드를 쓰는 다음 게임이 "누른 채로 죽으면 다음 판이 움직인 채 시작"
// 버그를 조용히 물려받는다. 필드를 아는 쪽은 이 구역뿐이다.
// 프레임은 pointerup·pointercancel·touchend에서 이것을 부른다 — 즉 '손을 뗐다'가 여기로 들어온다.
function clearInput() {
  input.left = input.right = false;
  input.aimX = null;
  key.up = key.down = false;
  // 탭과 끌기를 다르게 끝낸다.
  // 탭(거의 안 움직임)은 "저기로 가라"는 지시다 — 목적지를 남긴다. 안 그러면 한 번 두드리는
  // 조작이 아무것도 아닌 게임이 된다.
  // 끌기는 "여기까지 조종했다"는 뜻이다 — 손을 떼면 조종을 놓아야 한다. 목적지를 남겨두면
  // 손을 뗀 뒤에도 잉걸이 마지막 지점으로 계속 끌려가, 관성이 아니라 통제 상실이 된다.
  if (ptr.down && ptr.travel > DRAG_PX) helm.on = false;
  ptr.down = false;
  ptr.travel = 0;
}

// 스프라이트·판정 크기를 한 곳에서 화면의 짧은 변에서 파생한다.
// 픽셀 상수로 두면 큰 화면에서 그림이 먼지처럼 작아진다. 높이가 아니라 min(W,H)를 쓰는 이유는
// 이 게임의 판이 사방으로 열린 마당이라서다 — 세로로 긴 폰에서 높이를 기준으로 잡으면
// 빛 반경이 화면 폭을 통째로 덮어 조준할 것이 없어진다.
// 결과를 캐시한다: 이벤트 핸들러(keydown)도 M()을 부르므로 매번 새 객체를 만들면
// 키 하나마다 쓰레기가 생긴다.
let _m = null, _mW = -1, _mH = -1;
function M() {
  if (_m && _mW === W && _mH === H) return _m;
  const U = Math.min(W, H);
  _m = {
    U,
    core: U * 0.030,               // 잉걸 알맹이 반경 (= 실제 접촉 판정)
    sr: U * 0.020,                 // 불티 기본 반경
    edge: U * 0.052,               // 잉걸이 벽에서 띄우는 여백
    line: Math.max(0.8, U / 560),
    // ctx.font은 대입할 때마다 문자열을 파싱한다. 크기가 바뀔 때만 만든다
    font: '700 ' + Math.round(U * 0.055) + 'px ui-sans-serif, system-ui, sans-serif'
  };
  _mW = W; _mH = H;
  return _m;
}

// 남은 빛이 곧 주울 수 있는 거리다. 이 한 줄이 이 게임의 난이도 곡선 전부를 만든다 —
// 못 주우면 반경이 줄고, 반경이 줄면 더 못 줍는다.
function lightR(m) { return m.U * (0.075 + 0.165 * Math.min(LIGHT_VIS, light)); }

/* ---- 바람 ----
   해석식으로 만든 흐름장. 격자에 벡터를 저장하면 해상도마다 다른 게임이 되고
   메모리도 잡는다. 두 개의 sin이면 마당 전체에 소용돌이가 깔린다.
   결과를 객체로 돌려주면 프레임마다 쓰레기가 생기므로 모듈 변수에 쓴다. */
const FLOW_K = 2.6;
let fvx = 0, fvy = 0;
function flowVec(x, y) {
  fvx = Math.sin((y / H) * FLOW_K * Math.PI + flowPhase);
  fvy = Math.sin((x / W) * FLOW_K * Math.PI - flowPhase * 0.83);
}

/* ---- 바람에 실린 재 ----
   장식이 아니라 계기판이다. 불티가 어디로 떠내려갈지 재가 먼저 보여준다.
   고정 풀에서만 쓴다 — 매 프레임 만들면 게이트 2의 힙 증가율에 걸린다. */
const DUST = 70;
const dust = new Array(DUST);
for (let i = 0; i < DUST; i++) dust[i] = { x: 0, y: 0, s: 2, a: 0.1 };
let dustW = -1, dustH = -1;
function seedDust() {
  let s = 4919;
  const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const u = Math.min(W, H);
  for (let i = 0; i < DUST; i++) {
    const d = dust[i];
    d.x = r() * W; d.y = r() * H;
    d.s = Math.max(1, u * (0.003 + r() * 0.006));
    d.a = 0.05 + r() * 0.16;
  }
  dustW = W; dustH = H;
}

function spawn(m) {
  let s = null;
  for (let i = 0; i < MAXS; i++) if (!sparks[i].alive) { s = sparks[i]; break; }
  if (!s) return;
  // 잉걸 바로 옆에서는 태어나지 않는다. 여기서 봐주면 방치한 판이 스스로 되살아나
  // 게이트 2의 방치 종결이 무너진다 — 이 게임에서 빛이 꺼지는 것은 유일한 실패 조건이다.
  const safe = lightR(m) * 1.45;
  const x0 = m.edge * 1.4, y0 = m.edge * 1.4;
  const spanX = Math.max(1, W - x0 * 2), spanY = Math.max(1, H - y0 * 2);
  let bx = x0, by = y0, bd = -1;
  for (let t = 0; t < 14; t++) {
    const x = x0 + rnd() * spanX, y = y0 + rnd() * spanY;
    const d = Math.hypot(x - em.x, y - em.y);
    if (d > bd) { bx = x; by = y; bd = d; }
    if (d > safe) break;
  }
  s.alive = true;
  s.k = rnd() < BIG_CHANCE ? 1 : 0;
  s.x = bx; s.y = by;
  s.vx = 0; s.vy = 0;
  s.age = 0;
  s.life = 6.2 + rnd() * 3.4;
  s.rot = rnd() * TAU;
  s.rv = (rnd() < 0.5 ? -1 : 1) * (0.5 + rnd() * 0.9);
  alive++;
  FX.burst(bx, by, KIND[s.k].c, 6);
}

function collect(m, s) {
  const K = KIND[s.k];
  s.alive = false;
  alive--;
  chain++;
  chainT = CHAIN_WINDOW;
  score += K.val * (1 + Math.min(4, (chain / 4) | 0));
  // 연쇄는 점수만 올린다. 빛까지 얹으면 잘 풀린 판이 스스로 굴러가 긴장이 사라진다
  light = Math.min(LIGHT_CAP, light + gainAt(elapsed) * K.mul);
  warned = false;
  FX.burst(s.x, s.y, K.c, K.big ? 24 : 12);
  FX.flash(K.c, 0.10, K.big ? 0.16 : 0.08);
  if (K.big) FX.shake(m.U * 0.012);
  beep(540 + Math.min(9, chain) * 45 + (K.big ? 260 : 0), 38);
}

function expire(s) {
  s.alive = false;
  alive--;
  FX.burst(s.x, s.y, '#6b5a4a', 5);   // 꺼진 불티도 흔적은 남긴다 — 놓쳤다는 사실이 보여야 한다
}

function endRun() {
  const m = M();
  FX.burst(em.x, em.y, '#ff8a1e', 34);
  FX.burst(em.x, em.y, '#ffe6b0', 16);
  FX.shake(m.U * 0.034);
  FX.flash('#ff6a00', 0.30, 0.5);
  gameOver();
}

function reset() {
  clearInput();
  helm.on = false;          // 지난 판의 목적지를 물려받으면 새 판이 시작하자마자 끌려간다
  em.x = W / 2; em.y = H / 2;
  em.vx = 0; em.vy = 0;
  light = LIGHT_START;
  elapsed = 0;
  chain = 0; chainT = 0;
  warned = false;
  alive = 0;
  for (let i = 0; i < MAXS; i++) sparks[i].alive = false;
  spawnIn = SPAWN_GAP;
  round++;
  // 판마다 시드를 어긋낸다. 모든 판이 같으면 플레이어는 두 판째에 배치를 외우고,
  // 심사용 스크린샷 10장도 같은 장면 몇 개로 접힌다. 난수가 아니라 판 번호로 어긋내므로
  // 같은 판은 언제나 같은 배치다.
  seed = (7351 + round * 26417) >>> 0;
  const m = M();
  // 판을 빈 마당으로 시작하지 않는다. 첫 보충까지 기다리면 그 사이에 찍힌 스크린샷이
  // 배경뿐인 '디버그 캔버스'가 된다 — 첫 게임의 심사 10장 중 3장이 그랬다.
  const n = Math.round(popAt(0));
  for (let i = 0; i < n; i++) spawn(m);
  FX.burst(em.x, em.y, '#ffb347', 22);
  FX.flash('#ffb347', 0.16, 0.20);
}

function step(m, dt) {
  elapsed += dt;
  if (chainT > 0) { chainT -= dt; if (chainT <= 0) chain = 0; }

  // 빛은 손을 대지 않아도 계속 준다. 이 한 줄이 방치 종결이고 동시에 제한시간이다
  light -= decayAt(elapsed) * dt;
  if (light <= 0) { light = 0; endRun(); return; }
  if (!warned && light < 0.26) { warned = true; beep(180, 130); }

  // ---- 잉걸 ----
  // 키를 누르고 있으면 그쪽이 이긴다. 목적지는 키가 들어온 순간 keydown이 이미 껐다.
  const kx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const ky = (key.down ? 1 : 0) - (key.up ? 1 : 0);
  let ax = 0, ay = 0;
  if (kx || ky) {
    const inv = 1 / Math.hypot(kx, ky);   // 대각선이 1.41배 빨라지지 않게 정규화한다
    ax = kx * inv * EM.THRUST;
    ay = ky * inv * EM.THRUST;
  } else if (helm.on) {
    const dx = helm.x - em.x, dy = helm.y - em.y;
    const d = Math.hypot(dx, dy);
    if (d > m.U * 0.005) {
      // 목적지에 가까울수록 힘을 줄인다. 안 줄이면 손가락 밑에서 좌우로 떨고,
      // 속도를 직접 대입하면(프레임의 Axis가 경고하는 그것) 관성이 통째로 사라진다.
      const ease = Math.min(1, d / (EM.ARRIVE * m.U));
      ax = dx / d * EM.THRUST * ease;
      ay = dy / d * EM.THRUST * ease;
    }
  }
  em.vx += ax * m.U * dt;
  em.vy += ay * m.U * dt;
  const damp = Math.exp(-EM.DRAG * dt);
  em.vx *= damp; em.vy *= damp;
  const sp = Math.hypot(em.vx, em.vy), lim = EM.MAX * m.U;
  if (sp > lim) { em.vx = em.vx / sp * lim; em.vy = em.vy / sp * lim; }
  em.x += em.vx * dt;
  em.y += em.vy * dt;
  // 벽에서는 튕기되 속도의 절반 넘게 잃는다. 완전 반사로 두면 벽을 왕복하는 것이
  // 가장 빠른 이동이 되어 마당을 도는 게임이 벽치기 게임이 된다.
  if (em.x < m.edge) { em.x = m.edge; if (em.vx < 0) em.vx *= -0.42; }
  else if (em.x > W - m.edge) { em.x = W - m.edge; if (em.vx > 0) em.vx *= -0.42; }
  if (em.y < m.edge) { em.y = m.edge; if (em.vy < 0) em.vy *= -0.42; }
  else if (em.y > H - m.edge) { em.y = H - m.edge; if (em.vy > 0) em.vy *= -0.42; }

  // ---- 불티 ----
  const lr = lightR(m);
  const shell = lr * SHELL;
  const flowSpd = flowAt(elapsed) * m.U;
  const flee = fleeAt(elapsed) * m.U;
  const relax = Math.min(1, RELAX * dt);   // 1을 넘지 않게 막아야 프레임이 튈 때 속도가 뒤집히지 않는다
  for (let i = 0; i < MAXS; i++) {
    const s = sparks[i];
    if (!s.alive) continue;
    s.age += dt;
    s.rot += s.rv * dt;
    if (s.age >= s.life) { expire(s); continue; }

    // 바람 속도로 수렴한다. 힘으로만 밀면 불티가 한 방향으로 계속 가속해 벽에 박힌다
    flowVec(s.x, s.y);
    s.vx += (fvx * flowSpd - s.vx) * relax;
    s.vy += (fvy * flowSpd - s.vy) * relax;

    const dx = s.x - em.x, dy = s.y - em.y;
    const d = Math.hypot(dx, dy) || 0.0001;
    const nx = dx / d, ny = dy / d;
    if (d < lr) {
      // 빛 안에 들어온 순간부터는 빨려든다. 이 게임의 손맛 전부가 여기 있다 —
      // 다가가는 감각이 아니라 '닿는 순간 붙잡히는' 감각이 목표를 쫓게 만든다
      s.vx -= nx * PULL * m.U * dt;
      s.vy -= ny * PULL * m.U * dt;
    } else if (d < shell) {
      // 빛 바깥 껍질에서는 달아난다. 가까울수록 세게 — 이 힘이 있어야
      // 방치한 판에서 불티가 스스로 잉걸에 굴러 들어오지 않는다 (방치 종결의 방어선이다)
      const f = 1 - (d - lr) / (shell - lr);
      s.vx += nx * flee * f * dt;
      s.vy += ny * flee * f * dt;
    }
    // 수명 끝자락에는 바깥으로 밀린다 — '내버려 두면 흩어진다'가 눈에 보여야 한다
    if (s.age > s.life * 0.66) {
      s.vx += nx * flee * 0.5 * dt;
      s.vy += ny * flee * 0.5 * dt;
    }

    s.x += s.vx * dt;
    s.y += s.vy * dt;

    const r = m.sr * KIND[s.k].rs;
    if (s.x < r) { s.x = r; s.vx = Math.abs(s.vx) * 0.6; }
    else if (s.x > W - r) { s.x = W - r; s.vx = -Math.abs(s.vx) * 0.6; }
    if (s.y < r) { s.y = r; s.vy = Math.abs(s.vy) * 0.6; }
    else if (s.y > H - r) { s.y = H - r; s.vy = -Math.abs(s.vy) * 0.6; }

    // 접촉 판정은 움직인 뒤 다시 잰다. 위의 d를 재사용하면 한 프레임 늦게 먹혀
    // 빠르게 지날 때 그림상 겹쳤는데 안 주워지는 일이 생긴다.
    // 알맹이보다 넉넉하게(1.3배) 잡는 이유는 터널링이다 — 아래 루프의 dt 상한 주석 참고.
    const ex = s.x - em.x, ey = s.y - em.y;
    const hit = m.core * 1.3 + r;
    if (ex * ex + ey * ey < hit * hit) collect(m, s);
  }

  // 개체 수 보충. 한 번에 채우지 않고 한 마리씩 — 마당을 쓸어 담은 직후에는
  // 잠깐 비어 있어야 '지금 벌어 둔 빛으로 다음을 찾아 나선다'는 리듬이 생긴다
  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawnIn = SPAWN_GAP;
    if (alive < Math.round(popAt(elapsed))) spawn(m);
  }
}

// 네 갈래 별. 잉걸조각은 색이 아니라 이 모양과 크기로 불티와 구분된다.
function starPath(x, y, r, rot) {
  const inner = r * 0.40;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = rot + i * (Math.PI / 4);
    const rr = (i & 1) ? inner : r;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

// 단위 반경(1) 글로우를 색마다 한 번만 만들어 두고, 그릴 때 translate·scale로 늘린다.
// 반경이 매 프레임 바뀌는 잉걸의 빛을 그라디언트로 그리려면 이 방법뿐이다 —
// 프레임마다 createRadialGradient를 부르면 60초에 3600개가 쌓여 힙 증가율을 먹는다.
const GRADS = {};
function unitGlow(rgb) {
  let g = GRADS[rgb];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, 'rgba(' + rgb + ',0.55)');
    g.addColorStop(0.42, 'rgba(' + rgb + ',0.20)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    GRADS[rgb] = g;
  }
  return g;
}

// 배경은 클립 밖에서 그린다 — 밴드가 아니라 화면 전체를 덮는다.
// 가로 창에서 여백이 검게 비면 순수 레터박스가 되고, 그 그림이 포털 썸네일에 박힌다.
function backdrop() {
  ctx.fillStyle = '#070912';
  ctx.fillRect(-OX, 0, SW, H);
}

function draw(m, dt) {
  // 위상은 여기서 진행시킨다 — draw는 모든 상태에서 매 프레임 불리므로
  // 타이틀·일시정지·게임오버 화면에서도 바람과 파문이 흐른다
  // (게이트 1의 motion은 어디서 찍어도 0이 아니어야 한다).
  flowPhase += dt * 0.24;
  pulse = (pulse + dt * 0.42) % 1;
  if (dustW !== W || dustH !== H) seedDust();
  // 첫 판이 시작되기 전에는 reset()이 아직 자리를 잡아 주지 않았다.
  // 그냥 두면 타이틀 화면의 잉걸이 좌상단 구석(0,0)에서 반쯤 잘린 채 빛난다.
  if (state === S.TITLE) { em.x = W / 2; em.y = H / 2; }

  const lr = lightR(m);
  const dim = Math.min(1, light / 0.30);          // 꺼지기 직전인가 (0에 가까울수록 위태롭다)
  const flick = light < 0.30 ? 0.55 + 0.45 * Math.sin(pulse * TAU * 6) : 1;

  // ---- 바람에 실린 재 ----
  // 색을 한 번만 정하고 알파만 바꾼다. 재마다 rgba 문자열을 만들면
  // 프레임당 70개, 60초에 25만 개의 짧은 문자열이 생긴다
  const dspd = flowAt(elapsed) * m.U * 0.55;
  ctx.fillStyle = '#ffbe78';
  for (let i = 0; i < DUST; i++) {
    const d = dust[i];
    flowVec(d.x, d.y);
    d.x += fvx * dspd * dt;
    d.y += fvy * dspd * dt;
    if (d.x < -12) d.x = W + 12; else if (d.x > W + 12) d.x = -12;
    if (d.y < -12) d.y = H + 12; else if (d.y > H + 12) d.y = -12;
    ctx.globalAlpha = d.a;
    ctx.fillRect(d.x, d.y, d.s, d.s);
  }
  ctx.globalAlpha = 1;

  // ---- 마당의 테두리 ----
  // 잉걸이 닿을 수 있는 한계선. 없으면 어디까지가 판인지 알 수 없어 벽에 부딪히는 게 사고가 된다
  ctx.strokeStyle = 'rgba(255,170,90,.13)';
  ctx.lineWidth = m.line * 1.4;
  ctx.strokeRect(m.edge, m.edge, Math.max(1, W - m.edge * 2), Math.max(1, H - m.edge * 2));

  // ---- 잉걸에서 퍼지는 파문 ----
  // 정지 프레임에서도 '빛이 살아 있다'가 읽힌다. 동시에 게이트 1의 motion(400ms 간격
  // 두 장의 픽셀차)에 여유를 만드는 장치다 — 조각 몇 개만으로는 임계값 바로 위에서
  // 아슬아슬하게 걸린다(첫 게임 실측 2.9). 화면을 가로지르는 링이 그 여유를 번다.
  ctx.strokeStyle = light < 0.30 ? 'rgba(255,90,40,.55)' : 'rgba(255,150,60,.5)';
  ctx.lineWidth = m.line * 2.2;
  for (let k = 0; k < 3; k++) {
    const t = (pulse + k / 3) % 1;
    ctx.globalAlpha = (1 - t) * (1 - t) * 0.55 * (0.4 + 0.6 * Math.min(1, light));
    ctx.beginPath();
    ctx.arc(em.x, em.y, lr * 0.85 + t * m.U * 1.25, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ---- 빛 ----
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(em.x, em.y);
  ctx.scale(lr, lr);
  ctx.globalAlpha = 0.55 + 0.45 * Math.min(1, light);
  ctx.fillStyle = unitGlow('255,170,60');
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fill();
  ctx.restore();

  // 빛의 가장자리 — 여기까지가 주울 수 있는 거리다. 끊어진 호로 돌려서
  // 정지 화면에서도 돌고 있는 것이 보이고, 실선보다 '경계'로 읽힌다.
  // 알파는 globalAlpha로 준다. 색 문자열에 섞으면 프레임마다 rgba를 새로 이어 붙이게 되고,
  // 60초 플레이에서 짧은 문자열 수천 개가 게이트 2의 힙 증가율에 잡음을 섞는다
  // (아래 배수 표시와 경고 테두리도 같은 이유로 globalAlpha를 쓴다).
  ctx.strokeStyle = light < 0.30 ? '#ff6e3c' : '#ffcd8c';
  ctx.globalAlpha = light < 0.30 ? 0.35 + 0.4 * flick : 0.42;
  ctx.lineWidth = m.line * (light < 0.30 ? 2.6 : 1.8);
  const seg = TAU / 18;
  for (let k = 0; k < 18; k++) {
    const a0 = pulse * TAU * 0.35 + k * seg;
    ctx.beginPath();
    ctx.arc(em.x, em.y, lr, a0, a0 + seg * 0.45);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ---- 불티 ----
  // 글로우는 겹친 원 두 장 + 가산 합성으로 낸다. shadowBlur를 개체마다 걸면
  // 최대 11개 × 프레임당 두 번이라 fps 예산을 가장 먼저 먹는 자리가 된다.
  for (let i = 0; i < MAXS; i++) {
    const s = sparks[i];
    if (!s.alive) continue;
    const K = KIND[s.k];
    const left = s.life - s.age;
    const fade = Math.min(1, left / 1.5);        // 사라지기 1.5초 전부터 작아지고 흐려진다
    const r = m.sr * K.rs * (0.6 + 0.4 * fade);

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = K.c;
    ctx.globalAlpha = 0.16 * fade;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.3, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.30 * fade;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.35, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.globalAlpha = 0.55 + 0.45 * fade;
    if (K.big) starPath(s.x, s.y, r, s.rot);
    else { ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';     // 밝은 심. 단색 도형에 형태가 생긴다
    if (K.big) starPath(s.x, s.y, r * 0.36, -s.rot);
    else { ctx.beginPath(); ctx.arc(s.x, s.y, r * 0.38, 0, TAU); }
    ctx.fill();

    // 남은 수명 고리. 색이 아니라 호의 길이로 급한 정도를 말한다 —
    // 색약인 사람에게도, 회색조 스크린샷에서도 같은 정보가 남는다
    ctx.globalAlpha = 0.30 + 0.5 * (1 - fade);
    ctx.strokeStyle = K.c;
    ctx.lineWidth = m.line * 1.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 2.0, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, left / s.life));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- 잉걸 알맹이 ----
  // 잔상은 속도에 비례해 길어진다. 조작에 대한 즉각적인 시각 피드백이자
  // 관성이 있는 물건이라는 것을 매 프레임 말해 준다. 풀에서 꺼내므로 할당이 없다
  const spd = Math.hypot(em.vx, em.vy) / (EM.MAX * m.U);
  FX.trail(em.x, em.y, '#b35a12', m.core * (1.1 + spd * 1.4), m.core * (1.1 + spd * 1.4), 0.24);

  ctx.globalAlpha = flick;
  ctx.fillStyle = light < 0.30 ? '#ff7a30' : '#ffd68a';
  ctx.beginPath(); ctx.arc(em.x, em.y, m.core, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6e0';
  ctx.beginPath(); ctx.arc(em.x, em.y, m.core * 0.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // 남은 빛의 계기 호. 반경(빛의 크기)과 별개의 두 번째 채널이다 —
  // 크기 하나로만 보여주면 화면 크기가 다른 기기에서 얼마나 남았는지 비교할 수 없다
  ctx.strokeStyle = light < 0.30 ? '#ff5a28' : light < 0.6 ? '#ffb020' : '#ffd68a';
  ctx.lineWidth = m.line * 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(em.x, em.y, m.core * 2.1, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, light / LIGHT_CAP));
  ctx.stroke();
  ctx.lineCap = 'butt';

  // 연쇄 배수. 잉걸 바로 밑에 둔다 — 손과 눈이 같은 곳에 있어야 HUD로 시선이 올라가지 않는다
  if (chain >= 4) {
    ctx.fillStyle = '#ffd68a';
    ctx.globalAlpha = 0.45 + 0.35 * (chainT / CHAIN_WINDOW);
    ctx.font = m.font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('x' + (1 + Math.min(4, (chain / 4) | 0)), em.x, em.y + m.U * 0.085);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  // 꺼지기 직전 경고. 색을 못 봐도 알아야 하므로 깜빡임(움직임)으로 낸다
  if (state === S.PLAYING && light < 0.30) {
    ctx.strokeStyle = '#ff3c14';
    ctx.globalAlpha = 0.10 + 0.18 * (1 - dim) * flick;
    ctx.lineWidth = m.U * 0.05;
    ctx.strokeRect(m.U * 0.025, m.U * 0.025, Math.max(1, W - m.U * 0.05), Math.max(1, H - m.U * 0.05));
    ctx.globalAlpha = 1;
  }
}
/* ===== GAME LOGIC 끝 ===== */

/* ---------- 상태 전이 ---------- */
function start() {
  score = 0;
  el.score.textContent = '0';
  el.title.hidden = true;
  el.over.hidden = true;
  reset();
  state = S.PLAYING;
  Portal.gameplayStart();
}
function pause() { if (state === S.PLAYING) state = S.PAUSED; }
function resume() { if (state === S.PAUSED) state = S.PLAYING; }
function gameOver() {
  state = S.OVER;
  beep(160, 180);
  Portal.gameplayStop();
  if (score > best) { best = score; saveBest(best); el.best.textContent = best; }
  el.finalScore.textContent = score;
  el.over.hidden = false;
}

/* ---------- 루프 ---------- */
let last = 0;
function frame(now) {
  // dt 상한 0.05는 장식이 아니라 터널링 방어다. 잉걸의 최고 속도 0.88U/초와 곱하면
  // 프레임당 이동이 0.044U인데, 접촉 판정 반경은 가장 작은 불티(수명 끝의 원)에서도
  // core*1.3 + sr*0.6 = 0.051U다 (여유 1.16배). 상한을 올리거나 EM.MAX를 올리면
  // 빠르게 지나는 불티를 통과해 버려 "닿았는데 안 주워진다"가 된다 —
  // 세 값(0.05 · 0.88 · 0.051U)은 함께 움직인다. 하나만 만지지 말 것.
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  tick++;
  const m = M();               // 프레임당 한 번만 만든다 (step·draw가 같은 값을 본다)
  if (state === S.PLAYING) {
    step(m, dt);
    el.score.textContent = score;
  }
  // FX는 모든 상태에서 돈다 — 죽은 뒤에도 파편과 흔들림이 끝까지 재생돼야
  // 사망이 '멈춤'이 아니라 '사건'으로 보인다.
  FX.update(dt);
  FX.begin(ctx);
  backdrop();                  // 화면 전체 — 클립 밖
  ctx.save();                  // 여기부터 밴드 안에서만 그린다
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  draw(m, dt);
  FX.draw(ctx);
  ctx.restore();
  FX.end(ctx);                 // 플래시는 클립 밖 — 화면 전체를 덮는다
  requestAnimationFrame(frame);
}

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ---------- */
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  // 플레이 밴드. 게이트가 가로 뷰포트에서 이 비율을 재서 난이도가 창 모양에
  // 끌려가지 않는지 판정한다. 공식만 고치면 같은 결함이 다시 들어온다 — 축을 남긴다.
  get field() { return { x: OX, w: W, h: H, screenW: SW }; },
  start, pause, resume
};

resize();
// SDK가 거부하거나 던져도 루프는 시작한다. 여기서 멈추면 화면이 영원히 검은 채로 남는데,
// 포털 빌드에서 그게 가장 나쁜 실패다 — 광고 SDK 하나 때문에 게임이 아예 안 뜬다.
const startLoop = () => requestAnimationFrame(frame);
try {
  Portal.ready().then(startLoop, startLoop);
} catch {
  startLoop();
}
</script>
</body>
