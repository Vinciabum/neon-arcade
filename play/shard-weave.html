<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== PAGE TEXT — 새 게임에서 이 블록을 교체한다 ===== -->
<title>Shard Weave — Neon Arcade</title>
<!-- ===== PAGE TEXT 끝 ===== -->
<style>
  :root { --neon: #00e5ff; --bg: #05060a; --ink: #e8f6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud b { color: var(--neon); font-weight: 700; }
  /* HUD 높이를 바꾸면 플레이 밴드(390/806)가 깨진다. font를 물려받고 padding·border를 0으로
     둬서 줄 상자가 옆의 span과 같게 만든다 — 아이콘 대신 글자를 쓰는 이유도 그거다. */
  #hud button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; letter-spacing: inherit; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #070912; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(5, 6, 10, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: .04em; color: var(--neon); }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.5; opacity: .85; font-size: 14px; }
  .btn { appearance: none; border: 1px solid var(--neon); background: transparent; color: var(--neon);
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
    min-width: 160px; min-height: 48px; }
  .btn:active { background: rgba(0, 229, 255, .16); }
</style>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://just1game.com/games/shard-weave/">
</head>
<body>
<div id="wrap">
  <!-- ===== HUD & OVERLAYS — 새 게임에서 이 블록을 교체한다 =====
       id는 스크립트가 참조한다. HUD에 목숨·레벨을 더하면 아래 el 조회도 같이 늘려야 한다.
       canvas#c 와 두 오버레이의 id(titleScreen·overScreen)는 그대로 두는 편이 안전하다.
       결속력·연쇄는 HUD가 아니라 캔버스 안(아래 게이지)에 그린다 — 조각을 고르는 동안
       눈이 화면 밖으로 올라가면 그 사이에 실 하나가 끊어진다. -->
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
    <button id="muteBtn" type="button" aria-label="Toggle sound">SOUND <b>ON</b></button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="titleScreen">
      <h1>SHARD WEAVE</h1>
      <p>Shards drift on the loom in pairs. Drag a thread from one shard to its twin — same shape, same colour — or tap one, then the other. Threads must never cross.</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
    <div class="overlay" id="overScreen" hidden>
      <h1>WEAVE COLLAPSED</h1>
      <p>Score <b id="finalScore">0</b></p>
      <button class="btn" id="againBtn" type="button">Weave again</button>
    </div>
  </div>
  <!-- ===== HUD & OVERLAYS 끝 ===== -->
</div>

<script>
/* ============================================================
   NEON ARCADE — GAME BASE
   새 게임은 이 파일을 복사해 play/<slug>.html 로 두고
   "GAME LOGIC" 구역만 교체한다. 그 위/아래(계약·입력·FX·루프·포털 훅)는 그대로 둔다.
   ============================================================ */

const SLUG = 'shard-weave';                // 새 게임에서 슬러그로 바꾼다
const BEST_KEY = 'just1game:' + SLUG + ':best';

/* ---------- 최고점 저장 ----------
   localStorage는 샌드박스 iframe이나 서드파티 저장소가 차단된 환경에서
   읽기만 해도 throw한다 — 이 파일이 SDK 훅을 들고 가는 포털 임베드가 정확히 그 환경이다.
   막히면 메모리에만 유지한다(그 세션 동안은 최고점이 동작하고, 다음 방문에 사라진다). */
function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}

/* ---------- 포털 SDK 훅 ----------
   사이트 배포에서는 비활성 no-op. 포털 납품 빌드에서만 PORTAL.enabled를 켠다.
   게임 로직은 아래 4개 함수만 부른다 — SDK가 무엇으로 바뀌어도 로직은 안 바뀐다. */
const PORTAL = { enabled: false, gameId: '' };
const Portal = {
  ready() { if (!PORTAL.enabled) return Promise.resolve(); return Promise.resolve(window.gdsdk); },
  gameplayStart() { if (PORTAL.enabled && window.gdsdk) window.gdsdk.preloadAd?.('rewarded'); },
  gameplayStop() { /* 납품 빌드에서 SDK의 gameplayStop을 연결한다 */ },
  adBreak(done) { done(); }   // 비활성 상태에서는 즉시 콜백. 게임이 광고를 기다리며 멈추지 않는다
};

/* ---------- 오디오: 사용자 제스처 이후에만 초기화 (모바일 정책) ---------- */
let actx = null;
function audioReady() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 제스처 안에서 만들어도 suspended로 시작할 수 있다 (특히 iOS·임베드).
  // 깨우지 않으면 모든 복제 게임이 조용히 무음이 된다. 거부는 무시한다 — 소리는 부가 기능이다.
  Promise.resolve(actx.resume?.()).catch(() => {});
}
function beep(freq, ms) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.value = 0.04;
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + ms / 1000);
}

/* ---------- BGM: 배경음도 코드로 쓴다 (프레임 레벨) ---------- */
// 오디오 파일을 들이지 않는 이유는 스프라이트 때와 같다 — 라이선스와 용량이다.
//
// 프레임 안에서 음을 만들지 않는다. 게이트 1이 fps 하한 50을 재므로 rAF에 붙이는 설계는
// 처음부터 못 쓴다. 박자를 오디오 스레드에 미리 예약하고 JS는 4Hz로만 깨어난다.
//
// state를 직접 읽는다 — start/gameOver/pause/resume 네 곳에 손을 대는 설계였으면
// 게임마다 한 곳을 빠뜨렸을 것이고, 그건 "게임오버 화면에서 음악만 계속 도는" 것으로 나타난다.
const BGM = (function () {
  // root=기음(Hz) · beat=한 박(초) · pattern=반음 오프셋(null은 쉼표)
  // 짝을 잇는 게임이라 장3화음으로 오르내린다. 여기만 밝은 음계다.
  const SONG = {
    root: 233.1, beat: 0.33, wave: 'triangle',
    pattern: [0, 4, 7, 11, 7, 4, null, 2, 5, 9, 12, 9, 5, null]
  };
  const MUTE_KEY = 'just1game:' + SLUG + ':muted';

  let bus = null, at = 0, step = 0, playing = false;
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { /* 차단된 저장소 */ }

  function tone(freq, when, dur, wave, vol) {
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, when);
    // 사각파를 그냥 켜고 끄면 딱딱 소리가 난다. 짧은 램프로 감싼다.
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(bus);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  }

  // 0.5초 앞까지만 채운다. 더 멀리 예약하면 정지가 그만큼 늦게 먹는다.
  // 광고로 컨텍스트가 suspend되면 currentTime이 멈추므로 여기서 저절로 멈춘다.
  function fill() {
    while (at < actx.currentTime + 0.5) {
      const i = step % SONG.pattern.length;
      const semi = SONG.pattern[i];
      if (semi !== null) {
        tone(SONG.root * Math.pow(2, semi / 12), at, SONG.beat * 0.85, SONG.wave, 0.018);
      }
      if (i % 4 === 0) tone(SONG.root / 2, at, SONG.beat * 3.2, 'triangle', 0.026);
      at += SONG.beat;
      step++;
    }
  }

  function begin() {
    if (!bus) { bus = actx.createGain(); bus.connect(actx.destination); }
    playing = true;
    at = actx.currentTime + 0.1;
    fill();
  }
  // 이미 예약된 음이 남아 있으므로 버스를 끊는다. 다음 begin()이 새로 만든다.
  function end() {
    playing = false;
    if (bus) { try { bus.disconnect(); } catch (e) {} bus = null; }
  }

  // 제스처를 기다리지 않는다 — actx가 없으면 아무것도 안 하고 넘어간다.
  setInterval(function () {
    if (!actx) return;
    const want = state === S.PLAYING && !muted;
    if (want && !playing) begin();
    else if (!want && playing) end();
    else if (playing) fill();
  }, 250);

  const btn = document.getElementById('muteBtn');
  const paint = () => { if (btn) btn.querySelector('b').textContent = muted ? 'OFF' : 'ON'; };
  if (btn) {
    btn.addEventListener('click', () => {
      audioReady();          // 소리를 켜는 클릭이 곧 제스처다 — 여기서 컨텍스트가 열린다
      muted = !muted;
      try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
      if (muted) end();
      paint();
    });
  }
  paint();

  return { isMuted: () => muted, isPlaying: () => playing };
})();

/* ---------- 캔버스: 반응형 + DPR ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// 플레이 밴드 — 창이 가로로 넓어도 게임이 도는 판은 늘 세로 비율이다.
// 이게 없으면 치수를 H에서 파생하므로 넓은 창일수록 조작 목표가 화면 폭 대비 작아진다
// (900x600에서 3.2배 어려웠다). 806은 기준 폰 390x844에서 HUD 38px를 뺀 캔버스 높이다.
const BAND = 390 / 806;
let W = 0, H = 0;        // 플레이필드 — 게임 로직이 쓰는 좌표계. W는 밴드 폭이다
let SW = 0, OX = 0;      // 실제 화면 폭 / 밴드 좌측 여백. 배경만 이 둘을 본다
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  // 원점을 밴드 왼쪽으로 옮긴다. 게임 코드는 W가 화면 폭인 줄 알고 그대로 돌아간다.
  // 기준 화면에서는 round(806*BAND)=390=SW라 OX=0 — 픽셀 하나 안 변한다.
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   FX — 파티클·화면 흔들림·플래시. 프레임의 일부이므로 새 게임이 그대로 물려받는다.
   에셋도 라이브러리도 쓰지 않는다: 이 파이프라인의 게임은 캔버스로만 그린다
   (에셋 라이선스가 기존 게임의 상업적 사용을 막았고, 그 실수를 반복하지 않는다).

   GAME LOGIC이 부르는 것은 이 셋뿐이다:
     FX.burst(x, y, color[, count])  — (x,y)에서 파편이 터진다. 캔버스 픽셀 좌표
     FX.shake(px)                    — 화면을 px만큼 흔든다 (여러 번 부르면 큰 쪽이 이긴다)
     FX.flash(color[, sec, peak])    — 화면 전체를 잠깐 덮는다. peak은 가장 진할 때의 알파
     FX.trail(x, y, color, w, h[, sec]) — 잔상 하나. 매 프레임 불러 이동 흔적을 만든다
   루프가 부르는 것: FX.update(dt) / FX.begin(ctx) / FX.draw(ctx) / FX.end(ctx)

   begin/end로 감싸는 이유: 흔들림은 화면 전체를 옮기는 것이라
   옮긴 만큼 가장자리에 빈 띠가 생긴다. begin이 먼저 FX.bg로 캔버스를 덮고 옮긴다.
   그래서 FX.bg는 게임 배경색과 같아야 한다 — 새 게임에서 배경을 바꾸면 이 값도 바꾼다.
   ============================================================ */
const FX = (() => {
  // 파티클은 고정 풀에서만 꺼낸다. 폭발마다 객체를 새로 만들면 60초 플레이에서
  // 힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다. 다 차면 오래된 것부터 덮어쓴다.
  const MAX = 220;
  const pool = new Array(MAX);
  for (let i = 0; i < MAX; i++) pool[i] = { life: 0, ttl: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, w: 2, h: 2, color: '#fff' };
  let head = 0;

  let amp = 0, sx = 0, sy = 0;
  let flashT = 0, flashDur = 1, flashPeak = 0.55, flashColor = '#fff';

  // 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
  // 매번 달라져 실패를 다시 만들어낼 수 없다.
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  const take = () => { const p = pool[head]; head = (head + 1) % MAX; return p; };

  return {
    bg: '#070912',

    burst(x, y, color, count = 14) {
      // 속도·크기·중력을 화면 높이에서 파생한다. 픽셀 상수로 두면 4K에서 먼지가 된다
      // (M()이 스프라이트에 대해 하는 것과 같은 이유).
      const spd = H * 0.42, grav = H * 0.9, size = Math.max(1.5, H * 0.0055);
      for (let i = 0; i < count; i++) {
        const a = rnd() * Math.PI * 2;
        const v = spd * (0.35 + rnd() * 0.85);
        const p = take();
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - spd * 0.25;
        p.g = grav; p.w = p.h = size * (0.7 + rnd() * 0.9);
        p.ttl = p.life = 0.45 + rnd() * 0.5;
        p.color = color;
      }
    },

    trail(x, y, color, w, h, sec = 0.26) {
      const p = take();
      p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0;
      p.w = w; p.h = h; p.ttl = p.life = sec; p.color = color;
    },

    shake(px) { amp = Math.max(amp, px); },

    // peak은 가장 진할 때의 알파. 사망처럼 화면을 끊는 순간은 세게, 등장·획득처럼
    // 자주 일어나는 순간은 약하게 — 약한 값이 없으면 흔한 사건이 화면을 계속 세탁한다.
    flash(color, sec = 0.2, peak = 0.55) { flashColor = color; flashDur = sec; flashT = sec; flashPeak = peak; },

    update(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      // 흔들림은 지수 감쇠. 매 프레임 새 오프셋을 뽑아야 '떨림'으로 보인다.
      amp *= Math.exp(-dt * 9);
      if (amp < 0.35) amp = 0;
      sx = amp ? (rnd() * 2 - 1) * amp : 0;
      sy = amp ? (rnd() * 2 - 1) * amp : 0;
      if (flashT > 0) flashT -= dt;
    },

    begin(ctx) {
      // 흔들림이 만드는 빈 띠를 덮는 판은 밴드가 아니라 화면 전체를 덮어야 한다
      if (sx || sy) { ctx.fillStyle = this.bg; ctx.fillRect(-OX, 0, SW, H); }
      ctx.save();
      ctx.translate(sx, sy);
    },

    draw(ctx) {
      // 가산 합성. 어두운 배경에서 파편이 겹칠수록 밝아져 네온처럼 보인다.
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        ctx.globalAlpha = p.life / p.ttl;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    end(ctx) {
      ctx.restore();
      // 플래시는 흔들림 밖에서 그린다 — 화면 전체를 덮는 판이라 같이 흔들리면 띠가 생긴다.
      if (flashT > 0) {
        ctx.globalAlpha = Math.min(1, (flashT / flashDur) * flashPeak);
        ctx.fillStyle = flashColor;
        ctx.fillRect(-OX, 0, SW, H);   // 밴드만 번쩍이면 화면이 두 조각으로 읽힌다
        ctx.globalAlpha = 1;
      }
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
let state = S.TITLE;
let score = 0;
let tick = 0;
let best = loadBest();
let autoPaused = false;      // 탭이 숨겨져서 우리가 멈춘 것인지 구분한다

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  finalScore: document.getElementById('finalScore'),
  title: document.getElementById('titleScreen'),
  over: document.getElementById('overScreen')
};
el.best.textContent = best;

/* ---------- 입력: 키보드 + 터치 이중 ----------
   left/right는 '방향을 누르고 있다', aimX는 '이 지점을 짚었다'(0~1, 캔버스 폭 비율)이다.
   두 채널을 함께 두는 이유: 손가락은 화면 절반을 누르는 것보다 원하는 자리를 짚는 쪽이
   훨씬 정확한데, 키보드에는 그런 좌표가 없다. 게임 로직이 둘 다 읽고 하나로 합친다. */
const input = { left: false, right: false, aimX: null };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  // Space/Enter: 일시정지 중이면 재개한다. state !== PLAYING 하나로 묶으면
  // 멈춰 둔 판이 새 판으로 날아가고, 죽은 직후 프레임에 스스로 재시작해
  // 수집기가 'over'를 한 번도 못 보는 일이 생긴다.
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === S.PAUSED) resume();
    else if (state === S.TITLE || state === S.OVER) start();
  }
  if (e.code === 'KeyP') { state === S.PLAYING ? pause() : state === S.PAUSED ? resume() : 0; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// 짚은 지점을 캔버스 폭 비율로 바꾼다. 화면 절반 비교(왼쪽/오른쪽)로 두면
// 손가락이 '방향 버튼 두 개'가 되어 원하는 자리에 설 수 없다 — 드래그가 곧 조준이 되게 한다.
// 밴드 기준으로 잰다. ctx의 transform은 그리기만 옮기지 입력은 안 옮기므로
// OX를 여기서 직접 빼야 한다 — 안 빼면 가로 화면에서 손가락과 판이 어긋난다.
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  input.aimX = Math.min(1, Math.max(0, (clientX - rect.left - OX) / W));
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); audioReady();
  // 일시정지 상태에서의 탭은 재시작이 아니라 재개다 (Space와 같은 규칙).
  // 지금은 닿기 어려운 경로지만, 이 파일은 모든 새 게임에 복사된다 —
  // 화면 내 일시정지 버튼을 붙이는 게임이 그대로 버그를 물려받는다.
  if (state === S.PAUSED) { resume(); return; }
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault(); clearInput();
}, { passive: false });
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;      // 터치는 위에서 처리
  audioReady();
  if (state === S.PAUSED) { resume(); return; }   // 위 touchstart와 같은 규칙
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  // 마우스는 누르고 끌 때만 조준한다. 그냥 지나가는 커서까지 따라가면
  // 키보드로 놀던 사람의 플레이어가 제멋대로 끌려간다.
  if (e.pointerType !== 'touch' && e.buttons === 1 && state === S.PLAYING) aimAt(e.clientX);
});
// 캔버스 밖에서 손을 떼도 반드시 풀린다. 캔버스에만 걸면 오버레이 위에서 뗀 포인터가
// aimX를 붙잡은 채로 남아 다음 판이 한쪽으로 끌려간 채 시작한다.
window.addEventListener('pointerup', () => { clearInput(); });
window.addEventListener('pointercancel', () => { clearInput(); });

document.getElementById('startBtn').addEventListener('click', () => { audioReady(); start(); });
document.getElementById('againBtn').addEventListener('click', () => { audioReady(); start(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === S.PLAYING) { autoPaused = true; pause(); }
  } else if (autoPaused) {
    autoPaused = false;
    resume();
  }
});

/* ---- Axis: 좌우 한 축의 조작감 (프레임 레벨) ----
   가로 이동을 쓰는 게임이면 값만 바꿔 그대로 쓴다. 여기 있는 이유가 중요하다 —
   조작감 수식이 GAME LOGIC 안에 있으면 새 게임이 그 구역을 지우는 순간
   가속·마찰·조준 추종이 전부 같이 사라진다. 그러면 템플릿을 손본 의미가 없다.

   Axis.step(p, { dir, aimX }, dt) 는 p.x(0~1)와 p.vx를 갱신한다.
   dir: -1|0|1 (키보드), aimX: 0~1 또는 null (터치·포인터가 짚은 위치).
   가로 이동이 없는 게임(격자·탭 방식)은 이 블록을 안 부르면 그만이다. */
const Axis = {
  ACCEL: 7.0,        // 가속도 (화면 폭 배수/초²)
  MAX_SPD: 1.15,     // 최고 속도 (화면 폭/초)
  FRICTION: 9.0,     // 입력이 없을 때 속도가 죽는 비율/초
  TURN_BOOST: 2.4,   // 반대로 꺾을 때 가속 배수. 없으면 방향 전환이 마찰만큼 늦게 먹힌다
  AIM_ACCEL: 26.0,   // 짚은 지점을 향한 가속. 속도를 직접 넣지 않는 이유는 아래 참고
  AIM_SNAP: 0.004,   // 이 거리 안이면 붙인다 — 손가락 밑에서 미세하게 떠는 것을 막는다
  MIN_X: 0.06,
  MAX_X: 0.94,

  step(p, { dir = 0, aimX = null }, dt) {
    if (aimX !== null) {
      const d = aimX - p.x;
      if (Math.abs(d) < this.AIM_SNAP) {
        p.x = aimX;
        p.vx = 0;
      } else {
        // 속도를 바로 대입하면 손가락이 조금만 멀어져도 최고속에 붙어버려서
        // 터치에는 관성이 사라진다. 키보드와 같은 가속 경로를 태워야 두 조작이
        // 같은 게임처럼 느껴진다. 목표를 지나치지 않도록 마찰도 같이 건다.
        p.vx += Math.sign(d) * this.AIM_ACCEL * Math.min(1, Math.abs(d) * 6) * dt;
        p.vx -= p.vx * Math.min(1, this.FRICTION * 0.5 * dt);
        p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
      }
    } else if (dir !== 0) {
      // 이미 반대로 가고 있으면 더 세게 민다. 안 그러면 방향 전환에 마찰이 죽을 때까지
      // 기다려야 해서 가속을 넣은 순간 조작이 오히려 굼떠진다.
      const turning = dir * p.vx < 0;
      p.vx += dir * this.ACCEL * (turning ? this.TURN_BOOST : 1) * dt;
      p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
    } else {
      // dt에 비례한 감쇠. 1을 넘지 않게 막아야 프레임이 튈 때 속도가 반대로 뒤집히지 않는다.
      p.vx -= p.vx * Math.min(1, this.FRICTION * dt);
    }

    p.x += p.vx * dt;
    if (p.x < this.MIN_X) { p.x = this.MIN_X; p.vx = 0; }   // 벽에 붙으면 속도도 죽인다 —
    if (p.x > this.MAX_X) { p.x = this.MAX_X; p.vx = 0; }   // 안 그러면 벽에서 떼는 순간 튄다
  }
};

/* ---- Curve: 시간에 따라 오르는 값 (프레임 레벨) ----
   한 축만 올리면 그 축이 상한에 닿는 순간 화면이 더 이상 변하지 않아
   유능한 플레이어가 같은 패턴을 반복하게 된다. 축마다 다른 시점에 상한에 닿게 두면
   난이도가 계속 바뀐다. elapsed(경과 초)를 넣으면 현재 값이 나온다. */
const Curve = (start, limit, ramp) => (elapsed) =>
  limit > start ? Math.min(limit, start + ramp * elapsed)
                : Math.max(limit, start - ramp * elapsed);

/* ============================================================
   ===== GAME LOGIC — 새 게임에서 이 구역만 교체한다 =====
   지켜야 할 계약:
     reset()     : 새 판의 초기 상태를 만든다 (score는 호출자가 0으로 만든다)
     step(m, dt) : dt(초)만큼 진행. 죽으면 gameOver()를 부른다.
                   입력을 주지 않으면 반드시 몇 초 안에 죽어야 한다 (게이트 2 방치 종결)
     draw(m, dt) : 캔버스를 그린다. 모든 상태에서 매 프레임 불린다.
                   단색이고 정지한 화면이면 게이트 1이 막는다
     m 은 루프가 프레임당 한 번 만든 M() 결과다 — step과 draw가 같은 값을 본다
   쓸 수 있는 것: FX.burst / FX.shake / FX.flash / FX.trail (위 FX 블록 참고).
   파티클과 잔상은 루프가 알아서 갱신·렌더하므로 여기서는 부르기만 한다.

   SHARD WEAVE — 베틀 위에 조각이 짝을 이뤄 떠 있다. 짝은 문양과 색이 같다.
   한 조각에서 짝까지 실을 끌면 그 짝이 짜여 사라지고 결속력이 돌아온다.
   문양이 다른 조각을 이으면 어긋나고, 이미 짜 둔 실을 가로지르면 엉킨다 —
   둘 다 결속력을 깎는다. 결속력이 0이 되면 판이 끝난다.

   왜 '가로지르면 안 된다'인가: 짝 맞추기만으로는 두 판째부터 눈만 빠른 사람이 이긴다.
   짜 둔 실이 잠시 장애물로 남으면 '무엇을 잇는가'에 '어떤 순서로 잇는가'가 붙어서,
   같은 배치가 매번 다른 문제가 된다. 그리고 그 장애물은 플레이어가 직접 놓은 것이다.
   ============================================================ */

/* ---- 난이도 곡선 ----
   여섯 축이 서로 다른 시점에 상한에 닿는다: 마모 36초, 유입 48초, 정원 52초, 잔류 70초, 장력 71초.
   마지막 하나(누설)는 실질적으로 상한이 없다 — 461초에야 닿으므로 어떤 판도 그 전에 끝난다.
   전부 1분 안에 굳으면 그 뒤로는 판이 같은 리듬을 반복한다. */
const frayAt     = Curve(6.6, 3.0, 0.10);      // 짝이 스스로 끊어지기까지(초) — 36초
const spawnGapAt = Curve(1.05, 0.52, 0.011);   // 새 짝 유입 간격(초) — 48초
const capAt      = Curve(4, 7.99, 0.0575);     // 동시 정원(내림해서 4→7) — 52초
// 짜 둔 실이 장애물로 남는 시간(초). 하한을 올린 이유: 2.4초는 이 게임의 이름값인
// '짜 놓은 실'이 플레이어 눈에도 스크린샷에도 남지 않는 길이였다.
const holdAt     = Curve(3.8, 5.4, 0.043);
const tensionAt  = Curve(1.9, 3.4, 0.021);     // 짝 하나가 초당 갉는 결속력 — 71초
const bleedAt    = Curve(1.4, 24.0, 0.049);    // 상시 누설(결속력/초) — 461초, 사실상 무제한.
                                               // 잘 짜는 사람의 판을 결국 끝내는 것은 이 축뿐이다

/* ---- 방치 종결은 시계가 아니라 마모가 맡는다 ----
   게이트 2는 입력이 없으면 약 8초 안에 끝날 것을 요구한다. 이 파이프라인의 첫 게임은
   그걸 플레이어의 제한시간으로 만족시켰다가 실제 플레이도 7~10초에 끝났다 — 세션 9/20.
   여기서는 손대지 않으면 저절로 나빠지는 상태를 쓴다: 짝은 저마다 마모 시계를 갖고 있고,
   다 닳으면 끊어지며 결속력을 크게 깎는다. 그 위에 짝 수에 비례하는 장력과 상시 누설이 얹힌다.
   판은 이미 닳고 있는 짝 넷으로 시작하고(남은 수명 3.96·4.85·5.74·6.63초),
   아무것도 안 하면 네 번째가 끊어지는 약 6.4초에 0이 된다. 예산 안이다.
   반대로 계속 짜는 사람은 짝이 사라지며 장력이 내려가고 결속력이 차오르므로
   판이 몇 분이고 이어진다 — 게이트가 요구한 것은 "끝이 있다"이지 "빨리 끝난다"가 아니다. */
const INTEG_MAX = 100;
const WEAVE_GAIN = 18;       // 한 짝을 짜면 돌아오는 결속력
const SNAP_COST = 12;        // 마모로 끊어졌다. 방치 종결 6.4초가 이 값에 걸려 있다
const MISMATCH_COST = 7;     // 문양이 다른 조각을 이었다
const CROSS_COST = 5;        // 짜 둔 실을 가로질렀다. 어긋남보다 싸다 —
                             // 이건 '무엇을'이 아니라 '어떤 순서로'를 틀린 것이라 되돌리기 쉽다
const START_PAIRS = 4;
const INPUT_GRACE = 0.12;    // 판을 시작시킨 그 누름·그 키가 곧바로 조각을 집지 않게 막는다
const DRAG_MOVE = 0.035;     // 이 거리(U 배수)를 넘게 끌면 탭이 아니라 드래그로 친다
// 실은 자기 짝을 더 멀리서 문다. 앵커의 짝만 거리를 이 배수로 쳐서 고른다 —
// 1.0이면 손가락이 가린 조각 대신 옆의 남남이 잡혀 하지도 않은 실수를 뒤집어쓴다.
// 0.55는 곧 '짝의 유효 사거리가 1.8배'라는 뜻이고, 그래도 명백히 다른 문양 쪽을 짚으면
// 그대로 어긋남이 된다 — 조준 보정이지 자동 정답이 아니다.
const PARTNER_BIAS = 0.55;

/* ---- 문양 ----
   색만 다르면 색을 못 보는 사람에게는 전부 같은 조각이다. 짝 맞추기 게임에서는 특히 치명적이라
   실루엣 자체를 다르게 뒀다 — 변의 개수가 다르거나, 별처럼 오목한 변이 있다.
   회전은 걸지 않는다: 도는 사각형은 마름모로 보여서 모양 단서가 통째로 사라진다. */
// rot: 꼭짓점을 어디에 두는가. 사각형만 45도 돌린다 — 안 돌리면 마름모로 서서
// 4각 별(SPARK)과 실루엣이 겹치고, 문구가 말하는 SQUARE와 화면이 어긋난다.
const KIND = [
  { c: '#00e5ff', n: 3, star: 0, rot: -Math.PI / 2, name: 'TRIANGLE' },
  { c: '#ff2e88', n: 4, star: 0, rot: Math.PI / 4, name: 'SQUARE' },
  { c: '#39ff8b', n: 5, star: 0, rot: -Math.PI / 2, name: 'PENTAGON' },
  { c: '#ffb020', n: 6, star: 0, rot: -Math.PI / 2, name: 'HEXAGON' },
  { c: '#b388ff', n: 5, star: 1, rot: -Math.PI / 2, name: 'STAR' },
  { c: '#ff6b3d', n: 4, star: 1, rot: -Math.PI / 2, name: 'SPARK' },
  { c: '#e8f6ff', n: 8, star: 0, rot: -Math.PI / 2, name: 'OCTAGON' }
];

/* ---- 풀 ----
   짝·실·잔상 전부 고정 풀이다. 프레임마다 객체를 만들면 60초 플레이에서 힙이 자라
   게이트 2의 누수 판정(2.5배)에 걸린다. 짝 안의 두 노드는 로드 때 한 번만 만든다 —
   nx/ny는 베틀 안 0~1 좌표, px/py는 그 프레임의 픽셀 좌표다(해상도가 바뀌어도 배치가 산다). */
const PMAX = 10;             // 정원 7 + 여유
const pairs = new Array(PMAX);
for (let i = 0; i < PMAX; i++) {
  pairs[i] = {
    live: false, kind: 0, fray: 0, frayMax: 1,
    a: { nx: 0, ny: 0, vx: 0, vy: 0, px: 0, py: 0 },
    b: { nx: 0, ny: 0, vx: 0, vy: 0, px: 0, py: 0 }
  };
}
const THMAX = 26;            // 짜 둔 실. 잔류 5.4초 × 유입 0.52초면 동시 생존은 많아야 열 남짓
const threads = new Array(THMAX);
for (let i = 0; i < THMAX; i++) threads[i] = { live: false, x1: 0, y1: 0, x2: 0, y2: 0, life: 0, ttl: 1, kind: 0, hit: 0 };
// 실패의 잔상 — 무엇을 어디에 이으려다 틀렸는지 화면에 남긴다.
// 이게 없으면 결속력만 줄고 이유가 사라져서 "왜 깎였지"가 된다.
const GMAX = 6;
const ghosts = new Array(GMAX);
for (let i = 0; i < GMAX; i++) ghosts[i] = { life: 0, ttl: 1, x1: 0, y1: 0, x2: 0, y2: 0, ix: 0, iy: 0, mark: 0, color: '#fff' };
let ghostHead = 0;

const msg = { text: '', sub: '', color: '#fff', life: 0 };
// 게이지 문구는 값이 바뀔 때만 다시 만든다. 프레임마다 이어 붙이면 60초 플레이에서
// 짧은 문자열이 수만 개 생겨 게이트 2의 힙 증가율에 잡음이 섞인다.
const cache = { iv: -1, iTxt: '', sv: -1, sTxt: '', cv: -1, cTxt: '' };
const found = { p: -1, s: 0 };       // pickNode의 결과 자리. 반환값으로 객체를 만들지 않는다
const hit = { i: -1, x: 0, y: 0 };   // crossCheck의 결과 자리

let integrity = INTEG_MAX;
let livePairs = 0;
let elapsed = 0;
let spawnIn = 0;
let chain = 0;
let round = 0;
let anchorP = -1, anchorS = 0;   // 실을 걸어 둔 조각
let warp = 0, weft = 0, shuttle = 0;  // 베틀 배경의 위상. draw가 모든 상태에서 진행시킨다
let kbSeen = false;              // 키보드를 한 번이라도 썼는가. 안 썼으면 커서를 안 그린다
const cur = { p: -1, s: 0 };     // 키보드 커서가 올라앉은 조각

// 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
// 매번 달라져 실패를 다시 만들어낼 수 없다 (FX가 같은 이유로 자체 시드를 쓴다).
let seed = 51413;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

const mult = () => 1 + Math.min(4, (chain / 3) | 0);
const node = (p, s) => (s ? pairs[p].b : pairs[p].a);

/* ---- 포인터: 이 게임은 좌표 하나가 아니라 (x, y) 두 축과 '쥐었다/놓았다'가 필요하다 ----
   프레임의 input(left/right/aimX)은 가로 한 축짜리라 드래그를 표현할 수 없다.
   프레임을 고치는 대신 이 구역에서 자기 리스너를 더 단다 — 프레임의 핸들러는 그대로 살아 있고
   (타이틀·게임오버에서 탭하면 시작하는 동작이 거기서 온다), 놓는 순간은 프레임이 이미
   부르고 있는 clearInput() 하나로 받는다. */
const ptr = { x: 0, y: 0, x0: 0, y0: 0, down: false, moved: false, has: false };

function ptrAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = clientX - rect.left - OX;   // 밴드 기준
  ptr.y = clientY - rect.top;
  ptr.has = true;
}

function onDown(clientX, clientY) {
  ptrAt(clientX, clientY);
  ptr.down = true; ptr.moved = false;
  ptr.x0 = ptr.x; ptr.y0 = ptr.y;
  // 판을 시작시킨 그 누름과 같은 이벤트에서 들어오면 elapsed는 아직 0이다 — 그것은 조작이 아니다
  if (state !== S.PLAYING || elapsed < INPUT_GRACE) return;
  audioReady();
  activateAt(ptr.x, ptr.y);
}

function onMove(clientX, clientY) {
  ptrAt(clientX, clientY);
  if (!ptr.down || ptr.moved) return;
  const lim = M().U * DRAG_MOVE;
  const dx = ptr.x - ptr.x0, dy = ptr.y - ptr.y0;
  if (dx * dx + dy * dy > lim * lim) ptr.moved = true;
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;   // 터치는 아래에서 처리 (프레임과 같은 분기)
  onDown(e.clientX, e.clientY);
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  onMove(e.clientX, e.clientY);            // 누르지 않아도 따라간다 — 미리보기 실이 커서를 물어야 한다
});
canvas.addEventListener('touchstart', (e) => {
  onDown(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  onMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: false });

// 이 게임이 쓰는 입력 필드를 비운다. 구역 밖(start)에서 input을 직접 건드리면
// jump·fire 같은 필드를 쓰는 다음 게임이 "누른 채로 죽으면 다음 판이 움직인 채 시작"
// 버그를 조용히 물려받는다. 필드를 아는 쪽은 이 구역뿐이다.
// 프레임은 pointerup·pointercancel·touchend에서 이것을 부른다 — 즉 '손을 뗐다'가 여기로 들어온다.
function clearInput() {
  input.left = input.right = false;
  input.aimX = null;
  const dragged = ptr.down && ptr.moved;
  ptr.down = false;
  ptr.moved = false;
  // 끌다가 놓았으면 놓은 자리에서 잇는다. 그냥 두드린 것(움직이지 않음)이면 앵커를 남긴다 —
  // 그 덕분에 '탭 → 탭'과 '드래그'가 같은 규칙 하나로 굴러간다.
  // 죽은 뒤에 손을 떼는 것은 조작이 아니다. reset()도 이 함수를 거치므로 이 방어가 없으면
  // 새 판이 시작하기 직전에 지난 판의 조각이 점수를 낸다.
  if (!dragged || state !== S.PLAYING || elapsed < INPUT_GRACE || anchorP < 0) return;
  const m = M();
  // 빈 곳에 놓았으면 실을 놓친 것이다. 값은 치르지 않는다.
  if (pickNode(ptr.x, ptr.y, anchorP, anchorS, anchorP, m.reach)) attempt(anchorP, anchorS, found.p, found.s);
  else anchorP = -1;
}

/* ---- 키보드: 조각 사이를 건너뛰는 커서 ----
   좌표가 없는 입력에 좌표 게임을 시키려면 '가장 가까운 조각'이라는 격자를 만들어 줘야 한다.
   방향키는 그 방향에 있는 다음 조각으로 커서를 옮기고, Space/Enter가 실을 건다.
   프레임의 keydown은 PLAYING 중에는 Space로 아무 일도 하지 않으므로 충돌하지 않는다. */
window.addEventListener('keydown', (e) => {
  if (e.repeat || state !== S.PLAYING || elapsed < INPUT_GRACE) return;
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') moveCur(-1, 0);
  else if (c === 'ArrowRight' || c === 'KeyD') moveCur(1, 0);
  else if (c === 'ArrowUp' || c === 'KeyW') moveCur(0, -1);
  else if (c === 'ArrowDown' || c === 'KeyS') moveCur(0, 1);
  else if (c === 'Space' || c === 'Enter') {
    kbSeen = true;
    audioReady();
    if (cur.p < 0 || !pairs[cur.p].live) moveCur(0, 0);   // 커서가 없으면 먼저 올려놓는다
    if (cur.p >= 0 && pairs[cur.p].live) activateNode(cur.p, cur.s);
  }
});

// 스프라이트·판정·게이지 위치를 한 곳에서 화면의 짧은 변에서 파생한다.
// 픽셀 상수로 두면 큰 화면에서 그림이 먼지처럼 작아진다(4K에서 게이트1 표준편차가 무너졌다).
// 결과를 캐시한다: 이벤트 핸들러(onDown·clearInput)도 M()을 부르므로 매번 새 객체를 만들면
// 클릭 한 번마다 쓰레기가 생긴다.
let _m = null, _mW = -1, _mH = -1;
function M() {
  if (_m && _mW === W && _mH === H) return _m;
  const U = Math.min(W, H);
  const r = U * 0.045;                       // 조각 반경 (390폭 폰에서 17.6px = 지름 35px, 손가락 크기)
  const padX = Math.max(U * 0.055, W * 0.045);
  const top = U * 0.05;
  const bot = U * 0.135;                     // 아래 게이지가 사는 띠
  _m = {
    U, r,
    x0: padX + r,
    y0: top + r,
    w: Math.max(1, W - (padX + r) * 2),
    h: Math.max(1, H - top - bot - r * 2),
    reach: U * 0.32,                         // 집게가 닿는 거리. 손가락이 조각을 가리므로 정확히 짚게 하면 안 된다
    line: Math.max(0.8, U / 560),
    warpGap: U * 0.082,
    weftGap: U * 0.115,
    gaugeY: H - bot * 0.60,
    gaugeH: U * 0.026,
    // ctx.font은 대입할 때마다 문자열을 파싱한다. 프레임마다 이어 붙이면 쓰레기가 같이 는다
    fontBig: '700 ' + Math.round(U * 0.055) + 'px ui-sans-serif, system-ui, sans-serif',
    fontMid: '700 ' + Math.round(U * 0.034) + 'px ui-sans-serif, system-ui, sans-serif',
    fontSmall: '700 ' + Math.round(U * 0.026) + 'px ui-sans-serif, system-ui, sans-serif'
  };
  _mW = W; _mH = H;
  return _m;
}

// 매 프레임 setLineDash에 배열 리터럴을 넘기면 프레임마다 배열이 하나씩 생긴다.
// 같은 배열을 재사용하고 길이만 고쳐 쓴다.
const DASH = [8, 6];
const NODASH = [];

function sync(m) {
  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    P.a.px = m.x0 + P.a.nx * m.w; P.a.py = m.y0 + P.a.ny * m.h;
    P.b.px = m.x0 + P.b.nx * m.w; P.b.py = m.y0 + P.b.ny * m.h;
  }
}

function say(text, sub, color) { msg.text = text; msg.sub = sub; msg.color = color; msg.life = 1.0; }

function addGhost(x1, y1, x2, y2, color, mark, ix, iy) {
  const g = ghosts[ghostHead];
  ghostHead = (ghostHead + 1) % GMAX;
  g.x1 = x1; g.y1 = y1; g.x2 = x2; g.y2 = y2;
  g.color = color; g.mark = mark; g.ix = ix; g.iy = iy;
  g.ttl = g.life = 0.7;
}

function addThread(x1, y1, x2, y2, kind) {
  let T = null;
  for (let i = 0; i < THMAX; i++) if (!threads[i].live) { T = threads[i]; break; }
  if (!T) return;   // 풀이 비면 조용히 거른다. 덮어쓰면 플레이어가 피해 다니던 실이 사라진다
  T.live = true;
  T.x1 = x1; T.y1 = y1; T.x2 = x2; T.y2 = y2;
  T.kind = kind; T.hit = 0;
  T.ttl = T.life = holdAt(elapsed);
}

/* ---- 두 선분이 실제로 가로지르는가 ----
   끝점을 4%씩 잘라내고 본다. 자르지 않으면 방금 만든 실과 끝을 맞대기만 해도 교차로 읽혀서
   플레이어가 '닿지도 않았는데' 값을 치른다 — 정밀 게임에서 가장 나쁜 종류의 거짓말이다.
   결과는 hit에 쓴다. 반환용 객체를 만들지 않는다. */
function crossCheck(ax, ay, bx, by) {
  const sx = ax + (bx - ax) * 0.04, sy = ay + (by - ay) * 0.04;
  const ex = ax + (bx - ax) * 0.96, ey = ay + (by - ay) * 0.96;
  const rx = ex - sx, ry = ey - sy;
  const m = M();
  hit.i = -1;
  for (let i = 0; i < THMAX; i++) {
    const T = threads[i];
    if (!T.live) continue;
    const cx = m.x0 + T.x1 * m.w, cy = m.y0 + T.y1 * m.h;
    const qx = (m.x0 + T.x2 * m.w) - cx, qy = (m.y0 + T.y2 * m.h) - cy;
    const den = rx * qy - ry * qx;
    if (den > -1e-9 && den < 1e-9) continue;      // 평행하거나 겹친다 — 가로지르지는 않는다
    const wx = cx - sx, wy = cy - sy;
    const t = (wx * qy - wy * qx) / den;
    const u = (wx * ry - wy * rx) / den;
    if (t <= 0 || t >= 1 || u <= 0 || u >= 1) continue;
    hit.i = i; hit.x = sx + rx * t; hit.y = sy + ry * t;
    return i;
  }
  return -1;
}

/* ---- 조각 고르기 ----
   reach 안에서 가장 가까운 조각을 고른다. exP/exS는 제외할 조각(앵커 자신),
   biasP는 거리를 깎아 줄 조각(앵커의 짝)이다. 결과는 found에 쓴다. */
function pickNode(px, py, exP, exS, biasP, reach) {
  let bd = reach * reach, bp = -1, bs = 0;
  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    for (let s = 0; s < 2; s++) {
      if (i === exP && s === exS) continue;
      const n = s ? P.b : P.a;
      const dx = n.px - px, dy = n.py - py;
      let d2 = dx * dx + dy * dy;
      if (i === biasP) d2 *= PARTNER_BIAS * PARTNER_BIAS;
      if (d2 < bd) { bd = d2; bp = i; bs = s; }
    }
  }
  found.p = bp; found.s = bs;
  return bp >= 0;
}

function activateAt(px, py) {
  const m = M();
  if (anchorP >= 0 && !pairs[anchorP].live) anchorP = -1;   // 걸어 둔 조각이 그 사이 끊어졌다
  if (anchorP < 0) {
    if (!pickNode(px, py, -1, 0, -1, m.reach)) { say('NO SHARD', 'nothing within reach', '#8be9ff'); return; }
    activateNode(found.p, found.s);
    return;
  }
  // 걸어 둔 조각을 다시 짚으면 실을 내려놓는다. 값은 치르지 않는다 —
  // 잘못 집었다는 것을 깨달았을 때 빠져나갈 길이 없으면 조작이 함정이 된다.
  const an = node(anchorP, anchorS);
  const dx = px - an.px, dy = py - an.py;
  if (dx * dx + dy * dy < m.r * m.r * 2.6) { anchorP = -1; beep(250, 24); return; }
  if (!pickNode(px, py, anchorP, anchorS, anchorP, m.reach)) { anchorP = -1; return; }
  attempt(anchorP, anchorS, found.p, found.s);
}

function activateNode(p, s) {
  if (!pairs[p].live) return;
  if (anchorP < 0) {
    anchorP = p; anchorS = s;
    const n = node(p, s);
    FX.burst(n.px, n.py, KIND[pairs[p].kind].c, 9);
    beep(420 + pairs[p].kind * 45, 26);
    return;
  }
  if (anchorP === p && anchorS === s) { anchorP = -1; beep(250, 24); return; }
  attempt(anchorP, anchorS, p, s);
}

function nudge(m, n, ux, uy, k) {
  n.nx = Math.min(0.96, Math.max(0.04, n.nx + ux * k / m.w));
  n.ny = Math.min(0.96, Math.max(0.04, n.ny + uy * k / m.h));
}

/* 앵커는 attempt가 직접 관리한다. 짜였거나 걸렸으면 실을 놓고, 어긋났으면 방금 짚은 조각으로
   실이 옮겨 간다 — 그래서 조작 규칙이 "연달아 짚은 두 조각을 잇는다" 한 줄로 끝난다.
   틀릴 때마다 처음부터 다시 짚게 만들면, 잘못 짚었다는 벌을 두 번 받는 셈이 된다. */
function attempt(p1, s1, p2, s2) {
  const m = M();
  const A = pairs[p1], B = pairs[p2];
  const na = s1 ? A.b : A.a, nb = s2 ? B.b : B.a;

  // 1) 문양이 다르다. 실이 튕겨 나가고 두 조각이 서로 밀린다 — 값을 치렀다는 것이 몸으로 보인다
  if (p1 !== p2) {
    anchorP = p2; anchorS = s2;
    chain = 0;
    integrity -= MISMATCH_COST;
    addGhost(na.nx, na.ny, nb.nx, nb.ny, '#ff2e88', 0, 0, 0);
    say('MISMATCH', KIND[A.kind].name + ' ≠ ' + KIND[B.kind].name, '#ff2e88');
    const dx = nb.px - na.px, dy = nb.py - na.py;
    const d = Math.hypot(dx, dy) || 1;
    nudge(m, na, -dx / d, -dy / d, m.U * 0.05);
    nudge(m, nb, dx / d, dy / d, m.U * 0.05);
    FX.burst((na.px + nb.px) / 2, (na.py + nb.py) / 2, '#ff2e88', 14);
    FX.shake(m.U * 0.014);
    FX.flash('#ff2e88', 0.16, 0.18);
    beep(160, 90);
    return;
  }

  // 2) 짝은 맞는데 길이 막혔다. 조각은 그대로 남으므로 돌아서 다시 이으면 된다
  if (crossCheck(na.px, na.py, nb.px, nb.py) >= 0) {
    anchorP = -1;
    chain = 0;
    integrity -= CROSS_COST;
    threads[hit.i].hit = 0.55;
    addGhost(na.nx, na.ny, nb.nx, nb.ny, '#ffb020', 1, (hit.x - m.x0) / m.w, (hit.y - m.y0) / m.h);
    say('SNARL', 'threads cannot cross — go around', '#ffb020');
    FX.burst(hit.x, hit.y, '#ffb020', 14);
    FX.shake(m.U * 0.010);
    FX.flash('#ffb020', 0.14, 0.14);
    beep(240, 80);
    return;
  }

  // 3) 짜였다
  const K = KIND[A.kind];
  anchorP = -1;
  chain++;
  score += 5 * mult();
  integrity = Math.min(INTEG_MAX, integrity + WEAVE_GAIN);
  addThread(na.nx, na.ny, nb.nx, nb.ny, A.kind);
  A.live = false;
  livePairs--;
  if (cur.p === p1) cur.p = -1;
  // 실을 따라 불꽃이 지나간다 — 무엇과 무엇이 이어졌는지가 한 프레임에도 읽힌다
  for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    FX.trail(na.px + (nb.px - na.px) * t, na.py + (nb.py - na.py) * t, K.c, m.r * 0.5, m.r * 0.5, 0.30);
  }
  FX.burst(na.px, na.py, K.c, 16);
  FX.burst(nb.px, nb.py, K.c, 16);
  FX.flash(K.c, 0.12, 0.13);
  say('WOVEN', chain >= 3 ? ('CHAIN ×' + mult()) : K.name, K.c);
  beep(600 + Math.min(8, chain) * 40, 45);
}

function snapPair(m, i) {
  const P = pairs[i];
  P.live = false;
  livePairs--;
  integrity -= SNAP_COST;
  chain = 0;
  if (anchorP === i) anchorP = -1;
  if (cur.p === i) cur.p = -1;
  addGhost(P.a.nx, P.a.ny, P.b.nx, P.b.ny, '#ff5a3d', 0, 0, 0);
  FX.burst(P.a.px, P.a.py, '#ff5a3d', 14);
  FX.burst(P.b.px, P.b.py, '#ff5a3d', 14);
  FX.shake(m.U * 0.016);
  FX.flash('#ff5a3d', 0.16, 0.18);
  say('FRAYED', 'weave the thin rings first', '#ff5a3d');
  beep(130, 120);
}

function kindTaken(k) {
  for (let i = 0; i < PMAX; i++) if (pairs[i].live && pairs[i].kind === k) return true;
  return false;
}

function spawnPair() {
  let P = null;
  for (let i = 0; i < PMAX; i++) if (!pairs[i].live) { P = pairs[i]; break; }
  if (!P) return;
  // 살아 있는 짝끼리 문양을 겹치지 않게 한다. 같은 문양이 둘이면 '어느 쪽이 짝인가'가
  // 규칙이 아니라 운이 되고, 그러면 실패가 플레이어 탓이 아니게 된다.
  let k = (rnd() * KIND.length) | 0;
  for (let g = 0; g < KIND.length && kindTaken(k); g++) k = (k + 1) % KIND.length;
  if (kindTaken(k)) return;

  const m = M();
  // 자리는 여섯 번 뽑아 기존 조각에서 가장 멀리 떨어진 것을 쓴다. 한 번만 뽑으면
  // 조각 둘이 겹쳐 앉아 어느 쪽을 짚었는지 눈으로도 손으로도 구분이 안 된다.
  let bx = 0.5, by = 0.5, bs = -1;
  for (let t = 0; t < 6; t++) {
    const cx = 0.10 + rnd() * 0.80, cy = 0.10 + rnd() * 0.80;
    let worst = 9;
    for (let i = 0; i < PMAX; i++) {
      const Q = pairs[i];
      if (!Q.live) continue;
      for (let s = 0; s < 2; s++) {
        const n = s ? Q.b : Q.a;
        const dx = (n.nx - cx) * m.w, dy = (n.ny - cy) * m.h;
        const d = Math.hypot(dx, dy) / m.U;
        if (d < worst) worst = d;
      }
    }
    if (worst > bs) { bs = worst; bx = cx; by = cy; }
  }
  // 짝은 화면 반대편이 아니라 '한 눈에 둘 다 들어오는' 거리에 둔다.
  // 너무 멀면 실을 긋는 동안 손가락이 화면을 다 가리고, 너무 가까우면 문양을 읽을 이유가 없다.
  let ox = 0, oy = 0;
  for (let t = 0; t < 8; t++) {
    const ang = rnd() * Math.PI * 2;
    const dist = (0.30 + rnd() * 0.22) * m.U;
    ox = Math.cos(ang) * dist / m.w;
    oy = Math.sin(ang) * dist / m.h;
    if (bx + ox > 0.06 && bx + ox < 0.94 && by + oy > 0.06 && by + oy < 0.94) break;
  }

  P.live = true;
  P.kind = k;
  P.frayMax = P.fray = frayAt(elapsed);
  P.a.nx = bx; P.a.ny = by;
  P.b.nx = Math.min(0.94, Math.max(0.06, bx + ox));
  P.b.ny = Math.min(0.94, Math.max(0.06, by + oy));
  // 조각은 천천히 흐른다. 배치가 굳으면 같은 자리에서 같은 수가 반복되고,
  // 심사용 스크린샷 10장도 같은 장면 몇 개로 접힌다.
  const sp = 0.035;
  P.a.vx = (rnd() * 2 - 1) * sp; P.a.vy = (rnd() * 2 - 1) * sp;
  P.b.vx = (rnd() * 2 - 1) * sp; P.b.vy = (rnd() * 2 - 1) * sp;
  P.a.px = m.x0 + P.a.nx * m.w; P.a.py = m.y0 + P.a.ny * m.h;
  P.b.px = m.x0 + P.b.nx * m.w; P.b.py = m.y0 + P.b.ny * m.h;
  livePairs++;
  FX.burst(P.a.px, P.a.py, KIND[k].c, 7);
  FX.burst(P.b.px, P.b.py, KIND[k].c, 7);
}

function drift(n, dt) {
  n.nx += n.vx * dt;
  n.ny += n.vy * dt;
  // 벽에서는 위치를 되돌리고 속도의 부호만 뒤집는다. 힘으로 막으면 dt가 튀는 프레임에
  // 조각이 베틀 밖으로 나간다
  if (n.nx < 0.04) { n.nx = 0.04; n.vx = Math.abs(n.vx); }
  if (n.nx > 0.96) { n.nx = 0.96; n.vx = -Math.abs(n.vx); }
  if (n.ny < 0.04) { n.ny = 0.04; n.vy = Math.abs(n.vy); }
  if (n.ny > 0.96) { n.ny = 0.96; n.vy = -Math.abs(n.vy); }
}

/* 겹친 조각을 서서히 떼어놓는다. 두 조각이 포개지면 어느 쪽을 짚었는지 눈으로도
   판정으로도 알 수 없고, 그러면 오연결이 플레이어 탓이 아니게 된다.
   위치를 한 번에 밀지 않고 dt에 비례해 조금씩 미는 이유는 표류와 싸워 떨리지 않게 하기 위해서다. */
const nodeList = new Array(PMAX * 2);
function separate(m, dt) {
  let n = 0;
  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    nodeList[n++] = P.a;
    nodeList[n++] = P.b;
  }
  const min = m.r * 3.0;             // 마모 링(1.42r) 둘이 서로 닿지 않는 거리
  const rate = Math.min(1, dt * 5) * 0.5;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const A = nodeList[i], B = nodeList[j];
      const dx = B.px - A.px, dy = B.py - A.py;
      const d = Math.hypot(dx, dy);
      if (d >= min || d < 1e-4) continue;
      const k = (min - d) * rate;
      const ux = dx / d, uy = dy / d;
      nudge(m, A, -ux, -uy, k);
      nudge(m, B, ux, uy, k);
    }
  }
}

function moveCur(dx, dy) {
  kbSeen = true;
  const m = M();
  if (cur.p < 0 || !pairs[cur.p].live || (dx === 0 && dy === 0)) {
    // 커서가 없으면 베틀 한가운데에서 가장 가까운 조각으로 들어간다
    if (pickNode(m.x0 + m.w / 2, m.y0 + m.h / 2, -1, 0, -1, m.U * 9)) { cur.p = found.p; cur.s = found.s; }
    return;
  }
  const from = node(cur.p, cur.s);
  let bp = -1, bs = 0, bd = 1e18;
  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    for (let s = 0; s < 2; s++) {
      if (i === cur.p && s === cur.s) continue;
      const n = s ? P.b : P.a;
      const ex = n.px - from.px, ey = n.py - from.py;
      const d = Math.hypot(ex, ey) || 1;
      // 그 방향으로 충분히 놓인 것만 후보다. 옆으로 벗어난 만큼 거리에 벌점을 준다 —
      // 순수 최단거리로 고르면 방향키가 방향을 뜻하지 않게 된다
      const align = (ex * dx + ey * dy) / d;
      if (align < 0.35) continue;
      const cost = d / align;
      if (cost < bd) { bd = cost; bp = i; bs = s; }
    }
  }
  if (bp >= 0) { cur.p = bp; cur.s = bs; }
}

function endRun() {
  const m = M();
  FX.burst(m.x0 + m.w / 2, m.y0 + m.h / 2, '#ff2e88', 34);
  FX.shake(m.U * 0.042);
  FX.flash('#ff2e88', 0.3, 0.55);
  gameOver();
}

function reset() {
  clearInput();
  ptr.has = false;
  for (let i = 0; i < PMAX; i++) pairs[i].live = false;
  for (let i = 0; i < THMAX; i++) { threads[i].live = false; threads[i].hit = 0; }
  for (let i = 0; i < GMAX; i++) ghosts[i].life = 0;
  livePairs = 0;
  integrity = INTEG_MAX;
  elapsed = 0;
  chain = 0;
  anchorP = -1;
  cur.p = -1;
  kbSeen = false;
  msg.life = 0;
  round++;
  // 판마다 시드를 어긋낸다. 모든 판이 같으면 두 판째에 배치를 외우고, 심사용 스크린샷
  // 10장도 같은 장면 몇 개로 접힌다. 난수가 아니라 판 번호로 어긋내므로 같은 판은 언제나 같다.
  seed = (51413 + round * 40503) >>> 0;
  for (let i = 0; i < START_PAIRS; i++) spawnPair();
  // 판을 빈 베틀로 시작하지 않는다. 첫 유입까지 1.05초라 그 사이에 찍힌 스크린샷은
  // 배경뿐인 '디버그 캔버스'가 된다. 그리고 넷의 남은 수명을 어긋내 둔다 —
  // 한꺼번에 끊어지면 무엇이 급한지 배울 시간이 없고, 방치 종결도 예산 밖으로 나간다.
  let k = 0;
  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    // 남은 수명을 넉넉히 주고 시작한다. 처음엔 0.60~1.005였는데, 그러면 첫 끊김이 4초에 와서
    // 규칙을 읽기도 전에 -12를 맞는다. 8초 방치 종결을 맞추려고 판을 이미 상한 상태로
    // 시작한 셈인데, 게이트가 요구한 것은 '끝이 있다'이지 '시작부터 지고 있다'가 아니다.
    P.fray = P.frayMax * (0.86 + k * 0.045);
    k++;
  }
  spawnIn = spawnGapAt(0);
  FX.flash('#00e5ff', 0.18, 0.22);
}

function step(m, dt) {
  elapsed += dt;
  // 결속력은 두 곳에서 샌다: 상시 누설과, 아직 안 짜인 짝 하나하나가 거는 장력.
  // 장력이 짝 수에 비례하기 때문에 '베틀을 비워 두는 것'이 곧 방어가 된다.
  integrity -= (bleedAt(elapsed) + tensionAt(elapsed) * livePairs) * dt;

  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    drift(P.a, dt);
    drift(P.b, dt);
  }
  sync(m);
  separate(m, dt);
  sync(m);   // 밀어낸 뒤의 좌표로 다시 맞춘다 — 판정과 그림이 같은 자리를 봐야 한다

  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    P.fray -= dt;
    if (P.fray <= 0) snapPair(m, i);
  }

  for (let i = 0; i < THMAX; i++) {
    const T = threads[i];
    if (!T.live) continue;
    T.life -= dt;
    if (T.hit > 0) T.hit -= dt;
    if (T.life <= 0) T.live = false;
  }
  for (let i = 0; i < GMAX; i++) if (ghosts[i].life > 0) ghosts[i].life -= dt;
  if (msg.life > 0) msg.life -= dt;
  if (anchorP >= 0 && !pairs[anchorP].live) anchorP = -1;

  spawnIn -= dt;
  if (spawnIn <= 0) {
    if (livePairs < (capAt(elapsed) | 0)) {
      spawnPair();
      spawnIn = spawnGapAt(elapsed);
    } else {
      spawnIn = 0;   // 정원이 찼다. 자리가 날 때까지 기다린다 — 간격을 새로 주면 유입이 밀린다
    }
  }

  if (integrity <= 0) { integrity = 0; endRun(); }
}

/* ---- 그리기 ---- */
function shapePath(kind, x, y, r) {
  const K = KIND[kind];
  const rot = K.rot;
  ctx.beginPath();
  if (K.star) {
    const n = K.n * 2;
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI / K.n;
      const rr = (i & 1) ? r * 0.44 : r;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
  } else {
    for (let i = 0; i < K.n; i++) {
      const a = rot + i * 2 * Math.PI / K.n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
  }
  ctx.closePath();
}

function drawNode(m, P, n, isAnchor, isCur) {
  const K = KIND[P.kind];
  const left = P.fray / P.frayMax;
  // 마모 링. 남은 수명이 곧 우선순위다 — 이 링이 없으면 무엇부터 짜야 하는지 알 길이 없다.
  // 얇아질수록 색이 붉어지고, 마지막 구간에서는 두께가 맥동한다.
  const warnPulse = left < 0.26 ? 0.5 + 0.5 * Math.sin(elapsed * 13) : 0;
  ctx.beginPath();
  ctx.arc(n.px, n.py, m.r * 1.42, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,246,255,.10)';
  ctx.lineWidth = m.line * 2.4;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(n.px, n.py, m.r * 1.42, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left);
  ctx.strokeStyle = left < 0.26 ? '#ff5a3d' : left < 0.5 ? '#ffb020' : 'rgba(232,246,255,.55)';
  ctx.lineWidth = m.line * (2.4 + warnPulse * 2.6);
  ctx.stroke();

  shapePath(P.kind, n.px, n.py, m.r);
  ctx.fillStyle = 'rgba(7,9,18,.92)';
  ctx.fill();
  ctx.strokeStyle = K.c;
  ctx.lineWidth = m.line * (isAnchor ? 3.4 : 2.2);
  ctx.stroke();

  // 안쪽 심에만 글로우를 건다. 스무 개 도형 전부에 shadowBlur를 걸면 프레임이 무너진다
  shapePath(P.kind, n.px, n.py, m.r * 0.46);
  ctx.fillStyle = K.c;
  ctx.shadowColor = K.c;
  ctx.shadowBlur = m.r * (isAnchor ? 1.1 : 0.6);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (isAnchor) {
    const p = 1 + 0.10 * Math.sin(elapsed * 9);
    ctx.beginPath();
    ctx.arc(n.px, n.py, m.r * 1.85 * p, 0, Math.PI * 2);
    ctx.strokeStyle = K.c;
    ctx.lineWidth = m.line * 1.6;
    ctx.globalAlpha = 0.8;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (isCur) {
    // 키보드 커서는 모서리 괄호로 표시한다. 원을 하나 더 그리면 앵커와 구분이 안 된다
    const s = m.r * 1.7, t = m.r * 0.55;
    ctx.strokeStyle = '#e8f6ff';
    ctx.lineWidth = m.line * 1.8;
    ctx.beginPath();
    ctx.moveTo(n.px - s, n.py - s + t); ctx.lineTo(n.px - s, n.py - s); ctx.lineTo(n.px - s + t, n.py - s);
    ctx.moveTo(n.px + s - t, n.py - s); ctx.lineTo(n.px + s, n.py - s); ctx.lineTo(n.px + s, n.py - s + t);
    ctx.moveTo(n.px + s, n.py + s - t); ctx.lineTo(n.px + s, n.py + s); ctx.lineTo(n.px + s - t, n.py + s);
    ctx.moveTo(n.px - s + t, n.py + s); ctx.lineTo(n.px - s, n.py + s); ctx.lineTo(n.px - s, n.py + s - t);
    ctx.stroke();
  }
}

function drawCross(x, y, r, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.4, r * 0.28);
  ctx.beginPath();
  ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
  ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r);
  ctx.stroke();
}

// 배경은 클립 밖에서 그린다 — 밴드가 아니라 화면 전체를 덮는다.
// 가로 창에서 여백이 검게 비면 순수 레터박스가 되고, 그 그림이 포털 썸네일에 박힌다.
function backdrop() {
  ctx.fillStyle = '#070912';
  ctx.fillRect(-OX, 0, SW, H);
}

function draw(m, dt) {
  // 위상은 여기서 진행시킨다 — draw는 모든 상태에서 매 프레임 불리므로
  // 타이틀·게임오버 화면에서도 베틀이 흐른다 (게이트1이 어디서 찍어도 움직인다).
  warp = (warp + m.warpGap * 0.62 * dt) % m.warpGap;
  weft = (weft + m.weftGap * 0.34 * dt) % m.weftGap;
  shuttle += dt * 0.30;
  if (shuttle > 1.3) shuttle -= 1.3;
  sync(m);

  // 베틀 — 날실과 씨실. 선마다 beginPath/stroke를 부르면 폰에서 프레임이 깎이므로
  // 한 경로에 전부 담아 한 번만 긋는다
  ctx.lineWidth = m.line;
  ctx.strokeStyle = 'rgba(0,229,255,.085)';
  ctx.beginPath();
  for (let x = m.x0 - m.r + warp; x < m.x0 + m.w + m.r; x += m.warpGap) {
    ctx.moveTo(x, m.y0 - m.r); ctx.lineTo(x, m.y0 + m.h + m.r);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,229,255,.05)';
  ctx.beginPath();
  for (let y = m.y0 - m.r + weft; y < m.y0 + m.h + m.r; y += m.weftGap) {
    ctx.moveTo(m.x0 - m.r, y); ctx.lineTo(m.x0 + m.w + m.r, y);
  }
  ctx.stroke();

  // 북(shuttle)이 위아래로 오간다. 베틀이 돌고 있다는 유일한 신호이자
  // 정지 화면 방지책이다 — 조각을 전부 짜 버린 순간에도 화면은 움직인다
  const sy = m.y0 - m.r + (m.h + m.r * 2) * (shuttle < 1 ? shuttle : 1 - (shuttle - 1) / 0.3);
  ctx.strokeStyle = 'rgba(0,229,255,.20)';
  ctx.lineWidth = m.line * 2;
  ctx.beginPath();
  ctx.moveTo(m.x0 - m.r, sy); ctx.lineTo(m.x0 + m.w + m.r, sy);
  ctx.stroke();

  // 베틀 테두리
  ctx.strokeStyle = 'rgba(0,229,255,.28)';
  ctx.lineWidth = m.line * 1.6;
  ctx.strokeRect(m.x0 - m.r, m.y0 - m.r, m.w + m.r * 2, m.h + m.r * 2);

  // 짜 둔 실 — 지금은 장애물이다. 남은 시간이 굵기와 밝기로 보여야
  // '조금만 기다리면 길이 열린다'가 읽힌다
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < THMAX; i++) {
    const T = threads[i];
    if (!T.live) continue;
    const k = T.life / T.ttl;
    const x1 = m.x0 + T.x1 * m.w, y1 = m.y0 + T.y1 * m.h;
    const x2 = m.x0 + T.x2 * m.w, y2 = m.y0 + T.y2 * m.h;
    const c = T.hit > 0 ? '#ffb020' : KIND[T.kind].c;
    ctx.strokeStyle = c;
    ctx.globalAlpha = 0.14 * k + (T.hit > 0 ? 0.35 : 0);
    ctx.lineWidth = m.r * (0.55 + 0.5 * k);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.globalAlpha = 0.55 * k + (T.hit > 0 ? 0.45 : 0);
    ctx.lineWidth = m.line * (1.4 + 2.2 * k);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 미리보기 실. 이으면 어떻게 되는지를 놓기 전에 말해 준다 —
  // 초록이면 짜인다, 호박이면 실이 걸린다(엇갈리는 자리에 X), 분홍이면 문양이 다르다.
  // 이게 없으면 실패가 '내 탓'이 아니라 '운'이 된다.
  if (anchorP >= 0 && pairs[anchorP].live) {
    const an = node(anchorP, anchorS);
    let tx = ptr.has ? ptr.x : an.px, ty = ptr.has ? ptr.y : an.py;
    let tgt = -1, tgs = 0;
    if (ptr.has && pickNode(tx, ty, anchorP, anchorS, anchorP, m.reach)) { tgt = found.p; tgs = found.s; }
    else if (!ptr.has && cur.p >= 0 && pairs[cur.p].live && !(cur.p === anchorP && cur.s === anchorS)) { tgt = cur.p; tgs = cur.s; }
    if (tgt >= 0) { const t = node(tgt, tgs); tx = t.px; ty = t.py; }

    let col = '#8be9ff', crossed = -1;
    if (tgt >= 0) {
      if (tgt !== anchorP) col = '#ff2e88';
      else {
        crossed = crossCheck(an.px, an.py, tx, ty);
        col = crossed >= 0 ? '#ffb020' : '#39ff8b';
      }
    }
    DASH[0] = m.U * 0.028; DASH[1] = m.U * 0.022;
    ctx.setLineDash(DASH);
    ctx.lineDashOffset = -elapsed * m.U * 0.22;
    ctx.strokeStyle = col;
    ctx.lineWidth = m.line * 2.6;
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(an.px, an.py); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash(NODASH);
    ctx.lineDashOffset = 0;
    ctx.globalAlpha = 1;
    if (crossed >= 0) drawCross(hit.x, hit.y, m.r * 0.5, '#ffb020');
  }

  // 실패의 잔상
  for (let i = 0; i < GMAX; i++) {
    const g = ghosts[i];
    if (g.life <= 0) continue;
    const k = g.life / g.ttl;
    ctx.globalAlpha = k;
    ctx.strokeStyle = g.color;
    ctx.lineWidth = m.line * 2.4;
    DASH[0] = m.U * 0.018; DASH[1] = m.U * 0.018;
    ctx.setLineDash(DASH);
    ctx.beginPath();
    ctx.moveTo(m.x0 + g.x1 * m.w, m.y0 + g.y1 * m.h);
    ctx.lineTo(m.x0 + g.x2 * m.w, m.y0 + g.y2 * m.h);
    ctx.stroke();
    ctx.setLineDash(NODASH);
    if (g.mark) drawCross(m.x0 + g.ix * m.w, m.y0 + g.iy * m.h, m.r * 0.6 * (2 - k), g.color);
    ctx.globalAlpha = 1;
  }

  for (let i = 0; i < PMAX; i++) {
    const P = pairs[i];
    if (!P.live) continue;
    drawNode(m, P, P.a, anchorP === i && anchorS === 0, kbSeen && cur.p === i && cur.s === 0);
    drawNode(m, P, P.b, anchorP === i && anchorS === 1, kbSeen && cur.p === i && cur.s === 1);
  }

  // 결속력 게이지. 이 게임에서 유일한 목숨이라 숫자와 막대를 같이 둔다 —
  // 막대만 두면 남은 양이 얼마나 급한지 판단할 수가 없다
  const k = Math.max(0, Math.min(1, integrity / INTEG_MAX));
  const gc = k > 0.55 ? '#39ff8b' : k > 0.28 ? '#ffb020' : '#ff2e88';
  ctx.fillStyle = 'rgba(232,246,255,.09)';
  ctx.fillRect(m.x0 - m.r, m.gaugeY, m.w + m.r * 2, m.gaugeH);
  ctx.fillStyle = gc;
  ctx.shadowColor = gc;
  ctx.shadowBlur = m.gaugeH * 0.9;
  ctx.fillRect(m.x0 - m.r, m.gaugeY, (m.w + m.r * 2) * k, m.gaugeH);
  ctx.shadowBlur = 0;

  ctx.font = m.fontSmall;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(232,246,255,.62)';
  ctx.fillText('INTEGRITY', m.x0 - m.r, m.gaugeY - m.gaugeH * 0.55);
  ctx.textAlign = 'right';
  // 지금 초당 얼마가 빠지는지 그대로 보여 준다. 짝을 하나 남길 때마다 이 숫자가 오르는 것을
  // 보면 '베틀을 비워라'라는 규칙을 설명 없이 알게 된다
  const sv = Math.round((bleedAt(elapsed) + tensionAt(elapsed) * livePairs) * 10);
  if (sv !== cache.sv) { cache.sv = sv; cache.sTxt = 'STRAIN −' + (sv / 10).toFixed(1) + '/s'; }
  ctx.fillText(cache.sTxt, m.x0 + m.w + m.r, m.gaugeY - m.gaugeH * 0.55);
  ctx.textAlign = 'center';
  ctx.font = m.fontMid;
  ctx.fillStyle = gc;
  const iv = Math.ceil(integrity);
  if (iv !== cache.iv) { cache.iv = iv; cache.iTxt = iv + '%'; }
  ctx.fillText(cache.iTxt, m.x0 + m.w / 2, m.gaugeY + m.gaugeH * 2.3);
  if (chain >= 3) {
    const cv = mult();
    if (cv !== cache.cv) { cache.cv = cv; cache.cTxt = 'CHAIN ×' + cv; }
    ctx.font = m.fontSmall;
    ctx.fillStyle = '#e8f6ff';
    ctx.fillText(cache.cTxt, m.x0 + m.w / 2, m.gaugeY - m.gaugeH * 0.55);
  }

  // 판정 문구. 무엇이 왜 일어났는지 한 줄로 말한다
  if (msg.life > 0) {
    const a = Math.min(1, msg.life * 1.8);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = m.fontBig;
    ctx.fillStyle = msg.color;
    ctx.fillText(msg.text, m.x0 + m.w / 2, m.y0 - m.r * 0.35);
    if (msg.sub) {
      ctx.font = m.fontSmall;
      ctx.fillStyle = 'rgba(232,246,255,.68)';
      ctx.fillText(msg.sub, m.x0 + m.w / 2, m.y0 + m.r * 0.35);
    }
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}
/* ===== GAME LOGIC 끝 ===== */

/* ---------- 상태 전이 ---------- */
function start() {
  score = 0;
  el.score.textContent = '0';
  el.title.hidden = true;
  el.over.hidden = true;
  reset();
  state = S.PLAYING;
  Portal.gameplayStart();
}
function pause() { if (state === S.PLAYING) state = S.PAUSED; }
function resume() { if (state === S.PAUSED) state = S.PLAYING; }
function gameOver() {
  state = S.OVER;
  beep(160, 180);
  Portal.gameplayStop();
  if (score > best) { best = score; saveBest(best); el.best.textContent = best; }
  el.finalScore.textContent = score;
  el.over.hidden = false;
}

/* ---------- 루프 ---------- */
let last = 0;
function frame(now) {
  // dt 상한 0.05는 장식이 아니다. 이 게임에서는 조각이 프레임당 최대 0.0018(정규화 좌표)만
  // 움직이므로 터널링은 없지만, 상한이 없으면 탭이 뒤로 갔다 돌아온 프레임에서
  // 마모·누설이 한 번에 수 초치 들어와 손도 못 대고 판이 끝난다.
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  tick++;
  const m = M();               // 프레임당 한 번만 만든다 (step·draw가 같은 값을 본다)
  if (state === S.PLAYING) {
    step(m, dt);
    el.score.textContent = score;
  }
  // FX는 모든 상태에서 돈다 — 죽은 뒤에도 파편과 흔들림이 끝까지 재생돼야
  // 사망이 '멈춤'이 아니라 '사건'으로 보인다.
  FX.update(dt);
  FX.begin(ctx);
  backdrop();                  // 화면 전체 — 클립 밖
  ctx.save();                  // 여기부터 밴드 안에서만 그린다
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  draw(m, dt);
  FX.draw(ctx);
  ctx.restore();
  FX.end(ctx);                 // 플래시는 클립 밖 — 화면 전체를 덮는다
  requestAnimationFrame(frame);
}

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ---------- */
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  // 플레이 밴드. 게이트가 가로 뷰포트에서 이 비율을 재서 난이도가 창 모양에
  // 끌려가지 않는지 판정한다. 공식만 고치면 같은 결함이 다시 들어온다 — 축을 남긴다.
  get field() { return { x: OX, w: W, h: H, screenW: SW }; },
  start, pause, resume
};

resize();
// SDK가 거부하거나 던져도 루프는 시작한다. 여기서 멈추면 화면이 영원히 검은 채로 남는데,
// 포털 빌드에서 그게 가장 나쁜 실패다 — 광고 SDK 하나 때문에 게임이 아예 안 뜬다.
const startLoop = () => requestAnimationFrame(frame);
try {
  Portal.ready().then(startLoop, startLoop);
} catch {
  startLoop();
}
</script>
</body>
