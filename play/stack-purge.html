<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== PAGE TEXT — 새 게임에서 이 블록을 교체한다 ===== -->
<title>Stack Purge — Neon Arcade</title>
<!-- ===== PAGE TEXT 끝 ===== -->
<style>
  :root { --neon: #00e5ff; --bg: #05060a; --ink: #e8f6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud b { color: var(--neon); font-weight: 700; }
  /* HUD 높이를 바꾸면 플레이 밴드(390/806)가 깨진다. font를 물려받고 padding·border를 0으로
     둬서 줄 상자가 옆의 span과 같게 만든다 — 아이콘 대신 글자를 쓰는 이유도 그거다. */
  #hud button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; letter-spacing: inherit; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #070912; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(5, 6, 10, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: .04em; color: var(--neon); }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.5; opacity: .85; font-size: 14px; }
  .btn { appearance: none; border: 1px solid var(--neon); background: transparent; color: var(--neon);
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
    min-width: 160px; min-height: 48px; }
  .btn:active { background: rgba(0, 229, 255, .16); }
</style>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://just1game.com/games/stack-purge/">
</head>
<body>
<div id="wrap">
  <!-- ===== HUD & OVERLAYS — 새 게임에서 이 블록을 교체한다 =====
       id는 스크립트가 참조한다. HUD에 목숨·레벨을 더하면 아래 el 조회도 같이 늘려야 한다.
       canvas#c 와 두 오버레이의 id(titleScreen·overScreen)는 그대로 두는 편이 안전하다.
       이 게임은 남은 시간·스택 높이·색 범례를 전부 캔버스 안에 그린다 — 손가락이 가 있는 곳과
       읽어야 할 곳이 같아야 탭 도중에 눈이 HUD로 올라가지 않는다.
       게임오버 제목만 id를 하나 더 뒀다: 끝나는 방식이 둘(넘침·시간)이라 그 자리에서 어느 쪽인지 말해야 한다. -->
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>TODAY <b id="best">0</b></span>
    <button id="muteBtn" type="button" aria-label="Toggle sound">SOUND <b>ON</b></button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="titleScreen">
      <h1>STACK PURGE</h1>
      <p>Rows of blocks push up from the feeder. Tap any group of two or more touching blocks that share a colour and pip count — the group is purged and the stack drops. Bigger groups buy more time. Let the stack reach the top line and the run ends.</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
    <div class="overlay" id="overScreen" hidden>
      <h1 id="overTitle">STACK OVERFLOW</h1>
      <p>Score <b id="finalScore">0</b></p>
      <button class="btn" id="againBtn" type="button">Purge again</button>
    </div>
  </div>
  <!-- ===== HUD & OVERLAYS 끝 ===== -->
</div>

<script>
/* ============================================================
   NEON ARCADE — GAME BASE
   새 게임은 이 파일을 복사해 play/<slug>.html 로 두고
   "GAME LOGIC" 구역만 교체한다. 그 위/아래(계약·입력·FX·루프·포털 훅)는 그대로 둔다.
   ============================================================ */

const SLUG = 'stack-purge';                // 새 게임에서 슬러그로 바꾼다
const BEST_KEY = 'just1game:' + SLUG + ':best';
/* ---------- 하루 한 판 ---------- */
// 같은 날 들어온 사람은 같은 판을 받는다. 시드가 날짜 하나뿐이라 서버가 필요 없다.
//
// ⚠ 이 게임들이 난수를 안 쓰는 이유는 게이트가 실패를 재현할 수 있어야 해서다.
//   날짜를 섞으면 그 성질이 깨진다 — 오늘 통과한 게임이 다음 주에 실패할 수 있고,
//   썸네일도 매일 다른 그림이 된다. 그래서 고정할 길을 같이 둔다:
//
//     ?day=N        일부러 특정 날을 재볼 때 (여러 날 게이트 실행)
//     file:// 로 열면 언제나 0일차 — verify·shoot·shots·og 가 전부 이 경로로 연다
//     그 외          오늘
//
//   순서가 중요하다. file:// 규칙이 없으면 도구마다 ?day=0을 붙여야 하고, 한 곳만
//   빠뜨려도 그 도구만 조용히 날짜에 끌려간다.
const DAY_ZERO = Math.floor(Date.UTC(2026, 7, 1) / 86400000);
const DAY = (() => {
  try {
    const q = new URLSearchParams(location.search).get('day');
    if (q !== null && q !== '' && Number.isFinite(Number(q))) return Math.trunc(Number(q));
    if (location.protocol === 'file:') return 0;
  } catch (e) { return 0; }
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) - DAY_ZERO;
})();
const DAILY_NO = DAY + 1;
// 인접한 날이 비슷한 판이 되지 않도록 흩는다. 게임은 이 둘 중 자기에게 맞는 것만 쓴다.
const DAY_SEED = Math.imul(DAY + 1, 2654435761) >>> 0;   // 정수 시드에 섞을 값
const DAY_PHASE = (DAY_SEED % 1000003) / 1000003;        // 0~1. 황금비 수열의 위상용

/* ---------- 오늘의 최고점 ----------
   판이 매일 바뀌므로 전체 기간 최고점은 **다른 날 판에서 낸 숫자**다. 화면에는 오늘 것을 쓴다.
   전체 기간 값도 계속 적어둔다 — 지우면 되돌릴 수 없고, 지금 안 보인다고 버릴 이유는 없다. */
const TODAY_KEY = 'just1game:' + SLUG + ':d' + DAY;
function loadToday() {
  try { return Number(localStorage.getItem(TODAY_KEY)) || 0; } catch { return 0; }
}
function saveToday(v) {
  try { localStorage.setItem(TODAY_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}
// 지난 날 기록은 지운다. 안 지우면 게임 하나에 하루 한 개씩 영원히 쌓인다.
(function () {
  try {
    const prefix = 'just1game:' + SLUG + ':d';
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0 && k !== TODAY_KEY) localStorage.removeItem(k);
    }
  } catch (e) { /* 차단된 저장소 */ }
})();

/* ---------- 최고점 저장 ----------
   localStorage는 샌드박스 iframe이나 서드파티 저장소가 차단된 환경에서
   읽기만 해도 throw한다 — 이 파일이 SDK 훅을 들고 가는 포털 임베드가 정확히 그 환경이다.
   막히면 메모리에만 유지한다(그 세션 동안은 최고점이 동작하고, 다음 방문에 사라진다). */
function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}

/* ---------- 포털 SDK 훅 ----------
   사이트 배포에서는 비활성 no-op. 포털 납품 빌드에서만 PORTAL.enabled를 켠다.
   게임 로직은 아래 4개 함수만 부른다 — SDK가 무엇으로 바뀌어도 로직은 안 바뀐다. */
const PORTAL = { enabled: false, gameId: '' };
const Portal = {
  ready() { if (!PORTAL.enabled) return Promise.resolve(); return Promise.resolve(window.gdsdk); },
  gameplayStart() { if (PORTAL.enabled && window.gdsdk) window.gdsdk.preloadAd?.('rewarded'); },
  gameplayStop() { /* 납품 빌드에서 SDK의 gameplayStop을 연결한다 */ },
  adBreak(done) { done(); }   // 비활성 상태에서는 즉시 콜백. 게임이 광고를 기다리며 멈추지 않는다
};

/* ---------- 오디오: 사용자 제스처 이후에만 초기화 (모바일 정책) ---------- */
let actx = null;
function audioReady() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 제스처 안에서 만들어도 suspended로 시작할 수 있다 (특히 iOS·임베드).
  // 깨우지 않으면 모든 복제 게임이 조용히 무음이 된다. 거부는 무시한다 — 소리는 부가 기능이다.
  Promise.resolve(actx.resume?.()).catch(() => {});
}
function beep(freq, ms) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.value = 0.04;
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + ms / 1000);
}

/* ---------- BGM: 배경음도 코드로 쓴다 (프레임 레벨) ---------- */
// 오디오 파일을 들이지 않는 이유는 스프라이트 때와 같다 — 라이선스와 용량이다.
//
// 프레임 안에서 음을 만들지 않는다. 게이트 1이 fps 하한 50을 재므로 rAF에 붙이는 설계는
// 처음부터 못 쓴다. 박자를 오디오 스레드에 미리 예약하고 JS는 4Hz로만 깨어난다.
//
// state를 직접 읽는다 — start/gameOver/pause/resume 네 곳에 손을 대는 설계였으면
// 게임마다 한 곳을 빠뜨렸을 것이고, 그건 "게임오버 화면에서 음악만 계속 도는" 것으로 나타난다.
const BGM = (function () {
  // root=기음(Hz) · beat=한 박(초) · pattern=반음 오프셋(null은 쉼표)
  // 쌓이는 게임이라 선율이 내려갔다가 다시 올라온다.
  const SONG = {
    root: 246.9, beat: 0.28, wave: 'square',
    pattern: [12, 10, 7, 5, 3, 2, 0, null, 3, 5, 7, 10, 12, 10, 7, 5]
  };
  const MUTE_KEY = 'just1game:' + SLUG + ':muted';

  let bus = null, at = 0, step = 0, playing = false;
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { /* 차단된 저장소 */ }

  function tone(freq, when, dur, wave, vol) {
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, when);
    // 사각파를 그냥 켜고 끄면 딱딱 소리가 난다. 짧은 램프로 감싼다.
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(bus);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  }

  // 0.5초 앞까지만 채운다. 더 멀리 예약하면 정지가 그만큼 늦게 먹는다.
  // 광고로 컨텍스트가 suspend되면 currentTime이 멈추므로 여기서 저절로 멈춘다.
  function fill() {
    while (at < actx.currentTime + 0.5) {
      const i = step % SONG.pattern.length;
      const semi = SONG.pattern[i];
      if (semi !== null) {
        tone(SONG.root * Math.pow(2, semi / 12), at, SONG.beat * 0.85, SONG.wave, 0.018);
      }
      if (i % 4 === 0) tone(SONG.root / 2, at, SONG.beat * 3.2, 'triangle', 0.026);
      at += SONG.beat;
      step++;
    }
  }

  function begin() {
    if (!bus) { bus = actx.createGain(); bus.connect(actx.destination); }
    playing = true;
    at = actx.currentTime + 0.1;
    fill();
  }
  // 이미 예약된 음이 남아 있으므로 버스를 끊는다. 다음 begin()이 새로 만든다.
  function end() {
    playing = false;
    if (bus) { try { bus.disconnect(); } catch (e) {} bus = null; }
  }

  // 제스처를 기다리지 않는다 — actx가 없으면 아무것도 안 하고 넘어간다.
  setInterval(function () {
    if (!actx) return;
    const want = state === S.PLAYING && !muted;
    if (want && !playing) begin();
    else if (!want && playing) end();
    else if (playing) fill();
  }, 250);

  const btn = document.getElementById('muteBtn');
  const paint = () => { if (btn) btn.querySelector('b').textContent = muted ? 'OFF' : 'ON'; };
  if (btn) {
    btn.addEventListener('click', () => {
      audioReady();          // 소리를 켜는 클릭이 곧 제스처다 — 여기서 컨텍스트가 열린다
      muted = !muted;
      try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
      if (muted) end();
      paint();
    });
  }
  paint();

  return { isMuted: () => muted, isPlaying: () => playing };
})();

/* ---------- 캔버스: 반응형 + DPR ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// 플레이 밴드 — 창이 가로로 넓어도 게임이 도는 판은 늘 세로 비율이다.
// 이게 없으면 치수를 H에서 파생하므로 넓은 창일수록 조작 목표가 화면 폭 대비 작아진다
// (900x600에서 3.2배 어려웠다). 806은 기준 폰 390x844에서 HUD 38px를 뺀 캔버스 높이다.
const BAND = 390 / 806;
let W = 0, H = 0;        // 플레이필드 — 게임 로직이 쓰는 좌표계. W는 밴드 폭이다
let SW = 0, OX = 0;      // 실제 화면 폭 / 밴드 좌측 여백. 배경만 이 둘을 본다
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  // 원점을 밴드 왼쪽으로 옮긴다. 게임 코드는 W가 화면 폭인 줄 알고 그대로 돌아간다.
  // 기준 화면에서는 round(806*BAND)=390=SW라 OX=0 — 픽셀 하나 안 변한다.
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   FX — 파티클·화면 흔들림·플래시. 프레임의 일부이므로 새 게임이 그대로 물려받는다.
   에셋도 라이브러리도 쓰지 않는다: 이 파이프라인의 게임은 캔버스로만 그린다
   (에셋 라이선스가 기존 게임의 상업적 사용을 막았고, 그 실수를 반복하지 않는다).

   GAME LOGIC이 부르는 것은 이 셋뿐이다:
     FX.burst(x, y, color[, count])  — (x,y)에서 파편이 터진다. 캔버스 픽셀 좌표
     FX.shake(px)                    — 화면을 px만큼 흔든다 (여러 번 부르면 큰 쪽이 이긴다)
     FX.flash(color[, sec, peak])    — 화면 전체를 잠깐 덮는다. peak은 가장 진할 때의 알파
     FX.trail(x, y, color, w, h[, sec]) — 잔상 하나. 매 프레임 불러 이동 흔적을 만든다
   루프가 부르는 것: FX.update(dt) / FX.begin(ctx) / FX.draw(ctx) / FX.end(ctx)

   begin/end로 감싸는 이유: 흔들림은 화면 전체를 옮기는 것이라
   옮긴 만큼 가장자리에 빈 띠가 생긴다. begin이 먼저 FX.bg로 캔버스를 덮고 옮긴다.
   그래서 FX.bg는 게임 배경색과 같아야 한다 — 새 게임에서 배경을 바꾸면 이 값도 바꾼다.
   ============================================================ */
const FX = (() => {
  // 파티클은 고정 풀에서만 꺼낸다. 폭발마다 객체를 새로 만들면 60초 플레이에서
  // 힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다. 다 차면 오래된 것부터 덮어쓴다.
  const MAX = 220;
  const pool = new Array(MAX);
  for (let i = 0; i < MAX; i++) pool[i] = { life: 0, ttl: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, w: 2, h: 2, color: '#fff' };
  let head = 0;

  let amp = 0, sx = 0, sy = 0;
  let flashT = 0, flashDur = 1, flashPeak = 0.55, flashColor = '#fff';

  // 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
  // 매번 달라져 실패를 다시 만들어낼 수 없다.
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  const take = () => { const p = pool[head]; head = (head + 1) % MAX; return p; };

  return {
    bg: '#070912',

    burst(x, y, color, count = 14) {
      // 속도·크기·중력을 화면 높이에서 파생한다. 픽셀 상수로 두면 4K에서 먼지가 된다
      // (M()이 스프라이트에 대해 하는 것과 같은 이유).
      const spd = H * 0.42, grav = H * 0.9, size = Math.max(1.5, H * 0.0055);
      for (let i = 0; i < count; i++) {
        const a = rnd() * Math.PI * 2;
        const v = spd * (0.35 + rnd() * 0.85);
        const p = take();
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - spd * 0.25;
        p.g = grav; p.w = p.h = size * (0.7 + rnd() * 0.9);
        p.ttl = p.life = 0.45 + rnd() * 0.5;
        p.color = color;
      }
    },

    trail(x, y, color, w, h, sec = 0.26) {
      const p = take();
      p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0;
      p.w = w; p.h = h; p.ttl = p.life = sec; p.color = color;
    },

    shake(px) { amp = Math.max(amp, px); },

    // peak은 가장 진할 때의 알파. 사망처럼 화면을 끊는 순간은 세게, 등장·획득처럼
    // 자주 일어나는 순간은 약하게 — 약한 값이 없으면 흔한 사건이 화면을 계속 세탁한다.
    flash(color, sec = 0.2, peak = 0.55) { flashColor = color; flashDur = sec; flashT = sec; flashPeak = peak; },

    update(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      // 흔들림은 지수 감쇠. 매 프레임 새 오프셋을 뽑아야 '떨림'으로 보인다.
      amp *= Math.exp(-dt * 9);
      if (amp < 0.35) amp = 0;
      sx = amp ? (rnd() * 2 - 1) * amp : 0;
      sy = amp ? (rnd() * 2 - 1) * amp : 0;
      if (flashT > 0) flashT -= dt;
    },

    begin(ctx) {
      // 흔들림이 만드는 빈 띠를 덮는 판은 밴드가 아니라 화면 전체를 덮어야 한다
      if (sx || sy) { ctx.fillStyle = this.bg; ctx.fillRect(-OX, 0, SW, H); }
      ctx.save();
      ctx.translate(sx, sy);
    },

    draw(ctx) {
      // 가산 합성. 어두운 배경에서 파편이 겹칠수록 밝아져 네온처럼 보인다.
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        ctx.globalAlpha = p.life / p.ttl;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    end(ctx) {
      ctx.restore();
      // 플래시는 흔들림 밖에서 그린다 — 화면 전체를 덮는 판이라 같이 흔들리면 띠가 생긴다.
      if (flashT > 0) {
        ctx.globalAlpha = Math.min(1, (flashT / flashDur) * flashPeak);
        ctx.fillStyle = flashColor;
        ctx.fillRect(-OX, 0, SW, H);   // 밴드만 번쩍이면 화면이 두 조각으로 읽힌다
        ctx.globalAlpha = 1;
      }
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
let state = S.TITLE;
let score = 0;
let tick = 0;
let best = loadBest();
let today = loadToday();
let autoPaused = false;      // 탭이 숨겨져서 우리가 멈춘 것인지 구분한다

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  finalScore: document.getElementById('finalScore'),
  title: document.getElementById('titleScreen'),
  over: document.getElementById('overScreen')
};
el.best.textContent = today;

/* ---------- 입력: 키보드 + 터치 이중 ----------
   left/right는 '방향을 누르고 있다', aimX는 '이 지점을 짚었다'(0~1, 캔버스 폭 비율)이다.
   두 채널을 함께 두는 이유: 손가락은 화면 절반을 누르는 것보다 원하는 자리를 짚는 쪽이
   훨씬 정확한데, 키보드에는 그런 좌표가 없다. 게임 로직이 둘 다 읽고 하나로 합친다. */
const input = { left: false, right: false, aimX: null };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  // Space/Enter: 일시정지 중이면 재개한다. state !== PLAYING 하나로 묶으면
  // 멈춰 둔 판이 새 판으로 날아가고, 죽은 직후 프레임에 스스로 재시작해
  // 수집기가 'over'를 한 번도 못 보는 일이 생긴다.
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === S.PAUSED) resume();
    else if (state === S.TITLE || state === S.OVER) start();
  }
  if (e.code === 'KeyP') { state === S.PLAYING ? pause() : state === S.PAUSED ? resume() : 0; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// 짚은 지점을 캔버스 폭 비율로 바꾼다. 화면 절반 비교(왼쪽/오른쪽)로 두면
// 손가락이 '방향 버튼 두 개'가 되어 원하는 자리에 설 수 없다 — 드래그가 곧 조준이 되게 한다.
// 밴드 기준으로 잰다. ctx의 transform은 그리기만 옮기지 입력은 안 옮기므로
// OX를 여기서 직접 빼야 한다 — 안 빼면 가로 화면에서 손가락과 판이 어긋난다.
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  input.aimX = Math.min(1, Math.max(0, (clientX - rect.left - OX) / W));
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); audioReady();
  // 일시정지 상태에서의 탭은 재시작이 아니라 재개다 (Space와 같은 규칙).
  // 지금은 닿기 어려운 경로지만, 이 파일은 모든 새 게임에 복사된다 —
  // 화면 내 일시정지 버튼을 붙이는 게임이 그대로 버그를 물려받는다.
  if (state === S.PAUSED) { resume(); return; }
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault(); clearInput();
}, { passive: false });
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;      // 터치는 위에서 처리
  audioReady();
  if (state === S.PAUSED) { resume(); return; }   // 위 touchstart와 같은 규칙
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  // 마우스는 누르고 끌 때만 조준한다. 그냥 지나가는 커서까지 따라가면
  // 키보드로 놀던 사람의 플레이어가 제멋대로 끌려간다.
  if (e.pointerType !== 'touch' && e.buttons === 1 && state === S.PLAYING) aimAt(e.clientX);
});
// 캔버스 밖에서 손을 떼도 반드시 풀린다. 캔버스에만 걸면 오버레이 위에서 뗀 포인터가
// aimX를 붙잡은 채로 남아 다음 판이 한쪽으로 끌려간 채 시작한다.
window.addEventListener('pointerup', () => { clearInput(); });
window.addEventListener('pointercancel', () => { clearInput(); });

document.getElementById('startBtn').addEventListener('click', () => { audioReady(); start(); });
document.getElementById('againBtn').addEventListener('click', () => { audioReady(); start(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === S.PLAYING) { autoPaused = true; pause(); }
  } else if (autoPaused) {
    autoPaused = false;
    resume();
  }
});

/* ---- Axis: 좌우 한 축의 조작감 (프레임 레벨) ----
   가로 이동을 쓰는 게임이면 값만 바꿔 그대로 쓴다. 여기 있는 이유가 중요하다 —
   조작감 수식이 GAME LOGIC 안에 있으면 새 게임이 그 구역을 지우는 순간
   가속·마찰·조준 추종이 전부 같이 사라진다. 그러면 템플릿을 손본 의미가 없다.

   Axis.step(p, { dir, aimX }, dt) 는 p.x(0~1)와 p.vx를 갱신한다.
   dir: -1|0|1 (키보드), aimX: 0~1 또는 null (터치·포인터가 짚은 위치).
   가로 이동이 없는 게임(격자·탭 방식)은 이 블록을 안 부르면 그만이다. */
const Axis = {
  ACCEL: 7.0,        // 가속도 (화면 폭 배수/초²)
  MAX_SPD: 1.15,     // 최고 속도 (화면 폭/초)
  FRICTION: 9.0,     // 입력이 없을 때 속도가 죽는 비율/초
  TURN_BOOST: 2.4,   // 반대로 꺾을 때 가속 배수. 없으면 방향 전환이 마찰만큼 늦게 먹힌다
  AIM_ACCEL: 26.0,   // 짚은 지점을 향한 가속. 속도를 직접 넣지 않는 이유는 아래 참고
  AIM_SNAP: 0.004,   // 이 거리 안이면 붙인다 — 손가락 밑에서 미세하게 떠는 것을 막는다
  MIN_X: 0.06,
  MAX_X: 0.94,

  step(p, { dir = 0, aimX = null }, dt) {
    if (aimX !== null) {
      const d = aimX - p.x;
      if (Math.abs(d) < this.AIM_SNAP) {
        p.x = aimX;
        p.vx = 0;
      } else {
        // 속도를 바로 대입하면 손가락이 조금만 멀어져도 최고속에 붙어버려서
        // 터치에는 관성이 사라진다. 키보드와 같은 가속 경로를 태워야 두 조작이
        // 같은 게임처럼 느껴진다. 목표를 지나치지 않도록 마찰도 같이 건다.
        p.vx += Math.sign(d) * this.AIM_ACCEL * Math.min(1, Math.abs(d) * 6) * dt;
        p.vx -= p.vx * Math.min(1, this.FRICTION * 0.5 * dt);
        p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
      }
    } else if (dir !== 0) {
      // 이미 반대로 가고 있으면 더 세게 민다. 안 그러면 방향 전환에 마찰이 죽을 때까지
      // 기다려야 해서 가속을 넣은 순간 조작이 오히려 굼떠진다.
      const turning = dir * p.vx < 0;
      p.vx += dir * this.ACCEL * (turning ? this.TURN_BOOST : 1) * dt;
      p.vx = Math.max(-this.MAX_SPD, Math.min(this.MAX_SPD, p.vx));
    } else {
      // dt에 비례한 감쇠. 1을 넘지 않게 막아야 프레임이 튈 때 속도가 반대로 뒤집히지 않는다.
      p.vx -= p.vx * Math.min(1, this.FRICTION * dt);
    }

    p.x += p.vx * dt;
    if (p.x < this.MIN_X) { p.x = this.MIN_X; p.vx = 0; }   // 벽에 붙으면 속도도 죽인다 —
    if (p.x > this.MAX_X) { p.x = this.MAX_X; p.vx = 0; }   // 안 그러면 벽에서 떼는 순간 튄다
  }
};

/* ---- Curve: 시간에 따라 오르는 값 (프레임 레벨) ----
   한 축만 올리면 그 축이 상한에 닿는 순간 화면이 더 이상 변하지 않아
   유능한 플레이어가 같은 패턴을 반복하게 된다. 축마다 다른 시점에 상한에 닿게 두면
   난이도가 계속 바뀐다. elapsed(경과 초)를 넣으면 현재 값이 나온다. */
const Curve = (start, limit, ramp) => (elapsed) =>
  limit > start ? Math.min(limit, start + ramp * elapsed)
                : Math.max(limit, start - ramp * elapsed);

/* ============================================================
   ===== GAME LOGIC — 새 게임에서 이 구역만 교체한다 =====
   지켜야 할 계약:
     reset()     : 새 판의 초기 상태를 만든다 (score는 호출자가 0으로 만든다)
     step(m, dt) : dt(초)만큼 진행. 죽으면 gameOver()를 부른다.
                   입력을 주지 않으면 반드시 몇 초 안에 죽어야 한다 (게이트 2 방치 종결)
     draw(m, dt) : 캔버스를 그린다. 모든 상태에서 매 프레임 불린다.
                   단색이고 정지한 화면이면 게이트 1이 막는다
     m 은 루프가 프레임당 한 번 만든 M() 결과다 — step과 draw가 같은 값을 본다
   쓸 수 있는 것: FX.burst / FX.shake / FX.flash / FX.trail (위 FX 블록 참고).
   파티클과 잔상은 루프가 알아서 갱신·렌더하므로 여기서는 부르기만 한다.

   STACK PURGE — 아래 피더에서 블록 행이 쉬지 않고 밀려 올라온다. 같은 종류가 2개 이상
   맞닿아 있으면 그 덩어리를 한 번 눌러 지운다. 위에 있던 블록은 내려앉고, 크게 지울수록
   점수와 시간을 더 준다. 스택이 맨 위 경계선에 닿거나 시계가 0이 되면 판이 끝난다.

   왜 '칸'이 아니라 '덩어리'를 누르게 했나: 탭 게임에서 목표가 작으면 손가락이 목표를 가린다.
   덩어리 안 아무 칸이나 눌러도 되게 하면 큰 덩어리일수록 누르기도 쉬워져서,
   '정확히 짚는 손'이 아니라 '어디를 지울지 고르는 눈'의 게임이 된다.
   ============================================================ */

/* ---- 난이도 곡선 ----
   축마다 상한에 닿는 시점을 다르게 뒀다: 색 수 36초, 시간 보상 45초, 상승 55초.
   마지막 하나(시계 배속)는 상한이 없다 — 나머지가 전부 굳은 뒤에도 판은 계속 조여야 한다.
   상한이 전부 있으면 그 시점 이후로 게임이 변하지 않는 반복 구간이 된다. */
const riseAt     = Curve(0.43, 0.92, 0.0072);   // 행/초 — 68초에 상한
const colorsAt   = Curve(3.00, 5.00, 0.0380);   // 새 행에 섞이는 색 수 — 53초에 5색
const timeGainAt = Curve(0.30, 0.11, 0.0042);   // 블록 하나가 주는 시간(초) — 45초에 상한
const drainAt    = Curve(1.00, 9.00, 0.0110);   // 시계가 줄어드는 배속 — 상한 없음(도달 667초)

/* 색 수 곡선의 기울기는 눈에 보이는 것보다 세다. 색이 하나 늘면 덩어리 크기가 눈에 띄게
   줄어 같은 탭 속도로 벌 수 있는 양이 줄어든다 — 실측에서 이 기울기를 0.055로 뒀을 때
   보통 속도(1.2초에 한 번)로 누르는 판이 12초에 끝났다. 대신 시작 색 수(3)는 건드리지 않는다:
   방치 종결 7초는 첫 3번의 밀어올림으로 결정되므로 초반을 무르게 하면 그 예산이 깨진다. */

/* ---- 방치 종결은 시계가 아니라 스택이 맡는다 ----
   게이트 2는 입력이 없으면 약 8초 안에 끝날 것을 요구한다. 첫 게임(flux-sort)은 그걸
   플레이어의 제한시간으로 만족시켰다가 **실제 플레이도 7~10초에 끝났다** — 심사 세션 9/20.
   여기서는 손대지 않으면 저절로 나빠지는 상태(차오르는 스택)가 그 일을 한다:
   판은 9행으로 시작하고 여유는 3행뿐이라, 아무것도 안 하면 3번째 밀어올림에서 약 7.0초에 끝난다.
   그 대신 시계는 사람이 판을 읽을 만큼 넉넉히 준다. 게이트가 요구하는 것은
   "끝이 있다"이지 "빨리 끝난다"가 아니다. */
const COLS = 8, ROWS = 12, N = COLS * ROWS;
const START_ROWS = 9;       // 판 시작 시 채우는 행 수. 0행(킬존)은 비어 있어야 하므로 여유는 2행
const REFILL_ROWS = 4;      // 판을 완전히 비웠을 때 다시 채우는 행 수
const TIME_START = 26.0;
const TIME_CAP = 34.0;      // 잘해도 무한히 쌓이지는 않는다 — 시간이 남아돌면 긴장이 사라진다
const MISS_COST = 0.35;     // 혼자 있는 블록을 눌렀을 때 잃는 시간
const CLEAR_BONUS = 60;     // 판을 완전히 비웠을 때 (goal: clear-board)

// 색 다섯. 색만 다르면 색약인 사람에게는 같은 게임이라 점 개수를 두 번째 채널로 둔다.
// 점은 세기만 하면 되고 각도·회전에 영향받지 않는다 — 격자에 촘촘히 깔리는 작은 도형에서는
// 꼭짓점 수보다 개수가 훨씬 빨리 읽힌다(오각형과 육각형은 45px에서 구분되지 않았다).
const CH = [
  { c: '#00e5ff', rgb: '0,229,255',   pips: 1 },
  { c: '#ff2e88', rgb: '255,46,136',  pips: 2 },
  { c: '#ffb020', rgb: '255,176,32',  pips: 3 },
  { c: '#39ff8b', rgb: '57,255,139',  pips: 4 },
  { c: '#a97bff', rgb: '169,123,255', pips: 5 }
];
// 매 프레임 쓰는 색 문자열은 미리 만들어 둔다. 프레임마다 rgba를 이어 붙이면
// 60초 플레이에서 짧은 문자열이 수만 개 생겨 게이트 2의 힙 증가율에 잡음이 섞인다.
for (const ch of CH) {
  ch.body = ch.c;
  ch.dim = 'rgba(' + ch.rgb + ',.34)';
  ch.soft = 'rgba(' + ch.rgb + ',.16)';
}
const PIP_INK = 'rgba(5,7,14,.82)';   // 점은 어둡게. 다섯 색이 전부 밝아서 흰 점은 뭉갠다
// 점 배치. 주사위처럼 세면 되도록 1~5를 한눈에 다른 모양으로 둔다. (cell 배수, 중심 기준)
const PIPS = [
  [0, 0],
  [-0.40, 0, 0.40, 0],
  [-0.52, 0, 0, 0, 0.52, 0],
  [-0.40, -0.40, 0.40, -0.40, -0.40, 0.40, 0.40, 0.40],
  [-0.44, -0.44, 0.44, -0.44, 0, 0, -0.44, 0.44, 0.44, 0.44]
];

/* ---- 격자 ----
   전부 형식화 배열이다. 매 탭마다 덩어리 배열을 새로 만들면 60초 플레이에서
   힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다 — 도장(stamp) 방식으로 재사용한다. */
const cells = new Int8Array(N).fill(-1);   // -1 = 빈칸, 그 외 = CH 인덱스
const feed = new Int8Array(COLS);          // 다음에 올라올 행
const mark = new Int32Array(N);            // 플러드필 방문 도장
const stk = new Int32Array(N);             // 플러드필 스택
const grp = new Int32Array(N);             // 찾은 덩어리
const hov = new Int32Array(N);             // 미리보기용 덩어리 사본
let stamp = 0, grpN = 0, hovN = 0, hovCol = 0, hovGain = 0;

let elapsed = 0;
let timeLeft = TIME_START;
let riseT = 0;          // 다음 행까지의 진행도 0~1. 화면은 이 값만큼 위로 밀려 그려진다
let chain = 0;          // 연속 성공. 혼자 있는 블록을 누르면 끊긴다
let purges = 0;         // 이번 판에서 성공한 탭 수. 첫 성공 전에는 안내를 띄운다
let round = 0;          // 몇 번째 판인가. 판마다 시드를 어긋내 같은 배치가 반복되지 않게 한다
let annT = 0;           // 큰 알림(판 비움·대량 소거)이 떠 있는 시간
let annMsg = '';
let bgScroll = 0;       // 배경 격자 위상. 프레임 수가 아니라 시간에 비례해야
                        // 해상도와 프레임레이트가 달라도 같은 속도로 보인다
let pulse = 0;          // 경고·강조용 공용 위상

const overTitle = document.getElementById('overTitle');   // 끝나는 방식이 둘이라 제목이 바뀐다

// 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
// 매번 달라져 실패를 다시 만들어낼 수 없다 (FX가 같은 이유로 자체 시드를 쓴다).
let seed = 7717;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

/* ---- 포인터·키보드 ----
   프레임의 input(left/right/aimX)은 가로 한 축짜리라 '어느 칸을 눌렀나'를 표현할 수 없다.
   프레임을 고치는 대신 이 구역에서 자기 리스너를 더 단다 — 프레임의 핸들러는 그대로 살아 있고
   (타이틀·게임오버에서 탭하면 시작하는 동작이 거기서 온다), 손을 떼는 순간은 프레임이 이미
   부르고 있는 clearInput() 하나로 받는다. */
const ptr = { x: 0, y: 0 };
let ptrIn = false;      // 마우스가 캔버스 위에 있다 (호버 미리보기는 마우스 전용)
let armed = false;      // 판을 시작시킨 그 누름으로 곧바로 지워지지 않게 막는다
let kbActive = false;   // 키보드 커서를 쓰는 중인가
let kbArmed = false;
let kbR = ROWS - 3, kbC = COLS >> 1;

function ptrAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = clientX - rect.left - OX;   // 밴드 기준
  ptr.y = clientY - rect.top;
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;   // 터치는 아래에서 처리 (프레임과 같은 분기)
  ptrAt(e.clientX, e.clientY);
  ptrIn = true; kbActive = false;
  if (armed) purgeAt(ptr.x, ptr.y);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  ptrAt(e.clientX, e.clientY);
  ptrIn = true; kbActive = false;
});
// 커서가 캔버스를 벗어나면 미리보기도 사라져야 한다. 안 그러면 마지막으로 짚었던
// 덩어리가 화면에 강조된 채 남아 '지금 지울 수 있는 것'을 잘못 말한다.
canvas.addEventListener('pointerleave', () => { ptrIn = false; });
canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  ptrAt(t.clientX, t.clientY);
  ptrIn = false; kbActive = false;   // 손가락은 머무르지 않는다 — 누른 그 순간이 전부다
  if (armed) purgeAt(ptr.x, ptr.y);
}, { passive: false });

// 키보드로도 끝까지 놀 수 있어야 한다. 데스크톱에서 마우스만 받는 격자 게임은
// 손을 옮기지 않으면 못 하는데, 커서 한 칸이면 그 벽이 사라진다.
window.addEventListener('keydown', (e) => {
  if (state !== S.PLAYING) return;
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') { kbC = Math.max(0, kbC - 1); kbActive = true; ptrIn = false; }
  else if (k === 'ArrowRight' || k === 'KeyD') { kbC = Math.min(COLS - 1, kbC + 1); kbActive = true; ptrIn = false; }
  else if (k === 'ArrowUp' || k === 'KeyW') { kbR = Math.max(0, kbR - 1); kbActive = true; ptrIn = false; }
  else if (k === 'ArrowDown' || k === 'KeyS') { kbR = Math.min(ROWS - 1, kbR + 1); kbActive = true; ptrIn = false; }
  else if (k === 'Space' || k === 'Enter') {
    // 죽은 화면에서 누른 Space는 '새 판 시작'이지 '지우기'가 아니다. 프레임의 핸들러가
    // 먼저 start()를 부르고 나면 이 핸들러가 같은 이벤트로 곧장 한 덩어리를 지워버린다.
    if (!kbArmed) return;
    kbActive = true; ptrIn = false;
    const m = M();
    purgeAt(m.bx + (kbC + 0.5) * m.cell, m.by + (kbR + 0.5 - riseT) * m.cell);
  }
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') kbArmed = true; });

// 이 게임이 쓰는 입력 필드를 비운다. 구역 밖(start)에서 input을 직접 건드리면
// jump·fire 같은 필드를 쓰는 다음 게임이 "누른 채로 죽으면 다음 판이 움직인 채 시작"
// 버그를 조용히 물려받는다. 필드를 아는 쪽은 이 구역뿐이다.
// 프레임은 pointerup·pointercancel·touchend에서 이것을 부른다 — 즉 '손을 뗐다'가 여기로 들어온다.
function clearInput() {
  input.left = input.right = false;
  input.aimX = null;
  armed = true;
}

/* ---- 화면 치수 ----
   칸 크기를 화면의 짧은 쪽에서 파생한다. 픽셀 상수로 두면 큰 화면에서 판이 먼지처럼 작아진다.
   세로는 (ROWS + 1.8)칸이 필요하다: 판 ROWS칸 + 아래 피더 1칸 + 위 시간 막대 0.8칸.
   결과를 캐시한다: 이벤트 핸들러(purgeAt)도 M()을 부르므로 매번 새 객체를 만들면
   탭 한 번마다 쓰레기가 생긴다. */
let _m = null, _mW = -1, _mH = -1;
function M() {
  if (_m && _mW === W && _mH === H) return _m;
  const cell = Math.min(W * 0.90 / COLS, H * 0.96 / (ROWS + 1.8));
  const bw = cell * COLS, bh = cell * ROWS;
  const top = (H - cell * (ROWS + 1.8)) / 2;
  _m = {
    cell, bw, bh,
    bx: (W - bw) / 2,
    by: top + cell * 0.8,
    barY: top + cell * 0.14,
    barH: cell * 0.32,
    ceil: cell * 0.22,          // 판 위에 얹는 천장 띠의 두께. 판 안이 아니라 판 위다 — 아래 주석 참고
    gut: (W - bw) / 2,          // 좌우 여백. 넓으면 여기에 스택 게이지와 색 범례를 그린다
    headroom: top,              // 판 위쪽 여백. 넓으면 큰 시간 숫자를 얹는다
    line: Math.max(0.8, cell / 34),
    // ctx.font은 대입할 때마다 문자열을 파싱한다. 프레임마다 새로 이어 붙이면
    // 파싱 비용과 쓰레기가 같이 늘어난다 — 크기가 바뀔 때만 만든다
    fontHuge: '700 ' + Math.round(cell * 1.05) + 'px ui-sans-serif, system-ui, sans-serif',
    fontBig: '700 ' + Math.round(cell * 0.52) + 'px ui-sans-serif, system-ui, sans-serif',
    fontSmall: '700 ' + Math.round(cell * 0.30) + 'px ui-sans-serif, system-ui, sans-serif',
    fontTiny: '600 ' + Math.round(cell * 0.22) + 'px ui-sans-serif, system-ui, sans-serif'
  };
  _mW = W; _mH = H;
  return _m;
}

// 화면 좌표 → 칸 인덱스. 빈칸이거나 판 밖이면 -1.
// 가로로 한 칸까지는 붙여 준다: 폰에서 판이 화면 폭을 거의 다 쓰므로 가장자리 열은
// 손가락이 화면 밖으로 밀려 눌리기 쉽다.
function cellAt(m, px, py) {
  let c = Math.floor((px - m.bx) / m.cell);
  if (c < -1 || c > COLS) return -1;
  if (c < 0) c = 0; else if (c > COLS - 1) c = COLS - 1;
  const r = Math.floor((py - m.by) / m.cell + riseT);
  if (r < 0 || r >= ROWS) return -1;
  const i = r * COLS + c;
  return cells[i] >= 0 ? i : -1;
}

// 같은 종류로 이어진 덩어리를 찾는다. 결과는 grp[0..grpN-1].
// 재귀 대신 고정 스택을 쓴다 — 96칸이 전부 한 색이면 재귀 깊이가 96이 되고,
// 무엇보다 호출마다 배열을 새로 만들지 않아야 한다.
function findGroup(idx) {
  grpN = 0;
  const col = cells[idx];
  if (col < 0) return 0;
  stamp++;
  let sp = 0;
  stk[sp++] = idx; mark[idx] = stamp;
  while (sp > 0) {
    const i = stk[--sp];
    grp[grpN++] = i;
    const r = (i / COLS) | 0, c = i - r * COLS;
    let j;
    if (c > 0) { j = i - 1; if (mark[j] !== stamp && cells[j] === col) { mark[j] = stamp; stk[sp++] = j; } }
    if (c < COLS - 1) { j = i + 1; if (mark[j] !== stamp && cells[j] === col) { mark[j] = stamp; stk[sp++] = j; } }
    if (r > 0) { j = i - COLS; if (mark[j] !== stamp && cells[j] === col) { mark[j] = stamp; stk[sp++] = j; } }
    if (r < ROWS - 1) { j = i + COLS; if (mark[j] !== stamp && cells[j] === col) { mark[j] = stamp; stk[sp++] = j; } }
  }
  return grpN;
}

// 열마다 아래로 내려앉힌다. 힘이 아니라 위치 제약이므로 dt에 매달지 않는다 —
// '떠 있는 블록은 없다'는 상태의 조건이지 움직임이 아니다.
function collapse() {
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const v = cells[r * COLS + c];
      if (v < 0) continue;
      cells[w * COLS + c] = v;
      if (w !== r) cells[r * COLS + c] = -1;
      w--;
    }
    for (let r = w; r >= 0; r--) cells[r * COLS + c] = -1;
  }
}

const colorCount = () => Math.max(3, Math.min(CH.length, Math.floor(colorsAt(elapsed))));

function makeFeed() {
  const nc = colorCount();
  for (let c = 0; c < COLS; c++) feed[c] = (rnd() * nc) | 0;
}

function fillBoard(rowsN) {
  const nc = colorCount();
  cells.fill(-1);
  for (let r = ROWS - rowsN; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) cells[r * COLS + c] = (rnd() * nc) | 0;
}

// 한 행 밀어올린다. 맨 윗줄(0행)에 블록이 닿으면 그 순간이 끝이다.
// 0행은 판정선이자 경고 띠다 — 플레이 중에는 언제나 비어 있고, 여기 닿으면 판이 끝난다.
function pushRow() {
  for (let r = 0; r < ROWS - 1; r++) {
    const dst = r * COLS, src = dst + COLS;
    for (let c = 0; c < COLS; c++) cells[dst + c] = cells[src + c];
  }
  const base = (ROWS - 1) * COLS;
  for (let c = 0; c < COLS; c++) cells[base + c] = feed[c];
  makeFeed();
  hovN = 0;                    // 배치가 바뀌었다 — 미리보기는 다음 프레임에 다시 만든다
  const m = M();
  FX.shake(m.cell * 0.07);
  beep(110, 26);
  for (let c = 0; c < COLS; c++) {
    if (cells[c] < 0) continue;
    endRun(true);
    return true;
  }
  return false;
}

function announce(msg, sec) { annMsg = msg; annT = sec; }

// 혼자 있는 블록을 눌렀다. 빈칸이나 판 밖은 실수로 치지 않는다 —
// 아무 일도 일어나지 않는 곳을 눌러 시간을 잃으면 규칙을 배우는 동안 억울하다.
function miss(m, px, py) {
  chain = 0;
  timeLeft -= MISS_COST;
  FX.burst(px, py, '#ff4d4d', 9);
  FX.shake(m.cell * 0.10);
  FX.flash('#ff4d4d', 0.14, 0.16);
  beep(150, 80);
}

function purgeAt(px, py) {
  if (state !== S.PLAYING) return;
  const m = M();
  const idx = cellAt(m, px, py);
  if (idx < 0) return;
  const n = findGroup(idx);
  if (n < 2) { miss(m, px, py); return; }

  const col = cells[idx];
  chain++;
  purges++;
  const mult = 1 + Math.min(4, (chain / 3) | 0);
  score += n * (n - 1) * mult;
  timeLeft = Math.min(TIME_CAP, timeLeft + timeGainAt(elapsed) * n);
  hovN = 0;

  // 파편 수는 덩어리가 커질수록 블록당 줄인다. 20칸짜리를 블록당 8개로 터뜨리면
  // 풀(220)을 한 번에 다 쓰고 그 프레임의 다른 효과가 전부 지워진다.
  const per = n > 8 ? 4 : 8;
  for (let k = 0; k < n; k++) {
    const i = grp[k];
    const r = (i / COLS) | 0, c = i - r * COLS;
    const x = m.bx + (c + 0.5) * m.cell, y = m.by + (r + 0.5 - riseT) * m.cell;
    cells[i] = -1;
    FX.burst(x, y, CH[col].c, per);
    // 지워진 자리에 잠깐 남는 잔상. 무엇이 사라졌는지 눈이 따라갈 시간을 준다
    FX.trail(x, y, CH[col].c, m.cell * 0.8, m.cell * 0.8, 0.24);
  }
  FX.shake(m.cell * (0.06 + Math.min(0.34, n * 0.045)));
  FX.flash(CH[col].c, 0.13, Math.min(0.26, 0.06 + n * 0.022));
  beep(380 + Math.min(10, n) * 58, 42);
  if (n >= 7) announce('MASS PURGE  +' + (n * (n - 1) * mult), 1.1);

  collapse();

  // 판을 통째로 비우면 보너스. 이 게임의 목표(goal: clear-board)가 실제로 달성 가능한
  // 사건이어야 목표라고 부를 수 있다 — 스택이 낮아진 뒤를 노리는 진짜 수가 된다.
  let any = false;
  for (let i = 0; i < N; i++) if (cells[i] >= 0) { any = true; break; }
  if (!any) {
    score += CLEAR_BONUS * mult;
    timeLeft = Math.min(TIME_CAP, timeLeft + 4);
    announce('BOARD PURGED  +' + CLEAR_BONUS * mult, 1.6);
    FX.flash('#ffffff', 0.3, 0.4);
    FX.shake(m.cell * 0.5);
    beep(1180, 160);
    fillBoard(REFILL_ROWS);
  }
}

function endRun(overflowed) {
  const m = M();
  overTitle.textContent = overflowed ? 'STACK OVERFLOW' : 'TIME OUT';
  if (overflowed) {
    for (let c = 0; c < COLS; c++) FX.burst(m.bx + (c + 0.5) * m.cell, m.by + m.cell * 0.5, '#ff4d4d', 8);
  } else {
    FX.burst(m.bx + m.bw * 0.5, m.barY + m.barH * 0.5, '#ff9500', 30);
  }
  FX.shake(m.cell * 0.42);
  FX.flash(overflowed ? '#ff4d4d' : '#ff9500', 0.3, 0.55);
  gameOver();
}

function reset() {
  clearInput();
  armed = false;            // 시작을 누른 그 손가락이 곧바로 한 덩어리를 지우는 것을 막는다
  kbArmed = false;
  elapsed = 0;
  timeLeft = TIME_START;
  riseT = 0;
  chain = 0;
  purges = 0;
  hovN = 0;
  annT = 0;
  kbR = ROWS - 3; kbC = COLS >> 1;
  round++;
  // 판마다 시드를 어긋낸다. 모든 판이 같으면 플레이어는 두 판째에 배치를 외우고,
  // 심사용 스크린샷 10장도 같은 장면 몇 개로 접힌다. 난수가 아니라 판 번호로 어긋내므로
  // 같은 판은 언제나 같은 배치다.
  seed = (7717 + round * 26497 + DAY_SEED) >>> 0;
  fillBoard(START_ROWS);
  makeFeed();
  const m = M();
  FX.burst(m.bx + m.bw * 0.5, m.by + m.bh * 0.75, '#00e5ff', 20);
  FX.flash('#00e5ff', 0.16, 0.2);
}

function step(m, dt) {
  elapsed += dt;
  // 시작 직후의 짧은 무장 대기. 손을 떼는 이벤트가 오지 않는 경로(버튼 클릭·자동 시작)에서도
  // 첫 탭이 먹히게 한다. 이게 없으면 판을 시작한 뒤 첫 한 번이 통째로 씹힌다.
  if (!armed && elapsed > 0.25) armed = true;
  if (!kbArmed && elapsed > 0.25) kbArmed = true;
  if (annT > 0) annT -= dt;

  timeLeft -= drainAt(elapsed) * dt;
  if (timeLeft <= 0) { timeLeft = 0; endRun(false); return; }

  riseT += riseAt(elapsed) * dt;
  // while로 도는 이유: 프레임이 길게 튀면 한 프레임에 두 행이 올라와야 한다.
  // if로 두면 남은 riseT가 1을 넘은 채 다음 프레임으로 넘어가 그림이 판 밖으로 나간다.
  while (riseT >= 1) {
    riseT -= 1;
    if (pushRow()) return;
  }

  // 미리보기는 매 프레임 다시 만든다. 커서가 가만히 있어도 스택이 올라오므로
  // 커서 밑의 칸이 바뀐다 — 한 번 계산해 두면 곧 거짓말이 된다.
  hovN = 0;
  if (ptrIn || kbActive) {
    const idx = kbActive
      ? cellAt(m, m.bx + (kbC + 0.5) * m.cell, m.by + (kbR + 0.5 - riseT) * m.cell)
      : cellAt(m, ptr.x, ptr.y);
    if (idx >= 0) {
      const n = findGroup(idx);
      if (n >= 2) {
        for (let k = 0; k < n; k++) hov[k] = grp[k];
        hovN = n;
        hovCol = cells[idx];
        hovGain = n * (n - 1) * (1 + Math.min(4, (chain / 3) | 0));
      }
    }
  }
}

/* ---- 그리기 ---- */

// 블록 하나. 색 + 점 개수 두 채널로 종류를 말한다.
function drawBlock(x, y, s, ci, alpha) {
  const g = s * 0.07, w = s - g * 2;
  const C = CH[ci];
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = C.body;
  ctx.fillRect(x + g, y + g, w, w);
  // 위는 밝게, 아래는 어둡게. 단색 사각형에 두께가 생겨 격자가 판때기로 보이지 않는다
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  ctx.fillRect(x + g, y + g, w, s * 0.10);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fillRect(x + g, y + s - g - s * 0.10, w, s * 0.10);
  const p = PIPS[C.pips - 1], ps = s * 0.075, cx = x + s * 0.5, cy = y + s * 0.5, sp = s * 0.30;
  ctx.fillStyle = PIP_INK;
  for (let k = 0; k < p.length; k += 2) ctx.fillRect(cx + p[k] * sp - ps, cy + p[k + 1] * sp - ps, ps * 2, ps * 2);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

// 배경은 클립 밖에서 그린다 — 밴드가 아니라 화면 전체를 덮는다.
// 가로 창에서 여백이 검게 비면 순수 레터박스가 되고, 그 그림이 포털 썸네일에 박힌다.
function backdrop(m, dt) {
  // 위상은 여기서 진행시킨다 — backdrop은 모든 상태에서 매 프레임 불리므로
  // 타이틀·일시정지·게임오버 화면에서도 배경이 흐른다
  // (게이트 1의 motion은 어디서 찍어도 0이 아니어야 한다).
  bgScroll = (bgScroll + m.cell * 0.5 * dt) % m.cell;

  const L = -OX, R = SW - OX;      // 화면 좌우 끝을 밴드 좌표로 옮긴 값
  ctx.fillStyle = '#070912';
  ctx.fillRect(L, 0, SW, H);

  // 배경 격자. 판과 같은 방향(위)으로 흐른다 — 화면 전체가 '밀려 올라가는 중'으로 읽힌다
  ctx.strokeStyle = 'rgba(0,229,255,.07)';
  ctx.lineWidth = m.line;
  ctx.beginPath();
  for (let y = H - bgScroll; y > -m.cell; y -= m.cell) { ctx.moveTo(L, y); ctx.lineTo(R, y); }
  // 세로선은 밴드의 격자를 양쪽으로 이어 붙인다 — 여백에서 따로 시작하면
  // 밴드 경계에서 간격이 어긋나 이음매가 보인다.
  const x0 = (W % m.cell) * 0.5;
  for (let x = x0 - Math.ceil((x0 - L) / m.cell) * m.cell; x < R; x += m.cell) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  ctx.stroke();
}

function draw(m, dt) {
  pulse += dt;

  // 스택 높이를 먼저 구한다. 경고 연출과 좌측 게이지가 같은 값을 봐야 한다
  let topRow = ROWS;
  for (let i = 0; i < N; i++) if (cells[i] >= 0) { topRow = (i / COLS) | 0; break; }
  const headroom = topRow - 1;                       // 0행은 킬존이므로 1행까지가 여유
  const danger = headroom <= 0 ? 1 : headroom <= 1 ? 0.75 : headroom <= 2 ? 0.45 : 0.15;

  // 판 바닥. 격자보다 조금 밝아서 '여기가 판이다'가 먼저 읽힌다
  ctx.fillStyle = 'rgba(0,229,255,.035)';
  ctx.fillRect(m.bx, m.by, m.bw, m.bh);
  ctx.strokeStyle = 'rgba(0,229,255,.30)';
  ctx.lineWidth = m.line * 2;
  ctx.strokeRect(m.bx, m.by, m.bw, m.bh);

  const kp = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(pulse * (3 + danger * 6)));

  // ---- 블록 ----
  // 행은 riseT만큼 위로 밀려 그려진다. 밀어올림 순간 인덱스가 하나 줄고 riseT가 1→0으로
  // 돌아가므로 두 변화가 서로를 상쇄해 그림은 끊기지 않는다.
  for (let r = 0; r < ROWS; r++) {
    const y = m.by + (r - riseT) * m.cell;
    const base = r * COLS;
    for (let c = 0; c < COLS; c++) {
      const v = cells[base + c];
      if (v < 0) continue;
      drawBlock(m.bx + c * m.cell, y, m.cell, v, 1);
    }
  }

  // 피더 — 다음에 올라올 행. 판 아래에서 밀려 들어오며 점점 또렷해진다.
  // 미리 보여주지 않으면 새 행이 갑자기 나타나고, 그러면 계획이라는 게 성립하지 않는다.
  const fy = m.by + (ROWS - riseT) * m.cell;
  for (let c = 0; c < COLS; c++) drawBlock(m.bx + c * m.cell, fy, m.cell, feed[c], 0.28 + riseT * 0.42);
  ctx.strokeStyle = 'rgba(232,246,255,.14)';
  ctx.lineWidth = m.line;
  ctx.beginPath();
  ctx.moveTo(m.bx, m.by + m.bh); ctx.lineTo(m.bx + m.bw, m.by + m.bh);
  ctx.stroke();

  // ---- 천장 ----
  // 판 '안'이 아니라 판 '위'에 그린다. 처음에는 맨 윗행 칸을 통째로 빗금 킬존으로 칠했는데,
  // 블록은 죽기 직전 한 칸 동안 바로 그 칸을 지나므로 "죽음의 구역 안에 멀쩡히 살아 있는 블록"이
  // 화면에 그대로 찍혔다 (실측: 심사용 스크린샷 10장 중 4장). 죽는 조건은 넓이가 아니라 선이다 —
  // 블록이 판 위쪽 모서리에 닿는 순간. 그러니 선으로 그리고, 블록보다 나중에 그려 늘 위에 둔다.
  const cy0 = m.by - m.ceil;
  ctx.save();
  ctx.beginPath();
  ctx.rect(m.bx, cy0, m.bw, m.ceil);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,77,77,.12)';
  ctx.fillRect(m.bx, cy0, m.bw, m.ceil);
  ctx.strokeStyle = 'rgba(255,77,77,.30)';
  ctx.lineWidth = m.line * 2.5;
  ctx.beginPath();
  for (let x = -m.ceil; x < m.bw + m.ceil; x += m.cell * 0.42) {
    ctx.moveTo(m.bx + x, m.by);
    ctx.lineTo(m.bx + x + m.ceil, cy0);
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 0.4 + danger * 0.6 * kp;
  ctx.fillStyle = '#ff4d4d';
  ctx.fillRect(m.bx, m.by - m.line * 1.6, m.bw, m.line * 3);
  ctx.globalAlpha = 1;

  // ---- 지울 수 있는 덩어리 미리보기 ----
  // 어디를 누르면 무엇이 사라지는지 누르기 전에 보여준다. 격자 퍼즐에서 이게 없으면
  // 플레이어는 매번 '눌러 보고' 배워야 하고, 그 학습 비용이 전부 오조작으로 나온다.
  if (hovN >= 2 && state === S.PLAYING) {
    const glow = 0.55 + 0.45 * Math.sin(pulse * 7);
    let hx = 0, hy = H, minY = H;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = m.line * 2.2;
    for (let k = 0; k < hovN; k++) {
      const i = hov[k];
      if (cells[i] < 0) continue;
      const r = (i / COLS) | 0, c = i - r * COLS;
      const x = m.bx + c * m.cell, y = m.by + (r - riseT) * m.cell;
      // 덧칠은 옅게. 진하게 칠했더니 고른 덩어리가 흰색이 되어 무슨 색을 지우는지가
      // 정작 누르기 직전에 사라졌다 — 강조는 테두리가 하고, 면은 색을 지켜야 한다
      ctx.globalAlpha = 0.10 + glow * 0.14;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + m.cell * 0.07, y + m.cell * 0.07, m.cell * 0.86, m.cell * 0.86);
      ctx.globalAlpha = 0.55 + glow * 0.45;
      ctx.strokeRect(x + m.cell * 0.07, y + m.cell * 0.07, m.cell * 0.86, m.cell * 0.86);
      if (y < minY) { minY = y; hx = x + m.cell * 0.5; hy = y; }
    }
    ctx.globalAlpha = 1;
    // 이 덩어리가 줄 점수. 큰 덩어리를 참고 기다리는 이유를 숫자로 보여준다
    ctx.fillStyle = CH[hovCol].c;
    ctx.font = m.fontSmall;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('+' + hovGain, hx, hy - m.cell * 0.12);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // 키보드 커서. 키를 쓰기 전에는 그리지 않는다 — 마우스로 노는 사람 화면에
  // 정체를 알 수 없는 네모가 하나 떠 있으면 안 된다
  if (kbActive && state === S.PLAYING) {
    const x = m.bx + kbC * m.cell, y = m.by + (kbR - riseT) * m.cell;
    ctx.strokeStyle = 'rgba(232,246,255,.85)';
    ctx.lineWidth = m.line * 2;
    ctx.strokeRect(x + m.line, y + m.line, m.cell - m.line * 2, m.cell - m.line * 2);
  }

  // ---- 시간 막대 ----
  const tf = Math.max(0, Math.min(1, timeLeft / TIME_CAP));
  ctx.fillStyle = 'rgba(232,246,255,.10)';
  ctx.fillRect(m.bx, m.barY, m.bw, m.barH);
  ctx.fillStyle = timeLeft < 4 ? '#ff4d4d' : timeLeft < 8 ? '#ffb020' : '#00e5ff';
  ctx.fillRect(m.bx, m.barY, m.bw * tf, m.barH);
  ctx.strokeStyle = 'rgba(232,246,255,.22)';
  ctx.lineWidth = m.line;
  ctx.strokeRect(m.bx, m.barY, m.bw, m.barH);
  // 배수는 막대 오른쪽 끝에. 연속으로 지우면 여기 숫자가 올라간다
  if (chain >= 3) {
    ctx.fillStyle = '#00e5ff';
    ctx.font = m.fontSmall;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('x' + (1 + Math.min(4, (chain / 3) | 0)), m.bx + m.bw, m.barY - m.cell * 0.06);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // 남는 공간에만 그리는 것들 — 폰(위아래가 남는다)과 데스크톱(좌우가 남는다)이
  // 서로 다른 여백을 갖는다. 한쪽 배치로 고정하면 다른 쪽에서 화면이 텅 빈다.
  if (m.headroom > m.cell * 1.5) {
    ctx.fillStyle = timeLeft < 4 ? 'rgba(255,77,77,.85)' : 'rgba(232,246,255,.40)';
    ctx.font = m.fontHuge;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(timeLeft.toFixed(1), W * 0.5, m.headroom * 0.5);
    ctx.font = m.fontTiny;
    ctx.fillStyle = 'rgba(232,246,255,.35)';
    ctx.fillText('SECONDS', W * 0.5, m.headroom * 0.5 + m.cell * 0.72);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }
  if (m.gut > m.cell * 2.2) {
    // 왼쪽: 스택 게이지. 남은 여유가 몇 칸인지 판을 안 세어도 보인다
    const gx = m.bx - m.cell * 1.35, gw = m.cell * 0.5;
    ctx.font = m.fontTiny;
    ctx.fillStyle = 'rgba(232,246,255,.40)';
    ctx.textAlign = 'center';
    ctx.fillText('STACK', gx + gw * 0.5, m.by - m.cell * 0.25);
    for (let r = 0; r < ROWS; r++) {
      const filled = r >= topRow;
      const y = m.by + r * m.cell + m.cell * 0.12;
      ctx.fillStyle = filled ? (r <= 2 ? '#ff4d4d' : '#00e5ff') : 'rgba(232,246,255,.10)';
      ctx.globalAlpha = filled ? 0.85 : 1;
      ctx.fillRect(gx, y, gw, m.cell * 0.76);
      ctx.globalAlpha = 1;
    }
    // 오른쪽: 색 범례. 다섯 종류가 각각 점 몇 개인지 판 밖에 고정해 둔다
    const lx = m.bx + m.bw + m.cell * 0.7, ls = m.cell * 0.72;
    const ly = m.by + (m.bh - CH.length * ls * 1.35) * 0.5;
    ctx.fillStyle = 'rgba(232,246,255,.40)';
    ctx.fillText('MATCH 2+', lx + ls * 0.5, ly - m.cell * 0.25);
    ctx.textAlign = 'start';
    for (let i = 0; i < CH.length; i++) drawBlock(lx, ly + i * ls * 1.35, ls, i, 0.9);
  } else if (m.headroom > m.cell * 1.1) {
    // 세로가 남는 폰 배치. 좌우에 여백이 없으니 범례를 판 아래 띠로 눕힌다.
    // 색약인 사람에게 점 개수가 두 번째 채널이라는 것을 어딘가에서는 말해야 하는데,
    // 그 자리가 화면마다 다르다 — 폰에서는 아래, 데스크톱에서는 오른쪽 여백이다.
    const ls = m.cell * 0.62, gap = ls * 1.5;
    const y0 = m.by + m.bh + m.cell + (m.headroom - ls) * 0.5;
    const x0 = W * 0.5 - (CH.length * gap - (gap - ls)) * 0.5;
    for (let i = 0; i < CH.length; i++) drawBlock(x0 + i * gap, y0, ls, i, 0.85);
    ctx.font = m.fontTiny;
    ctx.fillStyle = 'rgba(232,246,255,.42)';
    ctx.textAlign = 'center';
    ctx.fillText('MATCH 2+ OF THE SAME KIND', W * 0.5, y0 + ls + m.cell * 0.38);
    ctx.textAlign = 'start';
  }

  // 큰 알림. 대량 소거·판 비움처럼 드문 사건만 여기로 온다 —
  // 흔한 사건까지 띄우면 화면 한가운데가 계속 깜빡여 판이 안 보인다
  if (annT > 0) {
    ctx.globalAlpha = Math.min(1, annT * 2.2);
    ctx.fillStyle = '#e8f6ff';
    ctx.font = m.fontBig;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(annMsg, W * 0.5, m.by + m.bh * 0.42);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  } else if (state === S.PLAYING && purges === 0 && elapsed < 3.5) {
    // 규칙 한 줄은 판 시작 3.5초 동안만. 처음에는 '첫 성공 전까지'로 뒀는데,
    // 못 맞히는 판에서는 그 문구가 판이 끝날 때까지 화면 한가운데 남았다.
    // 블록 위에 흰 글씨를 얹으면 읽히지도 않으므로 받침을 깔고 쓴다.
    ctx.font = m.fontSmall;
    const tw = ctx.measureText('TAP TWO OR MORE THAT MATCH').width;
    ctx.globalAlpha = Math.min(1, (3.5 - elapsed) * 2) * (0.75 + 0.25 * Math.sin(pulse * 3));
    ctx.fillStyle = 'rgba(5,7,14,.86)';
    ctx.fillRect(W * 0.5 - tw * 0.5 - m.cell * 0.3, m.by + m.bh * 0.34 - m.cell * 0.34,
                 tw + m.cell * 0.6, m.cell * 0.68);
    ctx.fillStyle = '#e8f6ff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TAP TWO OR MORE THAT MATCH', W * 0.5, m.by + m.bh * 0.34);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  // 위험할수록 화면 가장자리가 붉어진다. 판을 보고 있어도 주변시로 읽힌다
  if (danger > 0.4) {
    ctx.globalAlpha = (danger - 0.4) * 0.5 * kp;
    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(0, 0, W, m.cell * 0.5);
    ctx.fillRect(0, H - m.cell * 0.5, W, m.cell * 0.5);
    ctx.globalAlpha = 1;
  }
}

// 타이틀 화면에도 판이 차 있어야 한다. 첫 화면이 빈 격자면 이 게임이 무엇인지
// 한 장으로 설명할 수 없다 (심사용 스크린샷도 그 상태로 찍힌다).
fillBoard(START_ROWS);
makeFeed();
/* ===== GAME LOGIC 끝 ===== */

/* ---------- 상태 전이 ---------- */
function start() {
  score = 0;
  el.score.textContent = '0';
  el.title.hidden = true;
  el.over.hidden = true;
  reset();
  state = S.PLAYING;
  Portal.gameplayStart();
}
function pause() { if (state === S.PLAYING) state = S.PAUSED; }
function resume() { if (state === S.PAUSED) state = S.PLAYING; }
function gameOver() {
  state = S.OVER;
  beep(160, 180);
  Portal.gameplayStop();
  if (score > best) { best = score; saveBest(best); }
  if (score > today) { today = score; saveToday(today); }
  el.best.textContent = today;
  el.finalScore.textContent = score;
  el.over.hidden = false;
}

/* ---------- 루프 ---------- */
let last = 0;
function frame(now) {
  // dt 상한 0.05는 장식이 아니라 상태 보호다. 상승 속도 상한 0.92행/초와 곱하면
  // 프레임당 0.046행이라 한 프레임에 두 행이 올라오는 일은 없다. 상한을 1.09 이상으로
  // 올리거나 상승 상한을 올리면 riseT가 한 프레임에 1을 넘어 밀어올림이 밀린다 —
  // step()의 while 루프가 그 경우를 받아내지만, 그때는 두 행이 한꺼번에 나타나 눈이 못 따라간다.
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  tick++;
  const m = M();               // 프레임당 한 번만 만든다 (step·draw가 같은 값을 본다)
  if (state === S.PLAYING) {
    step(m, dt);
    el.score.textContent = score;
  }
  // FX는 모든 상태에서 돈다 — 죽은 뒤에도 파편과 흔들림이 끝까지 재생돼야
  // 사망이 '멈춤'이 아니라 '사건'으로 보인다.
  FX.update(dt);
  FX.begin(ctx);
  backdrop(m, dt);             // 화면 전체 — 클립 밖
  ctx.save();                  // 여기부터 밴드 안에서만 그린다
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  draw(m, dt);
  FX.draw(ctx);
  ctx.restore();
  FX.end(ctx);                 // 플래시는 클립 밖 — 화면 전체를 덮는다
  requestAnimationFrame(frame);
}

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ---------- */
window.__GAME__ = {
  api: 1,
  day: DAILY_NO,          // 오늘의 판 번호. 공유 문구가 이걸 쓴다
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  // 플레이 밴드. 게이트가 가로 뷰포트에서 이 비율을 재서 난이도가 창 모양에
  // 끌려가지 않는지 판정한다. 공식만 고치면 같은 결함이 다시 들어온다 — 축을 남긴다.
  get field() { return { x: OX, w: W, h: H, screenW: SW }; },
  start, pause, resume
};

/* 타이틀 화면에 오늘 판 번호를 적는다. HTML이 아니라 여기서 넣는 이유는
   게임 8개의 오버레이를 각각 고치면 반드시 한 곳이 달라지기 때문이다. */
(function () {
  const t = document.getElementById('titleScreen');
  if (!t) return;
  const p = document.createElement('p');
  p.id = 'dailyTag';
  p.style.cssText = 'font-size:12px;letter-spacing:.1em;opacity:.7;color:var(--neon);margin:0';
  // "DAILY"는 횟수 제한으로 읽힌다. 실제로는 코스가 정해져 있을 뿐 몇 판이든 할 수 있고,
  // 그 오해는 이 문구를 만든 사람조차 했다 — 처음 온 사람은 반드시 한다.
  p.textContent = "TODAY'S BOARD #" + DAILY_NO + " \u2014 same for everyone, replay as often as you like";
  t.insertBefore(p, t.querySelector('.btn'));
})();

resize();
// SDK가 거부하거나 던져도 루프는 시작한다. 여기서 멈추면 화면이 영원히 검은 채로 남는데,
// 포털 빌드에서 그게 가장 나쁜 실패다 — 광고 SDK 하나 때문에 게임이 아예 안 뜬다.
const startLoop = () => requestAnimationFrame(frame);
try {
  Portal.ready().then(startLoop, startLoop);
} catch {
  startLoop();
}
</script>
</body>
