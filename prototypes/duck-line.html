<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duck Line — prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #061018; overflow: hidden;
    font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe9ff;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #hud { height: 38px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; letter-spacing: .08em; }
  #hud b { color: #ffe27d; font-weight: 700; }
  #c { display: block; width: 100%; height: calc(100% - 38px); touch-action: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(6,16,24,.97) 60%, rgba(6,16,24,0));
    display: none; flex-direction: column; gap: 10px; align-items: center; }
  #panel.on { display: flex; }
  #verdict { font-size: 21px; letter-spacing: .04em; color: #ffe27d; text-align: center; }
  #row2 { font-size: 19px; letter-spacing: .10em; }
  #sub { opacity: .65; text-align: center; line-height: 1.5; }
  .btn { font: inherit; letter-spacing: .08em; padding: 11px 18px; border-radius: 8px;
    border: 1px solid #2c4a6b; background: #0d1c28; color: #cfe9ff; cursor: pointer; }
  .btn.go { border-color: #ffe27d; color: #ffe27d; }
  #row { display: flex; gap: 8px; }
</style>
</head>
<body>

<div id="hud"><span id="title">TODAY'S POND <b id="no">#1</b></span><span id="count">🐥 <b id="n">0</b>/<span id="tot">12</span></span></div>
<canvas id="c"></canvas>

<div id="panel">
  <div id="verdict"></div>
  <div id="row2"></div>
  <div id="sub"></div>
  <div id="row">
    <button class="btn go" id="shareBtn">COPY RESULT</button>
    <button class="btn" id="againBtn">PRACTICE →</button>
  </div>
</div>

<script>
/* ============================================================
   Duck Line — 오리 줄 세우기. 재미 확인용 프로토타입.
   빌드·게이트·SEO 밖이다. 프레임에서 가져온 것은 BAND 관례와 DAY 시드 규칙뿐이다.

   설계에서 잠근 것 셋:
     1. 줄이 곧 점수이자 공유물이다 — 화면이 그대로 결과 그림이 된다
     2. 부딪히면 그 자리서 끝. 방치하면 7초 안에 박는다 →
        게이트의 방치 종결을 '플레이어 제한시간' 없이 만족시킨다 (flux-sort 함정 회피)
     3. 연못 끝에 골이 있다. 잘하면 "집에 데려왔다", 못하면 "가다 박았다" —
        판 길이를 시계가 아니라 실력이 정한다
   ============================================================ */

const SLUG = 'duck-line';
const DAY_ZERO = Math.floor(Date.UTC(2026, 7, 1) / 86400000);
const DAY = (() => {
  const q = new URLSearchParams(location.search).get('day');
  if (q !== null) return Math.max(0, parseInt(q, 10) || 0);
  if (location.protocol === 'file:') return 0;
  const d = new Date();
  return Math.max(0, Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) - DAY_ZERO);
})();
const DAILY_NO = DAY + 1;

/* ---------- 캔버스 · 플레이 밴드 ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BAND = 390 / 806;
let W = 0, H = 0, SW = 0, OX = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  SW = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  W = Math.min(SW, Math.round(H * BAND));
  OX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, OX * dpr, 0);
}
window.addEventListener('resize', resize);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 연못 ----------
   위로 흐르는 세로 코스. 거리는 '화면 높이 몇 개분'으로 센다.
   새끼 15마리와 장난감이 거리 위에 흩뿌려져 있고, 배치는 날짜 시드가 정한다. */
/* 연못 길이가 곧 방치 종결 시간이다. 부딪혀도 안 끝나게 바꾼 순간(새끼가 떨어질 뿐),
   방치한 엄마가 직진하며 새끼를 계속 다시 주워서 "줄이 빈 채로 박는" 조건에 영영 안 걸렸다
   — 실측에서 25초까지 살아 있었다.
   새끼 배치를 비틀어 막는 길도 있었지만 그건 lantern-keeper가 했다가 유일한 득점 경로를
   막은 실수다. 대신 코스에 끝을 두고 그 끝을 게이트 예산 안에 넣는다:
   6.5 / 0.42 = 약 15.5초. 골에 닿는 것도 정당한 종결이다. */
const POND_LEN = 6.5;
const CHICKS = 12;
const SPEED = 0.42;         // 화면 높이/초. 아래로 흐르는 속도

let pond = null, mode = 'daily';

function makePond(seed) {
  const r = mulberry32(seed);
  const chicks = [];
  for (let i = 0; i < CHICKS; i++) {
    // 균등하게 퍼뜨리되 좌우는 흩는다. 처음엔 |sin| 을 썼다가 One Shot에서
    // ±1 근처에 몰리는 것을 겪었으므로 그냥 난수로 둔다.
    chicks.push({ d: 0.9 + (i + r() * 0.7) * (POND_LEN - 1.6) / CHICKS, x: 0.14 + r() * 0.72, got: false });
  }
  const toys = [];
  // 첫 장난감은 반드시 6~7초 안에 온다 — 방치 종결이 게이트 예산 안에 들어와야 한다.
  // 뒤로 갈수록 촘촘해진다. 상한은 두지 않는다: 한 축은 끝까지 천천히 올라야
  // 후반이 고착되지 않는다(pulse-lock의 교훈).
  let d = 2.4;
  let i = 0;
  while (d < POND_LEN - 0.6) {
    toys.push({ d, x: 0.10 + r() * 0.80, drift: (r() * 2 - 1) * 0.10, kind: i % 3 });
    d += 0.95 - Math.min(0.35, i * 0.06);
    i++;
  }
  /* 새끼 몇 마리를 공 바로 옆에 붙인다 — "저건 포기할까"를 만드는 유일한 장치다.
     전부 안전한 자리에 흩어두면 무조건 다 먹는 게 정답이라 선택이 사라진다.
     공보다 살짝 뒤(d가 큰 쪽)에 두어야 '지나치면서 스치는' 자리가 된다. */
  for (let k = 0; k < chicks.length; k += 3) {
    const t = toys[Math.floor(r() * toys.length)];
    if (!t) break;
    chicks[k].d = t.d + 0.10 + r() * 0.16;
    chicks[k].x = Math.max(0.10, Math.min(0.90, t.x + (r() < 0.5 ? -1 : 1) * (0.13 + r() * 0.05)));
    chicks[k].risky = true;
  }

  // 수련잎 — 판정에 관여하지 않는 장식이다. 이게 있어야 '연못'으로 읽힌다.
  // 판정 있는 것(장난감)과 헷갈리면 안 되므로 색을 확실히 다르게 두고 훨씬 크게 그린다.
  const pads = [];
  for (let i = 0; i < 26; i++) {
    pads.push({
      d: r() * (POND_LEN + 1) - 0.5,
      x: r() < 0.5 ? 0.02 + r() * 0.16 : 0.82 + r() * 0.16,   // 가장자리 쪽에 둔다 — 길을 막지 않는다
      r: 0.055 + r() * 0.05,
      rot: r() * 6.28,
      flip: r() < 0.5
    });
  }
  // 둔치의 갈대. 좌우 끝에서만 자란다
  const reeds = [];
  for (let i = 0; i < 40; i++) {
    reeds.push({ d: r() * (POND_LEN + 1) - 0.5, side: r() < 0.5 ? 0 : 1, h: 0.03 + r() * 0.045, lean: (r() * 2 - 1) * 0.5 });
  }
  return { chicks, toys, pads, reeds };
}

/* ---------- 상태 ---------- */
const S = { PLAY: 0, DONE: 1 };
let state = S.PLAY;
const mom = { x: 0.5, vx: 0 };
let dist = 0, elapsed = 0, line = 0, result = null;
let inv = 0, lost = 0;      // 무적 잔여시간 · 이번 판에 떨어뜨린 수
// 소리는 프로토타입에서 안 쓴다. 프레임에 올릴 때 beep()으로 바뀌는 자리다.
function beepish() {}
let path = [];              // 엄마가 지나온 자취. 새끼가 이걸 따라온다
let aimX = null, keyL = false, keyR = false;
const parts = [];
let shakeAmp = 0, flashT = 0, hintT = 0;

function reset(seed) {
  pond = makePond(seed);
  mom.x = 0.5; mom.vx = 0;
  dist = 0; elapsed = 0; line = 0; result = null; inv = 0; lost = 0;
  path = []; parts.length = 0;
  state = S.PLAY;
  aimX = null; hintT = 0;
  panel.classList.remove('on');
  document.getElementById('title').innerHTML = mode === 'daily'
    ? "TODAY'S POND <b>#" + DAILY_NO + '</b>' : 'PRACTICE <b>·</b>';
  paintCount();
}
function paintCount() { document.getElementById('n').textContent = line; }

/* ---------- 조작감 ----------
   가속·마찰을 두는 이유: 즉시 반응하면 줄이 뻣뻣하게 꺾여 '오리 떼'로 안 보인다.
   엄마가 관성으로 돌아야 뒤따르는 줄이 곡선을 그린다 — 이 게임의 그림 전부가 거기서 나온다. */
const ACC = 5.2, FRIC = 6.0, MAXV = 1.35;
function steer(dt) {
  let want = 0;
  if (aimX !== null) want = Math.max(-1, Math.min(1, (aimX - mom.x) * 7));
  else want = (keyR ? 1 : 0) - (keyL ? 1 : 0);
  /* 줄이 길수록 둔해진다. 많이 모을수록 위험해져야 '더 먹을까'가 선택이 된다 —
     이게 없으면 새끼는 그냥 무조건 먹는 게 이득이라 고민할 거리가 없다.
     0.45 아래로는 안 내려간다: 조작이 죽으면 벌이 아니라 고장으로 느껴진다. */
  const drag = Math.max(0.55, 1 - line * 0.035);
  mom.vx += want * ACC * drag * dt;
  mom.vx -= mom.vx * Math.min(1, FRIC * dt);
  mom.vx = Math.max(-MAXV * drag, Math.min(MAXV * drag, mom.vx));
  mom.x += mom.vx * dt;
  if (mom.x < 0.06) { mom.x = 0.06; mom.vx = 0; }
  if (mom.x > 0.94) { mom.x = 0.94; mom.vx = 0; }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = H * (0.10 + Math.random() * 0.38);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - H * 0.08,
                 t: 0.5 + Math.random() * 0.4, m: 0.5 + Math.random() * 0.5, c: color });
  }
  if (parts.length > 240) parts.splice(0, parts.length - 240);
}

/* 화면 좌표: 거리 d 에 있는 것이 지금 화면 어디에 있나.
   엄마는 화면 아래쪽 고정선(0.78H)에 있고 세상이 내려온다. */
const MOM_Y = 0.78;
function screenY(d) { return (MOM_Y + (dist - d)) * H; }

/* 줄에서 idx번째 새끼가 지금 어디 있나. step과 draw가 같은 값을 봐야 한다 —
   그리기에서만 계산하면 '보이는 자리'와 '맞는 자리'가 어긋나고,
   꼬리 판정이 들어온 지금은 그게 곧 "안 닿았는데 떨어졌다"가 된다. */
const GAPD = 0.052;                        // 새끼 사이 거리(화면 높이 비율)

/* ⚠ 자취를 되짚게 만들면 안 된다.
   처음엔 엄마가 지나온 path를 그대로 따라가게 했는데, 그러면 **엄마가 피한 것은
   꼬리도 영원히 안 맞는다.** 꼬리 판정을 넣어도 아무 일이 안 일어나서, 실측에서
   탐욕형 봇이 11마리를 0손실로 가져갔다 — 위험을 감수할 이유가 없는 게임이었다.

   대신 앞사람을 향해 '지연 추종'시킨다. 그러면 꺾는 순간 뒤가 안쪽으로 질러 들어가
   방금 피한 공을 줄이 쓸고 지나간다. 오리 떼가 실제로 그렇게 움직이기도 한다. */
const FOLLOW = 5.5;                        // 클수록 뻣뻣하게 따라온다(=코너를 덜 지른다)
function followStep(dt) {
  const ordered = pond.chicks.filter(c => c.got).sort((a, b) => a.idx - b.idx);
  let leadX = mom.x;
  for (const c of ordered) {
    if (c.cx === undefined) c.cx = leadX;
    c.cx += (leadX - c.cx) * Math.min(1, FOLLOW * dt);
    leadX = c.cx;
  }
}
function chickWorld(idx) {
  const c = pond.chicks.find(k => k.got && k.idx === idx);
  return { x: c && c.cx !== undefined ? c.cx : mom.x, d: dist - GAPD * (idx + 1) };
}

/* 맞은 지점부터 뒤를 통째로 끊는다. 뒤쪽만 잃어야 '떨어져 나갔다'로 읽히고,
   idx가 0..fromIdx-1 로 연속이라 위치 계산이 그대로 성립한다. */
function cutTail(fromIdx, hx, hy) {
  let n = 0;
  for (const c of pond.chicks) {
    if (c.got && c.idx >= fromIdx) { c.got = false; c.lost = true; n++; }
  }
  if (!n) return 0;
  line = fromIdx;
  lost += n;
  paintCount();
  burst(hx, hy, '#ffd75e', 12 + n * 6);
  flashT = 0.22;
  shakeAmp = Math.max(shakeAmp, H * 0.02);
  return n;
}

function step(dt) {
  elapsed += dt;
  dist += SPEED * dt;
  steer(dt);

  // 자취를 남긴다. 거리·x 만 있으면 되므로 가볍다.
  path.push(dist, mom.x);
  if (path.length > 3000) path.splice(0, 2);
  followStep(dt);

  const mx = mom.x * W, my = MOM_Y * H;
  const R = W * 0.055;                       // 엄마 반지름(판정)

  // 새끼 줍기
  for (const c of pond.chicks) {
    // 떨어져 나간 새끼는 다시 줍지 않는다. 엄마 뒤쪽에 남아 있어서 이 검사가 없으면
    // 화면을 스치는 동안 도로 붙는다 — 부딪힌 대가가 사라진다.
    if (c.got || c.lost) continue;
    const cy = screenY(c.d);
    if (cy < -H * 0.2 || cy > H * 1.2) continue;
    if (Math.hypot(c.x * W - mx, cy - my) < R + W * 0.035) {
      c.got = true; c.idx = line++; c.cx = c.x;
      paintCount();
      burst(c.x * W, cy, '#ffe27d', 10);
      flashT = Math.max(flashT, 0.10);
    }
  }

  /* 장난감에 부딪히면 뒤에서 두 마리가 떨어진다 — 즉시 끝나지 않는다.
     처음엔 한 방에 끝냈더니 자동 조종이 15마리 중 4마리에서 죽었다. 그러면 공유물이
     매번 🐥🐥🐥🐥⬛⬛⬛... 이 되어 귀여운 게임인데 결과가 늘 실패로 보인다.
     떨어지는 쪽이 더 낫다: 코스는 끝까지 가고, 점수는 '몇 마리를 집에 데려왔나'가 된다.

     방치 종결은 그대로다 — 줄이 빈 채로 부딪히면 거기서 끝난다. 손대지 않으면
     저절로 나빠지는 상태이지 플레이어에게 건 시계가 아니다. */
  if (inv > 0) inv -= dt;
  const TR = W * 0.062;                      // 공 반지름
  for (const t of pond.toys) {
    const ty = screenY(t.d);
    if (ty < -H * 0.25 || ty > H * 1.25) continue;
    const tx = (t.x + Math.sin(elapsed * 0.9 + t.d) * t.drift) * W;

    // 엄마가 맞으면 뒤 두 마리
    if (inv <= 0 && Math.hypot(tx - mx, ty - my) < R + TR) {
      burst(tx, ty, '#ffffff', 14);
      if (line === 0) { burst(mx, my, '#ff6b8b', 30); flashT = 0.30; finish(false); return; }
      cutTail(Math.max(0, line - 2), mx, my + H * 0.04);
      inv = 1.2;                             // 없으면 공 하나가 프레임마다 줄을 벗긴다
      beepish();
      continue;
    }

    /* 꼬리도 맞는다 — 이 게임이 게임이 되는 지점이다.
       앞 버전은 줄이 그냥 점수판이라 회전할 때 아무 생각도 필요 없었다.
       꼬리가 물건이 되면 매 회전마다 "내 줄이 어디를 쓸고 지나가나"를 봐야 한다. */
    for (const c of pond.chicks) {
      if (!c.got) continue;
      const w = chickWorld(c.idx);
      const cy = screenY(w.d);
      if (cy < -H * 0.2 || cy > H * 1.2) continue;
      if (Math.hypot(tx - w.x * W, ty - cy) >= W * 0.028 + TR) continue;
      burst(tx, ty, '#ffffff', 10);
      cutTail(c.idx, w.x * W, cy);
      beepish();
      break;
    }
  }

  if (dist >= POND_LEN) { flashT = 0.4; burst(mx, my, '#7dffb0', 40); finish(true); }
}

function finish(home) {
  state = S.DONE;
  result = { line, home, total: CHICKS };
  showResult();
}

/* ---------- 결과 ---------- */
const panel = document.getElementById('panel');
function cells(r) {
  return '🐥'.repeat(r.line) + '⬛'.repeat(Math.max(0, r.total - r.line));
}
function shareText(r) {
  const head = mode === 'daily' ? "TODAY'S POND #" + DAILY_NO : 'DUCK LINE — practice';
  const line1 = r.home ? '🦆 ' + r.line + ' ducklings home' : '🦆 ' + r.line + ' ducklings, then I hit a beach ball';
  return head + '\n\n' + line1 + '\n' + cells(r) + '\n\nSame pond for everyone today.\njust1game.com';
}
function showResult() {
  document.getElementById('verdict').textContent = result.home
    ? result.line + ' DUCKLINGS HOME' : 'BUMPED — ' + result.line + ' FOLLOWING';
  document.getElementById('row2').textContent = cells(result);
  document.getElementById('sub').textContent = mode === 'daily'
    ? 'One pond a day. Practice is unlimited and does not count.'
    : 'Practice pond — today\'s result is already saved.';
  document.getElementById('againBtn').textContent = mode === 'daily' ? 'PRACTICE →' : 'NEXT POND';
  panel.classList.add('on');
}
document.getElementById('shareBtn').onclick = async () => {
  const t = shareText(result);
  try {
    if (navigator.share) await navigator.share({ text: t });
    else { await navigator.clipboard.writeText(t); document.getElementById('shareBtn').textContent = 'COPIED ✓'; }
  } catch (e) {}
};
document.getElementById('againBtn').onclick = () => { mode = 'practice'; reset((Math.random() * 1e9) | 0); };

/* ---------- 입력 ---------- */
function local(e) {
  const r = canvas.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - r.left - OX) / W));
}
canvas.addEventListener('pointerdown', e => { if (state === S.PLAY) { aimX = local(e); canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove', e => { if (aimX !== null) aimX = local(e); });
window.addEventListener('pointerup', () => { aimX = null; });
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
});

/* ---------- 그리기 ---------- */
/* 오리 한 마리. 귀여움은 비율에서 나온다 — 머리를 크게, 눈을 크게, 부리를 짧고 둥글게.
   처음엔 머리 0.56·눈 0.13이었는데 작은 화면에서 눈이 점 하나로 뭉개져 '새'로만 보였다.
   눈에 흰 점(캐치라이트)을 넣는 순간 표정이 생긴다 — 이 한 픽셀이 제일 크게 바뀐다. */
const INK = '#0e1c24';     // 외곽선. 물색보다 확실히 어두워야 실루엣이 산다

function duck(x, y, s, colBody, colBill, bob, tilt) {
  const yy = y + bob;
  // 물에 비친 그림자 — 회전 밖에서 그린다. 같이 돌면 그림자가 기울어 물이 아니게 된다
  ctx.fillStyle = 'rgba(3, 18, 24, .40)';
  ctx.beginPath(); ctx.ellipse(x, yy + s * 0.66, s * 1.15, s * 0.30, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(x, yy);
  if (tilt) ctx.rotate(tilt);

  const body = () => { ctx.beginPath(); ctx.ellipse(0, 0, s * 1.02, s * 0.80, 0, 0, 7); };
  const tail = () => {
    ctx.beginPath();
    ctx.moveTo(-s * 0.75, -s * 0.05);
    ctx.quadraticCurveTo(-s * 1.55, -s * 0.40, -s * 1.02, -s * 0.62);
    ctx.quadraticCurveTo(-s * 0.85, -s * 0.28, -s * 0.55, -s * 0.15);
    ctx.closePath();
  };
  const head = () => { ctx.beginPath(); ctx.arc(s * 0.52, -s * 0.82, s * 0.70, 0, 7); };
  const bill = () => { ctx.beginPath(); ctx.ellipse(s * 1.18, -s * 0.76, s * 0.42, s * 0.26, 0.10, 0, 7); };

  /* 외곽선을 먼저 굵게 '긋고' 그 위에 채운다. 도형마다 fill+stroke 하면
     몸과 머리가 겹치는 자리에 선이 지나가 실루엣이 갈라진다 — 두꺼울수록 더 눈에 띈다. */
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = s * 0.30;
  // 어두운 물 위에서는 실루엣만으로 안 보인다. 은은한 글로우가 사이트의 네온과 이어준다
  ctx.shadowColor = colBody; ctx.shadowBlur = s * 0.9;
  tail(); ctx.stroke(); body(); ctx.stroke(); head(); ctx.stroke(); bill(); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = colBody;
  tail(); ctx.fill(); body(); ctx.fill(); head(); ctx.fill();
  ctx.fillStyle = colBill; bill(); ctx.fill();

  // 볼터치 · 눈 · 캐치라이트. 캐치라이트 하나로 표정이 생긴다
  ctx.fillStyle = 'rgba(255,120,130,.42)';
  ctx.beginPath(); ctx.arc(s * 0.30, -s * 0.55, s * 0.21, 0, 7); ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(s * 0.76, -s * 0.98, s * 0.23, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(s * 0.84, -s * 1.07, s * 0.09, 0, 7); ctx.fill();

  ctx.restore();

  // 물결 파문 — 오리마다 하나씩. 물 위에 있다는 신호가 이걸로 완성된다
  const ph = (elapsed * 0.9 + x * 0.02) % 1;
  ctx.strokeStyle = 'rgba(190, 240, 255,' + (0.22 * (1 - ph)).toFixed(3) + ')';
  ctx.lineWidth = Math.max(1, s * 0.10);
  ctx.beginPath();
  ctx.ellipse(x, yy + s * 0.62, s * (0.9 + ph * 1.5), s * (0.24 + ph * 0.40), 0, 0, 7);
  ctx.stroke();
}

function draw() {
  ctx.save();
  if (shakeAmp > 0.4) ctx.translate((Math.random() * 2 - 1) * shakeAmp, (Math.random() * 2 - 1) * shakeAmp);

  /* 물 — 어둡게 두되 죽은 남색은 피한다. 오리가 따뜻한 색이라 물이 어두워야 튀어나온다.
     밝은 물(수채 톤)로 갔다가 사이트의 네온 아케이드와 따로 노는 것이 눈에 보여 되돌렸다. */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f3b46'); g.addColorStop(0.55, '#0a2c37'); g.addColorStop(1, '#06202a');
  ctx.fillStyle = g; ctx.fillRect(-OX, -20, SW, H + 40);

  // 둔치 — 좌우 끝의 물풀. 이게 있어야 '연못'이고, 없으면 그냥 바다다.
  // 엄마가 0.06~0.94로 묶여 있으므로 길을 뺏지 않는다.
  const bankW = W * 0.045;
  for (const side of [0, 1]) {
    const x0 = side ? W - bankW : 0;
    const bg = ctx.createLinearGradient(side ? x0 : x0 + bankW, 0, side ? x0 + bankW : x0, 0);
    bg.addColorStop(0, 'rgba(30, 92, 74, 0)');
    bg.addColorStop(1, '#1c5a48');
    ctx.fillStyle = bg;
    ctx.fillRect(side ? x0 : -OX, 0, side ? bankW + (SW - OX - W) : bankW + OX, H);
  }
  // 갈대
  for (const rd of pond.reeds) {
    const y = screenY(rd.d);
    if (y < -30 || y > H + 30) continue;
    const bx = rd.side ? W - bankW * (0.15 + 0.7 * ((rd.d * 7) % 1)) : bankW * (0.15 + 0.7 * ((rd.d * 7) % 1));
    const sway = Math.sin(elapsed * 1.1 + rd.d * 3) * W * 0.012;
    ctx.strokeStyle = '#2f7f62'; ctx.lineWidth = Math.max(1.5, W * 0.008);
    ctx.beginPath();
    ctx.moveTo(bx, y);
    ctx.quadraticCurveTo(bx + (rd.lean * W * 0.03) + sway, y - rd.h * H * 0.6, bx + rd.lean * W * 0.05 + sway, y - rd.h * H);
    ctx.stroke();
  }

  // 수련잎 — 장식이다. 판정 있는 장난감과 헷갈리지 않게 색과 크기를 확실히 다르게 뒀다
  for (const p of pond.pads) {
    const y = screenY(p.d);
    if (y < -H * 0.15 || y > H * 1.15) continue;
    const rr = p.r * W;
    ctx.save();
    ctx.translate(p.x * W, y);
    ctx.rotate(p.rot + Math.sin(elapsed * 0.5 + p.d) * 0.06);
    /* 수련잎. 공(장애물)과 절대 헷갈리면 안 된다 — 앞 버전은 둘 다 원이라
       "위험한 것과 배경이 같은 모양"이었다. 잎은 납작한 타원 + V자 홈 + 잎맥으로,
       공은 정원 + 흰 바탕 + 굵은 외곽선 + 글로우로 확실히 갈라놨다. */
    ctx.fillStyle = '#1f6b4e';
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, rr * 0.10);
    ctx.beginPath();
    ctx.ellipse(0, 0, rr, rr * 0.72, 0, 0.40, Math.PI * 2 + 0.06);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(140,230,180,.30)'; ctx.lineWidth = Math.max(1, rr * 0.05);
    for (let k = 1; k <= 3; k++) {
      const a = 1.1 + k * 1.3;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * rr * 0.82, Math.sin(a) * rr * 0.60);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 잔물결 — 흐르는 가로선. 화면이 움직인다는 것을 이것만으로 알 수 있다
  ctx.strokeStyle = 'rgba(200,240,255,.13)'; ctx.lineWidth = Math.max(1, H / 700);
  const gap = H * 0.055;
  const off = ((dist * H) % gap + gap) % gap;
  for (let y = off - gap; y < H + gap; y += gap) {
    ctx.beginPath();
    for (let x = -OX; x < SW - OX; x += 14) {
      const yy = y + Math.sin((x + dist * 260) * 0.03) * H * 0.004;
      x === -OX ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  // 골 — 연못 끝. 남은 거리가 보여야 '거의 다 왔다'가 생긴다
  // 집 — 점선 대신 둥지다. 목적지가 '결승선'이 아니라 '집'으로 보여야 데려간 이유가 생긴다
  const gy = screenY(POND_LEN);
  if (gy > -H * 0.3 && gy < H + H * 0.3) {
    // 나아가는 방향이 화면 위쪽이므로 땅은 gy '위'다.
    // 아래로 그렸다가 오리가 잔디 위에서 헤엄치는 그림이 나왔다 — 좌표계가 뒤집힌 전형적인 실수다.
    ctx.fillStyle = '#2f7f62';
    ctx.fillRect(-OX, -20, SW, gy + 20);                 // 건너편 둔치
    ctx.fillStyle = '#3d9a76';
    ctx.beginPath();
    for (let x = -OX; x <= SW - OX; x += W * 0.08) {
      ctx.moveTo(x, gy);
      ctx.quadraticCurveTo(x + W * 0.02, gy + H * 0.020, x + W * 0.045, gy);
    }
    ctx.fill();
    // 둥지
    const nx = W * 0.5, ny = gy - H * 0.050;
    ctx.fillStyle = '#8a6237';
    ctx.beginPath(); ctx.ellipse(nx, ny, W * 0.16, H * 0.030, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#a97b47';
    ctx.beginPath(); ctx.ellipse(nx, ny - H * 0.006, W * 0.125, H * 0.021, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.textAlign = 'center';
    ctx.font = '700 ' + Math.round(H * 0.017) + 'px ui-monospace, monospace';
    ctx.fillText('HOME', nx, ny - H * 0.042);
  }

  // 장난감
  for (const t of pond.toys) {
    const ty = screenY(t.d);
    if (ty < -H * 0.15 || ty > H * 1.15) continue;
    const tx = (t.x + Math.sin(elapsed * 0.9 + t.d) * t.drift) * W;
    // 물놀이 공. 판정이 있는 유일한 물건이라 수련잎과 확실히 달라야 한다 —
    // 흰 바탕에 색 줄무늬로 두면 초록 잎들 사이에서 혼자 튄다
    const rr = W * 0.062;
    const col = ['#ff6b8b', '#ffb36b', '#8b8bff'][t.kind];
    ctx.fillStyle = 'rgba(3, 18, 24, .40)';
    ctx.beginPath(); ctx.ellipse(tx, ty + rr * 0.72, rr * 0.95, rr * 0.30, 0, 0, 7); ctx.fill();
    // 굵은 외곽선 + 글로우. 어두운 물에서 '피해야 할 것' 하나만 이렇게 빛난다
    ctx.strokeStyle = INK; ctx.lineWidth = rr * 0.22;
    ctx.shadowColor = col; ctx.shadowBlur = rr * 0.9;
    ctx.beginPath(); ctx.arc(tx, ty, rr, 0, 7); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fdfdf8';
    ctx.beginPath(); ctx.arc(tx, ty, rr, 0, 7); ctx.fill();
    ctx.fillStyle = col;
    ctx.save();
    ctx.beginPath(); ctx.arc(tx, ty, rr, 0, 7); ctx.clip();
    const spin = Math.sin(elapsed * 0.8 + t.d) * rr * 0.5;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.ellipse(tx + k * rr * 0.62 + spin, ty, rr * 0.20, rr * 1.1, 0, 0, 7);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.ellipse(tx - rr * 0.34, ty - rr * 0.40, rr * 0.24, rr * 0.16, -0.6, 0, 7); ctx.fill();
  }

  // 아직 안 주운 새끼
  for (const c of pond.chicks) {
    // 떨어져 나간 새끼는 다시 줍지 않는다. 엄마 뒤쪽에 남아 있어서 이 검사가 없으면
    // 화면을 스치는 동안 도로 붙는다 — 부딪힌 대가가 사라진다.
    if (c.got || c.lost) continue;
    const cy = screenY(c.d);
    if (cy < -H * 0.15 || cy > H * 1.15) continue;
    duck(c.x * W, cy, W * 0.028, '#ffe27d', '#ff9b3d', Math.sin(elapsed * 3 + c.d * 5) * H * 0.004, 0);
  }

  // 줄 — 자취를 되짚어 따라온다. 이게 이 게임의 그림 전부다
  // GAPD는 위 chickWorld 옆에 있다 — step과 draw가 같은 값을 봐야 한다
  for (const c of pond.chicks) {
    if (!c.got) continue;
    const w = chickWorld(c.idx);
    const want = w.d, x = w.x;
    duck(x * W, screenY(want), W * 0.028, '#ffd75e', '#ff9b3d',
         Math.sin(elapsed * 4 + c.idx) * H * 0.005, (x - mom.x) * 0.5);
  }

  // 엄마 — 도는 쪽으로 몸이 기운다. 관성이 눈에 보여야 줄이 곡선으로 읽힌다
  duck(mom.x * W, MOM_Y * H, W * 0.052, '#fff6dc', '#ff9b3d',
       Math.sin(elapsed * 3.2) * H * 0.004, mom.vx * 0.22);

  // 파티클
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    if (p.t <= 0) continue;
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.t);
    const s = Math.max(1.5, H * 0.005) * p.m;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // 시작 안내
  if (state === S.PLAY && dist < 0.9) {
    hintT += 0.03;
    ctx.globalAlpha = 0.45 + Math.sin(hintT) * 0.25;
    ctx.fillStyle = '#cfe9ff'; ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.round(H * 0.019) + 'px ui-monospace, monospace';
    ctx.fillText('DRAG TO SWIM', W * 0.5, (MOM_Y + 0.075) * H);
    ctx.globalAlpha = 1;
  }

  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,226,125,' + (flashT * 0.5).toFixed(3) + ')';
    ctx.fillRect(-OX, 0, SW, H);
  }
  ctx.restore();
}

/* ---------- 루프 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === S.PLAY) step(dt);
  for (const p of parts) { if (p.t <= 0) continue; p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += H * 0.8 * dt; }
  shakeAmp *= Math.exp(-dt * 9); if (shakeAmp < 0.4) shakeAmp = 0;
  if (flashT > 0) flashT -= dt;
  draw();
  requestAnimationFrame(frame);
}

resize();
reset(Math.imul(DAY + 1, 2654435761) >>> 0);
requestAnimationFrame(frame);
</script>
</body>
</html>
