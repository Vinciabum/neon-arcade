<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== PAGE TEXT — 새 게임에서 이 블록을 교체한다 ===== -->
<title>Game Base — Neon Arcade</title>
<!-- ===== PAGE TEXT 끝 ===== -->
<style>
  :root { --neon: #00e5ff; --bg: #05060a; --ink: #e8f6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud b { color: var(--neon); font-weight: 700; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #070912; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(5, 6, 10, .82); padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: .04em; color: var(--neon); }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.5; opacity: .85; font-size: 14px; }
  .btn { appearance: none; border: 1px solid var(--neon); background: transparent; color: var(--neon);
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
    min-width: 160px; min-height: 48px; }
  .btn:active { background: rgba(0, 229, 255, .16); }
</style>
</head>
<body>
<div id="wrap">
  <!-- ===== HUD & OVERLAYS — 새 게임에서 이 블록을 교체한다 =====
       id는 스크립트가 참조한다. HUD에 목숨·레벨을 더하면 아래 el 조회도 같이 늘려야 한다.
       canvas#c 와 두 오버레이의 id(titleScreen·overScreen)는 그대로 두는 편이 안전하다. -->
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="titleScreen">
      <h1>GAME BASE</h1>
      <p>Dodge the falling blocks. Arrow keys or A/D on desktop, drag anywhere on mobile.</p>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
    <div class="overlay" id="overScreen" hidden>
      <h1>GAME OVER</h1>
      <p>Score <b id="finalScore">0</b></p>
      <button class="btn" id="againBtn" type="button">Play again</button>
    </div>
  </div>
  <!-- ===== HUD & OVERLAYS 끝 ===== -->
</div>

<script>
/* ============================================================
   NEON ARCADE — GAME BASE
   새 게임은 이 파일을 복사해 play/<slug>.html 로 두고
   "GAME LOGIC" 구역만 교체한다. 그 위/아래(계약·입력·FX·루프·포털 훅)는 그대로 둔다.
   ============================================================ */

const SLUG = 'game-base';                  // 새 게임에서 슬러그로 바꾼다
const BEST_KEY = 'just1game:' + SLUG + ':best';

/* ---------- 최고점 저장 ----------
   localStorage는 샌드박스 iframe이나 서드파티 저장소가 차단된 환경에서
   읽기만 해도 throw한다 — 이 파일이 SDK 훅을 들고 가는 포털 임베드가 정확히 그 환경이다.
   막히면 메모리에만 유지한다(그 세션 동안은 최고점이 동작하고, 다음 방문에 사라진다). */
function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* 메모리에만 유지한다 */ }
}

/* ---------- 포털 SDK 훅 ----------
   사이트 배포에서는 비활성 no-op. 포털 납품 빌드에서만 PORTAL.enabled를 켠다.
   게임 로직은 아래 4개 함수만 부른다 — SDK가 무엇으로 바뀌어도 로직은 안 바뀐다. */
const PORTAL = { enabled: false, gameId: '' };
const Portal = {
  ready() { if (!PORTAL.enabled) return Promise.resolve(); return Promise.resolve(window.gdsdk); },
  gameplayStart() { if (PORTAL.enabled && window.gdsdk) window.gdsdk.preloadAd?.('rewarded'); },
  gameplayStop() { /* 납품 빌드에서 SDK의 gameplayStop을 연결한다 */ },
  adBreak(done) { done(); }   // 비활성 상태에서는 즉시 콜백. 게임이 광고를 기다리며 멈추지 않는다
};

/* ---------- 오디오: 사용자 제스처 이후에만 초기화 (모바일 정책) ---------- */
let actx = null;
function audioReady() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 제스처 안에서 만들어도 suspended로 시작할 수 있다 (특히 iOS·임베드).
  // 깨우지 않으면 모든 복제 게임이 조용히 무음이 된다. 거부는 무시한다 — 소리는 부가 기능이다.
  Promise.resolve(actx.resume?.()).catch(() => {});
}
function beep(freq, ms) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.value = 0.04;
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + ms / 1000);
}

/* ---------- 캔버스: 반응형 + DPR ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  W = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   FX — 파티클·화면 흔들림·플래시. 프레임의 일부이므로 새 게임이 그대로 물려받는다.
   에셋도 라이브러리도 쓰지 않는다: 이 파이프라인의 게임은 캔버스로만 그린다
   (에셋 라이선스가 기존 게임의 상업적 사용을 막았고, 그 실수를 반복하지 않는다).

   GAME LOGIC이 부르는 것은 이 셋뿐이다:
     FX.burst(x, y, color[, count])  — (x,y)에서 파편이 터진다. 캔버스 픽셀 좌표
     FX.shake(px)                    — 화면을 px만큼 흔든다 (여러 번 부르면 큰 쪽이 이긴다)
     FX.flash(color[, sec, peak])    — 화면 전체를 잠깐 덮는다. peak은 가장 진할 때의 알파
     FX.trail(x, y, color, w, h[, sec]) — 잔상 하나. 매 프레임 불러 이동 흔적을 만든다
   루프가 부르는 것: FX.update(dt) / FX.begin(ctx) / FX.draw(ctx) / FX.end(ctx)

   begin/end로 감싸는 이유: 흔들림은 화면 전체를 옮기는 것이라
   옮긴 만큼 가장자리에 빈 띠가 생긴다. begin이 먼저 FX.bg로 캔버스를 덮고 옮긴다.
   그래서 FX.bg는 게임 배경색과 같아야 한다 — 새 게임에서 배경을 바꾸면 이 값도 바꾼다.
   ============================================================ */
const FX = (() => {
  // 파티클은 고정 풀에서만 꺼낸다. 폭발마다 객체를 새로 만들면 60초 플레이에서
  // 힙이 계속 자라 게이트 2의 누수 판정(2.5배)에 걸린다. 다 차면 오래된 것부터 덮어쓴다.
  const MAX = 220;
  const pool = new Array(MAX);
  for (let i = 0; i < MAX; i++) pool[i] = { life: 0, ttl: 1, x: 0, y: 0, vx: 0, vy: 0, g: 0, w: 2, h: 2, color: '#fff' };
  let head = 0;

  let amp = 0, sx = 0, sy = 0;
  let flashT = 0, flashDur = 1, flashPeak = 0.55, flashColor = '#fff';

  // 난수는 자체 시드로 돌린다. Math.random을 쓰면 같은 조작으로 돌린 게이트 실행이
  // 매번 달라져 실패를 다시 만들어낼 수 없다.
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  const take = () => { const p = pool[head]; head = (head + 1) % MAX; return p; };

  return {
    bg: '#070912',

    burst(x, y, color, count = 14) {
      // 속도·크기·중력을 화면 높이에서 파생한다. 픽셀 상수로 두면 4K에서 먼지가 된다
      // (M()이 스프라이트에 대해 하는 것과 같은 이유).
      const spd = H * 0.42, grav = H * 0.9, size = Math.max(1.5, H * 0.0055);
      for (let i = 0; i < count; i++) {
        const a = rnd() * Math.PI * 2;
        const v = spd * (0.35 + rnd() * 0.85);
        const p = take();
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v - spd * 0.25;
        p.g = grav; p.w = p.h = size * (0.7 + rnd() * 0.9);
        p.ttl = p.life = 0.45 + rnd() * 0.5;
        p.color = color;
      }
    },

    trail(x, y, color, w, h, sec = 0.26) {
      const p = take();
      p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.g = 0;
      p.w = w; p.h = h; p.ttl = p.life = sec; p.color = color;
    },

    shake(px) { amp = Math.max(amp, px); },

    // peak은 가장 진할 때의 알파. 사망처럼 화면을 끊는 순간은 세게, 등장·획득처럼
    // 자주 일어나는 순간은 약하게 — 약한 값이 없으면 흔한 사건이 화면을 계속 세탁한다.
    flash(color, sec = 0.2, peak = 0.55) { flashColor = color; flashDur = sec; flashT = sec; flashPeak = peak; },

    update(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      // 흔들림은 지수 감쇠. 매 프레임 새 오프셋을 뽑아야 '떨림'으로 보인다.
      amp *= Math.exp(-dt * 9);
      if (amp < 0.35) amp = 0;
      sx = amp ? (rnd() * 2 - 1) * amp : 0;
      sy = amp ? (rnd() * 2 - 1) * amp : 0;
      if (flashT > 0) flashT -= dt;
    },

    begin(ctx) {
      if (sx || sy) { ctx.fillStyle = this.bg; ctx.fillRect(0, 0, W, H); }
      ctx.save();
      ctx.translate(sx, sy);
    },

    draw(ctx) {
      // 가산 합성. 어두운 배경에서 파편이 겹칠수록 밝아져 네온처럼 보인다.
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MAX; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        ctx.globalAlpha = p.life / p.ttl;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    end(ctx) {
      ctx.restore();
      // 플래시는 흔들림 밖에서 그린다 — 화면 전체를 덮는 판이라 같이 흔들리면 띠가 생긴다.
      if (flashT > 0) {
        ctx.globalAlpha = Math.min(1, (flashT / flashDur) * flashPeak);
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
let state = S.TITLE;
let score = 0;
let tick = 0;
let best = loadBest();
let autoPaused = false;      // 탭이 숨겨져서 우리가 멈춘 것인지 구분한다

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  finalScore: document.getElementById('finalScore'),
  title: document.getElementById('titleScreen'),
  over: document.getElementById('overScreen')
};
el.best.textContent = best;

/* ---------- 입력: 키보드 + 터치 이중 ----------
   left/right는 '방향을 누르고 있다', aimX는 '이 지점을 짚었다'(0~1, 캔버스 폭 비율)이다.
   두 채널을 함께 두는 이유: 손가락은 화면 절반을 누르는 것보다 원하는 자리를 짚는 쪽이
   훨씬 정확한데, 키보드에는 그런 좌표가 없다. 게임 로직이 둘 다 읽고 하나로 합친다. */
const input = { left: false, right: false, aimX: null };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  // Space/Enter: 일시정지 중이면 재개한다. state !== PLAYING 하나로 묶으면
  // 멈춰 둔 판이 새 판으로 날아가고, 죽은 직후 프레임에 스스로 재시작해
  // 수집기가 'over'를 한 번도 못 보는 일이 생긴다.
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === S.PAUSED) resume();
    else if (state === S.TITLE || state === S.OVER) start();
  }
  if (e.code === 'KeyP') { state === S.PLAYING ? pause() : state === S.PAUSED ? resume() : 0; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// 짚은 지점을 캔버스 폭 비율로 바꾼다. 화면 절반 비교(왼쪽/오른쪽)로 두면
// 손가락이 '방향 버튼 두 개'가 되어 원하는 자리에 설 수 없다 — 드래그가 곧 조준이 되게 한다.
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  input.aimX = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
}
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); audioReady();
  // 일시정지 상태에서의 탭은 재시작이 아니라 재개다 (Space와 같은 규칙).
  // 지금은 닿기 어려운 경로지만, 이 파일은 모든 새 게임에 복사된다 —
  // 화면 내 일시정지 버튼을 붙이는 게임이 그대로 버그를 물려받는다.
  if (state === S.PAUSED) { resume(); return; }
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  aimAt(e.changedTouches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault(); clearInput();
}, { passive: false });
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;      // 터치는 위에서 처리
  audioReady();
  if (state === S.PAUSED) { resume(); return; }   // 위 touchstart와 같은 규칙
  if (state === S.TITLE || state === S.OVER) { start(); return; }
  aimAt(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  // 마우스는 누르고 끌 때만 조준한다. 그냥 지나가는 커서까지 따라가면
  // 키보드로 놀던 사람의 플레이어가 제멋대로 끌려간다.
  if (e.pointerType !== 'touch' && e.buttons === 1 && state === S.PLAYING) aimAt(e.clientX);
});
// 캔버스 밖에서 손을 떼도 반드시 풀린다. 캔버스에만 걸면 오버레이 위에서 뗀 포인터가
// aimX를 붙잡은 채로 남아 다음 판이 한쪽으로 끌려간 채 시작한다.
window.addEventListener('pointerup', () => { clearInput(); });
window.addEventListener('pointercancel', () => { clearInput(); });

document.getElementById('startBtn').addEventListener('click', () => { audioReady(); start(); });
document.getElementById('againBtn').addEventListener('click', () => { audioReady(); start(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === S.PLAYING) { autoPaused = true; pause(); }
  } else if (autoPaused) {
    autoPaused = false;
    resume();
  }
});

/* ============================================================
   ===== GAME LOGIC — 새 게임에서 이 구역만 교체한다 =====
   지켜야 할 계약:
     reset()     : 새 판의 초기 상태를 만든다 (score는 호출자가 0으로 만든다)
     step(m, dt) : dt(초)만큼 진행. 죽으면 gameOver()를 부른다.
                   입력을 주지 않으면 반드시 몇 초 안에 죽어야 한다 (게이트 2 방치 종결)
     draw(m, dt) : 캔버스를 그린다. 모든 상태에서 매 프레임 불린다.
                   단색이고 정지한 화면이면 게이트 1이 막는다
     m 은 루프가 프레임당 한 번 만든 M() 결과다 — step과 draw가 같은 값을 본다
   쓸 수 있는 것: FX.burst / FX.shake / FX.flash / FX.trail (위 FX 블록 참고).
   파티클과 잔상은 루프가 알아서 갱신·렌더하므로 여기서는 부르기만 한다.

   이 구역만 바꾸면 끝나지 않는다. 구역 밖에서 반드시 손대야 하는 곳:
     1. SLUG — 최고점 저장 키가 된다. 안 바꾸면 모든 게임이 같은 키를 공유한다
     2. <!-- PAGE TEXT --> 블록의 <title>
     3. <!-- HUD & OVERLAYS --> 블록: 두 오버레이의 <h1>, 조작 설명 <p>
        ("Dodge the falling blocks..."), 그리고 HUD 마크업
     4. HUD에 목숨·레벨을 더했으면 el = { ... } 조회도 같이 늘린다
     5. 입력 맵 — 좌/우·조준 말고 점프·발사 등이 필요하면 keydown/keyup·touch 핸들러와
        input 객체, 그리고 이 구역의 clearInput()을 함께 고친다
     6. FX.bg — 배경색을 바꾸면 흔들릴 때 가장자리에 그 색이 드러난다
   ============================================================ */

/* ---- 조작 감각 ----
   평평한 속도(누르면 즉시 최고속, 떼면 즉시 정지)는 손맛이 없다 — 무게도 관성도 없어서
   화면이 입력을 '따라오는' 느낌이 안 난다. 아래 다섯 값이 그 느낌 전부를 만든다.
   새 게임은 값만 바꿔도 가볍고 미끄러운 조작부터 묵직한 조작까지 낼 수 있다. */
const ACCEL = 7.0;        // 가속도 (화면 폭 배수/초²)
const MAX_SPD = 1.15;     // 최고 속도 (화면 폭/초)
const FRICTION = 9.0;     // 입력이 없을 때 속도가 죽는 비율/초
const TURN_BOOST = 2.4;   // 반대로 꺾을 때 가속 배수. 없으면 방향 전환이 마찰만큼 늦게 먹힌다
const AIM_GAIN = 10.0;    // 짚은 지점을 향한 추종 강도 (초당 남은 거리의 몇 배)
const AIM_SNAP = 0.004;   // 이 거리 안이면 붙인다 — 손가락 밑에서 미세하게 떠는 것을 막는다

/* ---- 난이도 곡선 ----
   세 축이 서로 다른 시점에 최대치에 닿는다. 한 축만 올리면 그 축이 상한에 닿는 순간
   (예전에는 낙하 속도 하나뿐이라 26초쯤) 화면이 더 이상 변하지 않아 유능한 플레이어가
   같은 패턴을 반복하게 된다. 낙하는 35초, 스폰 간격은 44초, 겨냥 비율은 54초에 닿는다. */
const FALL_START = 0.30, FALL_MAX = 0.72, FALL_RAMP = 0.012;    // 화면 높이 비율/초
const SPAWN_START = 0.62, SPAWN_MIN = 0.30, SPAWN_RAMP = 0.0072; // 스폰 간격(초)
const AIM_START = 1 / 3, AIM_MAX = 0.70, AIM_RAMP = 0.0068;      // 겨냥 블록 비율

const player = { x: 0.5, vx: 0 };   // 크기는 M()이 화면 높이에서 파생한다

// 이 게임이 쓰는 입력 필드를 비운다. 구역 밖(start)에서 input을 직접 건드리면
// jump·fire 같은 필드를 쓰는 다음 게임이 "누른 채로 죽으면 다음 판이 움직인 채 시작"
// 버그를 조용히 물려받는다. 필드를 아는 쪽은 이 구역뿐이다.
function clearInput() {
  input.left = input.right = false;
  input.aimX = null;
}
let blocks = [];
let spawnIn = 0;
let fallSpeed = 0;
let spawnCount = 0;
let elapsed = 0;      // 이번 판의 경과 시간(초). 난이도 세 축이 전부 여기서 나온다
let aimAcc = 0;       // 겨냥 비율 누산기. 아래 스폰 주석 참고
let round = 0;        // 몇 번째 판인가. 판마다 낙하 배치를 어긋내는 데만 쓴다 —
                      // 모든 판이 완전히 같으면 플레이어는 두 판째에 배치를 외우고,
                      // 심사용 스크린샷 10장도 같은 장면 몇 개로 접힌다(실측: 3종류가 반복됐다).
                      // 난수가 아니라 판 번호로 어긋내므로 같은 판은 언제나 같은 배치다.
let gridOff = 0;      // 격자 스크롤 위상. 프레임 수가 아니라 시간·격자 간격에 비례해야
                      // 해상도와 프레임레이트가 달라도 같은 속도로 보인다
const GRID_SCROLL = 1.25;   // 초당 격자 간격의 몇 배로 흐르는가. 게이트1의 motion은
                            // 400ms 간격 두 장의 픽셀차인데, 격자는 주기 패턴이라
                            // 위상차가 반주기(0.5)에 가까울 때 차이가 가장 크다.
                            // 1.25/초 × 0.4초 = 0.5주기 — 해상도에 무관하게 성립한다.

// 스프라이트·판정·격자 크기를 한 곳에서 화면 높이로부터 파생한다.
// 픽셀 상수로 두면 큰 화면에서 그림이 먼지처럼 작아진다(4K에서 게이트1 표준편차가 1.5까지 떨어졌다).
// 그리기와 판정이 같은 값을 쓰므로 보이는 것과 맞는 판정이 보장된다.
// 괄호 안 값은 높이 760px에서의 픽셀 크기 — 기존 모습을 그대로 유지하는 기준점이다.
function M() {
  return {
    grid: H / 18,                     // 배경 격자 간격 (42px)
    line: Math.max(0.75, H / 760),    // 격자 선 두께 (1px). 두께까지 상대값이어야 한다 —
                                      // 4K에서 1px 실선은 머리카락이 되어 사실상 사라진다
    half: H * 0.017,                  // 블록 반변 (13px)
    glowB: H * 0.0184,                // 블록 글로우 반경 (14px)
    glowP: H * 0.0237,                // 플레이어 글로우 반경 (18px)
    pw: H * 0.045,                    // 플레이어 폭 (34px)
    ph: H * 0.0185,                   // 플레이어 높이 (14px)
    py: H * 0.955                     // 플레이어 상단 y (H-34)
  };
}

// 아래로 갈수록 밝아지는 바닥 글로우. 균일한 격자는 평면으로 보이지만
// 밝기 기울기가 얹히면 바닥이 '가까운 쪽'으로 읽혀 낙하에 깊이가 생긴다.
// 그라디언트를 매 프레임 만들면 60초에 3600개가 쌓여 게이트 2의 힙 증가율을 먹고,
// 선마다 rgba 문자열을 만드는 방법도 같은 이유로 버렸다 — 높이가 바뀔 때만 다시 만든다.
let floorGrad = null, floorH = 0;
function floorGlow() {
  if (floorGrad && floorH === H) return floorGrad;
  floorGrad = ctx.createLinearGradient(0, 0, 0, H);
  floorGrad.addColorStop(0, 'rgba(0,229,255,0)');
  floorGrad.addColorStop(0.55, 'rgba(0,229,255,.03)');
  floorGrad.addColorStop(1, 'rgba(0,229,255,.15)');
  floorH = H;
  return floorGrad;
}

function reset() {
  player.x = 0.5;
  player.vx = 0;
  clearInput();
  blocks = [];
  spawnCount = 0;
  elapsed = 0;
  aimAcc = 0;
  gridOff = 0;
  round++;
  spawnIn = 0.35;
  fallSpeed = FALL_START;      // 화면 높이의 30%/초. px/s로 두면 큰 화면에서 낙하가 느려져
                               // 방치 종결이 게이트 예산(8초)을 넘긴다 — 높이에 무관하게 만든다
  // 판을 빈 화면으로 시작하지 않는다. 첫 스폰은 0.35초 뒤라 그 사이에 찍힌 스크린샷은
  // 격자와 막대 하나뿐인 '디버그 캔버스'가 된다(심사용 10장 중 3장이 그랬다).
  // 플레이어에게도 첫 프레임부터 볼 것을 준다. spawnCount는 건드리지 않는다 —
  // 겨냥 일정(4번째 스폰)이 밀리면 방치 종결이 게이트 예산 밖으로 나간다.
  for (let i = 0; i < 2; i++) {
    let x = 0.08 + Math.abs(Math.sin((i + 1) * 2.3 + round * 0.7)) * 0.84;
    if (Math.abs(x - 0.5) < 0.16) x += x < 0.5 ? -0.16 : 0.16;   // 시작 위치 위로는 떨어뜨리지 않는다
    blocks.push({ x, y: 0.18 + i * 0.4, scored: false, aimed: false });
  }
  // 등장 연출 — 플레이어가 '켜지는' 순간을 보여준다
  const m = M();
  FX.burst(player.x * W, m.py + m.ph / 2, '#00e5ff', 18);
  FX.flash('#00e5ff', 0.14, 0.2);
}

function step(m, dt) {
  elapsed += dt;

  // 조준(터치·드래그)이 있으면 그쪽이 이긴다. 순간이동시키지 않고 속도로 끌어당기는 이유는
  // 키보드와 같은 관성을 공유해야 두 조작이 같은 게임처럼 느껴지기 때문이다.
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (input.aimX !== null) {
    const d = input.aimX - player.x;
    player.vx = Math.abs(d) < AIM_SNAP ? 0 : Math.max(-MAX_SPD, Math.min(MAX_SPD, d * AIM_GAIN));
  } else if (dir !== 0) {
    // 이미 반대로 가고 있으면 더 세게 민다. 안 그러면 방향 전환에 마찰이 죽을 때까지
    // 기다려야 해서 가속을 넣은 순간 조작이 오히려 굼떠진다.
    const turning = dir * player.vx < 0;
    player.vx += dir * ACCEL * (turning ? TURN_BOOST : 1) * dt;
    player.vx = Math.max(-MAX_SPD, Math.min(MAX_SPD, player.vx));
  } else {
    // dt에 비례한 감쇠. 1을 넘지 않게 막아야 프레임이 튈 때 속도가 반대로 뒤집히지 않는다.
    player.vx -= player.vx * Math.min(1, FRICTION * dt);
  }
  player.x += player.vx * dt;
  if (player.x < 0.06) { player.x = 0.06; player.vx = 0; }   // 벽에 붙으면 속도도 죽인다 —
  if (player.x > 0.94) { player.x = 0.94; player.vx = 0; }   // 안 그러면 벽에서 떼는 순간 튄다

  spawnIn -= dt;
  if (spawnIn <= 0) {
    // 첫 블록은 겨냥하지 않는다. 겨냥이 너무 이르면 점수를 한 번도 못 얻고 죽어서
    // "진행성 없음"으로 오판된다. 4번째 스폰부터 겨냥하면 방치 종결은 5초 근처에 오고
    // 그 사이 앞선 블록들이 지나가며 점수가 오른다.
    // 겨냥을 난수로 뽑으면 매 실행이 달라져 게이트 결과가 흔들린다. 비율을 누산해서
    // 1을 넘을 때마다 한 발씩 겨냥한다 — 비율은 시간에 따라 오르지만 판은 재현된다.
    let aimed = false;
    if (spawnCount > 0) {
      aimAcc += Math.min(AIM_MAX, AIM_START + elapsed * AIM_RAMP);
      if (aimAcc >= 1) { aimAcc -= 1; aimed = true; }
    }
    // 씨앗은 spawnCount+1로 돌린다. spawnCount=0이면 sin(0)=0이라 첫 블록이 x=0.08,
    // 즉 왼쪽 클램프(0.06)에 붙어 있는 플레이어의 판정 범위 안에 정확히 떨어진다
    // (왼쪽을 계속 누르고 있으면 첫 블록에서 점수 0으로 매번 죽는다).
    let x = 0.08 + Math.abs(Math.sin((spawnCount + 1) * 1.7 + round * 0.7)) * 0.84;
    // 겨냥이 시작되기 전 3발은 플레이어 시작 위치(0.5) 주변을 비운다. 판마다 배치를
    // 어긋내면 어느 판에서는 첫 블록이 우연히 0.5에 떨어지는데, 그러면 점수를 한 번도
    // 못 얻고 죽어 게이트가 "진행성 없음"으로 읽는다 — 어긋내기가 그 규칙을 깨지 않게 막는다.
    if (spawnCount < 3 && Math.abs(x - 0.5) < 0.16) x += x < 0.5 ? -0.16 : 0.16;
    blocks.push({ x: aimed ? player.x : x, y: -0.05, scored: false, aimed });
    spawnCount++;
    // 간격과 낙하 속도가 함께 조인다. 스폰 순번이 아니라 경과 시간에 매다는 이유는
    // 간격이 줄면 순번이 빨리 늘어 곡선이 스스로 폭주하기 때문이다.
    spawnIn = Math.max(SPAWN_MIN, SPAWN_START - elapsed * SPAWN_RAMP);
    fallSpeed = Math.min(FALL_MAX, FALL_START + elapsed * FALL_RAMP);
  }

  for (const b of blocks) {
    b.y += fallSpeed * dt;
    const bx = b.x * W, by = b.y * H;
    const hit = by + m.half > m.py && by - m.half < m.py + m.ph &&
                Math.abs(bx - player.x * W) < m.pw / 2 + m.half;
    if (hit) {
      FX.burst(player.x * W, m.py, '#ff2e88', 26);
      FX.burst(bx, by, '#ffffff', 10);
      FX.shake(H * 0.024);
      FX.flash('#ff2e88', 0.22);
      gameOver();
      return;
    }
    if (!b.scored && by > m.py + m.ph) {
      b.scored = true; score++; beep(880, 40);
      FX.burst(bx, m.py + m.ph, '#00e5ff', 8);   // 점수는 소리만이 아니라 눈으로도 보여야 한다
    }
  }
  blocks = blocks.filter(b => b.y < 1.3);
}

function draw(m, dt) {
  // 위상은 여기서 진행시킨다 — draw는 모든 상태에서 매 프레임 불리므로
  // 타이틀·일시정지·게임오버 화면에서도 격자가 흐른다(게이트1이 어디서 찍어도 움직인다).
  gridOff = (gridOff + m.grid * GRID_SCROLL * dt) % m.grid;

  ctx.fillStyle = '#070912';
  ctx.fillRect(0, 0, W, H);

  // 배경 그리드 — 화면이 비지 않게 하고 속도감을 준다
  ctx.strokeStyle = 'rgba(0,229,255,.10)';
  ctx.lineWidth = m.line;
  for (let y = gridOff; y < H; y += m.grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 0; x < W; x += m.grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

  // 깊이감 + 플레이어가 지키는 바닥 선. 화면에 '지켜야 할 곳'을 만들어 준다
  ctx.fillStyle = floorGlow();
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,229,255,.35)';
  ctx.fillRect(0, m.py - m.line * 2, W, m.line * 2);

  for (const b of blocks) {
    const bx = b.x * W, by = b.y * H;
    // 낙하 잔상. 정지 프레임에서도 '떨어지는 중'이 읽히고, 스크린샷 두 장이
    // 서로 달라진다 — 심사용 이미지가 정지 화면처럼 보이지 않게 하는 값싼 방법이다.
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = b.aimed ? '#ff9ec4' : '#ff2e88';
    ctx.fillRect(bx - m.half * 0.45, by - m.half - fallSpeed * H * 0.18, m.half * 0.9, fallSpeed * H * 0.18);
    ctx.globalAlpha = 1;

    ctx.fillStyle = b.aimed ? '#ff62a8' : '#ff2e88';   // 겨냥한 블록은 밝다 — 피할 단서를 준다
    ctx.shadowColor = '#ff2e88';
    ctx.shadowBlur = m.glowB;
    ctx.fillRect(bx - m.half, by - m.half, m.half * 2, m.half * 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.75)';           // 밝은 심. 단색 사각형에 형태가 생긴다
    ctx.fillRect(bx - m.half * 0.34, by - m.half * 0.34, m.half * 0.68, m.half * 0.68);
  }

  // 플레이어 잔상 — 움직일수록 길게 남는다. 조작에 대한 즉각적인 시각 피드백이자
  // 정지 화면 방지책이다. 풀에서 꺼내 쓰므로 할당이 없다.
  const px = player.x * W;
  FX.trail(px, m.py + m.ph / 2, '#0a7f96', m.pw * (0.5 + Math.min(1, Math.abs(player.vx)) * 0.6), m.ph * 0.8, 0.22);

  ctx.fillStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = m.glowP;
  ctx.fillRect(px - m.pw / 2, m.py, m.pw, m.ph);
  ctx.shadowBlur = 0;
  // 진행 방향으로 기우는 날개. 속도를 그대로 그림으로 보여준다
  const lean = Math.max(-1, Math.min(1, player.vx / MAX_SPD));
  ctx.fillStyle = 'rgba(232,246,255,.9)';
  ctx.fillRect(px - m.pw / 2 + lean * m.pw * 0.3 - m.pw * 0.06, m.py - m.ph * 0.35, m.pw * 0.12, m.ph * 0.35);
  ctx.fillRect(px + m.pw / 2 + lean * m.pw * 0.3 - m.pw * 0.06, m.py - m.ph * 0.35, m.pw * 0.12, m.ph * 0.35);
}
/* ===== GAME LOGIC 끝 ===== */

/* ---------- 상태 전이 ---------- */
function start() {
  score = 0;
  el.score.textContent = '0';
  el.title.hidden = true;
  el.over.hidden = true;
  reset();
  state = S.PLAYING;
  Portal.gameplayStart();
}
function pause() { if (state === S.PLAYING) state = S.PAUSED; }
function resume() { if (state === S.PAUSED) state = S.PLAYING; }
function gameOver() {
  state = S.OVER;
  beep(160, 180);
  Portal.gameplayStop();
  if (score > best) { best = score; saveBest(best); el.best.textContent = best; }
  el.finalScore.textContent = score;
  el.over.hidden = false;
}

/* ---------- 루프 ---------- */
let last = 0;
function frame(now) {
  // dt 상한 0.05는 장식이 아니라 터널링 방어다. fallSpeed 상한 0.72와 곱하면
  // 프레임당 낙하가 0.036H인데, 판정이 겹치는 창은 ph + half*2 = 0.0525H다 (여유 1.46배).
  // 상한을 0.073 이상으로 올리거나 fallSpeed 상한을 올리면 블록이 플레이어를 그냥 통과해
  // 죽지 않는 게임이 되고, 그건 게이트 2에서 "방치해도 끝나지 않음"으로 나타난다.
  // 세 값(0.05 · 0.72 · 0.0525H)은 함께 움직인다 — 하나만 만지지 말 것.
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  tick++;
  const m = M();               // 프레임당 한 번만 만든다 (step·draw가 같은 값을 본다)
  if (state === S.PLAYING) {
    step(m, dt);
    el.score.textContent = score;
  }
  // FX는 모든 상태에서 돈다 — 죽은 뒤에도 파편과 흔들림이 끝까지 재생돼야
  // 사망이 '멈춤'이 아니라 '사건'으로 보인다.
  FX.update(dt);
  FX.begin(ctx);
  draw(m, dt);
  FX.draw(ctx);
  FX.end(ctx);
  requestAnimationFrame(frame);
}

/* ---------- 관측 계약: 게이트 2가 읽는 유일한 인터페이스 ---------- */
window.__GAME__ = {
  api: 1,
  get state() { return state; },
  get score() { return score; },
  get tick() { return tick; },
  start, pause, resume
};

resize();
// SDK가 거부하거나 던져도 루프는 시작한다. 여기서 멈추면 화면이 영원히 검은 채로 남는데,
// 포털 빌드에서 그게 가장 나쁜 실패다 — 광고 SDK 하나 때문에 게임이 아예 안 뜬다.
const startLoop = () => requestAnimationFrame(frame);
try {
  Portal.ready().then(startLoop, startLoop);
} catch {
  startLoop();
}
</script>
